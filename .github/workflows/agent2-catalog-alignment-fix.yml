name: Agent 2 Catalog Alignment Fix

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove obsolete environment quote catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/api/dev-fix/solana-graduation-authorization-v2.js')
          s = p.read_text()
          start = s.index('function parseQuoteCatalog() {')
          end = s.index('\nasync function rpcCall', start)
          s = s[:start] + s[end + 1:]
          if 'SOLANA_GRADUATION_QUOTE_CATALOG_JSON' in s or 'function parseQuoteCatalog' in s:
            raise SystemExit('parallel quote catalog removal incomplete')
          p.write_text(s)
          PY
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/api/dev-fix/solana-graduation-authorization-v2.js
          git commit -m 'refactor(solana): remove parallel graduation quote catalog'
          git push origin HEAD:agent2/solana-basic-graduation-market
