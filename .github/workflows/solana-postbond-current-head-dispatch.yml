name: Solana Final Post-Bond Closeout Dispatcher

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/solana-postbond-current-head-dispatch.yml']
  workflow_dispatch:
    inputs:
      execute_confirmation:
        description: 'Exact confirmation: EXECUTE_SOLANA_POSTBOND_CURRENT_HEAD_CLOSEOUT'
        required: true
        type: string
      sol_usd:
        description: 'Operator-attested current SOL/USD reference for devnet normalization'
        required: true
        type: string
      snapshot_delay_seconds:
        required: false
        default: '5'
        type: string
      battle_entry_lamports:
        required: false
        default: '100000000'
        type: string

permissions:
  contents: read

concurrency:
  group: solana-final-postbond-closeout-a528da2
  cancel-in-progress: false

