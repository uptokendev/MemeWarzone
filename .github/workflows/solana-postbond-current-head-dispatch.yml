name: Solana Post-Bond Current-Head Dispatcher

on:
  workflow_dispatch:
    inputs:
      execute_confirmation:
        description: 'Type EXECUTE_SOLANA_POSTBOND_CURRENT_HEAD_CLOSEOUT'
        required: true
        type: string
      source_sha:
        description: 'Reviewed PR #370 head'
        required: true
        default: 'd500cc600c62f95d730a3b34dc425ebad30d8429'
        type: string
      left_campaign: { required: true, type: string }
      left_mint: { required: true, type: string }
      left_meteora_pool: { required: true, type: string }
      left_postgrad_payer: { required: true, type: string }
      left_postgrad_buy_signature: { required: true, type: string }
      left_postgrad_sell_signature: { required: true, type: string }
      right_campaign: { required: true, type: string }
      right_mint: { required: true, type: string }
      right_meteora_pool: { required: true, type: string }
      right_postgrad_payer: { required: true, type: string }
      right_postgrad_buy_signature: { required: true, type: string }
      right_postgrad_sell_signature: { required: true, type: string }
      sol_usd: { required: true, type: string }
      snapshot_delay_seconds: { required: false, default: '5', type: string }
      battle_entry_lamports: { required: false, default: '100000000', type: string }

permissions:
  contents: read

concurrency:
  group: solana-postbond-current-head-d500cc6
  cancel-in-progress: false

jobs:
  closeout:
    if: ${{ github.event.inputs.execute_confirmation == 'EXECUTE_SOLANA_POSTBOND_CURRENT_HEAD_CLOSEOUT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solana_postbond_cert
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d solana_postbond_cert"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      EXPECTED_CERT_SHA: d500cc600c62f95d730a3b34dc425ebad30d8429
      EXPECTED_SOURCE_SHA: 8944382619e05f09539614f5690b98521fe244ed
      SOLANA_APPLICATION_CHAIN_ID: '101'
      SOLANA_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL }}
      SOLANA_REWARDS_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL }}
      SOLANA_REWARDS_AUTHORITY_SECRET_KEY: ${{ secrets.SOLANA_REWARDS_AUTHORITY_SECRET_KEY }}
      SOLANA_REWARDS_RESOLVER_SECRET_KEY: ${{ secrets.SOLANA_POSTBOND_RESOLVER_SECRET_KEY }}
      SOLANA_POSTBOND_OWNER_A_SECRET_KEY: ${{ secrets.SOLANA_POSTBOND_OWNER_A_SECRET_KEY }}
      SOLANA_POSTBOND_OWNER_B_SECRET_KEY: ${{ secrets.SOLANA_POSTBOND_OWNER_B_SECRET_KEY }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/solana_postbond_cert
      SOLANA_POSTBOND_CHAIN_REPORT: reports/solana-postbond-chain-evidence.json
      SOLANA_POSTBOND_MONEY_REPORT: reports/solana-postbond-arena-money.json
      SOLANA_POSTBOND_DB_REPORT: reports/solana-postbond-db-runtime.json
      SOLANA_POSTBOND_CLOSEOUT_MANIFEST: reports/solana-postbond-closeout-manifest.json
      SOLANA_CLOSEOUT_SOL_USD: ${{ inputs.sol_usd }}
      SOLANA_POSTBOND_SNAPSHOT_DELAY_SECONDS: ${{ inputs.snapshot_delay_seconds }}
      SOLANA_ARENA_BATTLE_ENTRY_LAMPORTS: ${{ inputs.battle_entry_lamports }}
      SOLANA_POSTBOND_LEFT_CAMPAIGN: ${{ inputs.left_campaign }}
      SOLANA_POSTBOND_LEFT_MINT: ${{ inputs.left_mint }}
      SOLANA_POSTBOND_LEFT_METEORA_POOL: ${{ inputs.left_meteora_pool }}
      SOLANA_POSTBOND_LEFT_POSTGRAD_PAYER: ${{ inputs.left_postgrad_payer }}
      SOLANA_POSTBOND_LEFT_POSTGRAD_BUY_SIGNATURE: ${{ inputs.left_postgrad_buy_signature }}
      SOLANA_POSTBOND_LEFT_POSTGRAD_SELL_SIGNATURE: ${{ inputs.left_postgrad_sell_signature }}
      SOLANA_POSTBOND_RIGHT_CAMPAIGN: ${{ inputs.right_campaign }}
      SOLANA_POSTBOND_RIGHT_MINT: ${{ inputs.right_mint }}
      SOLANA_POSTBOND_RIGHT_METEORA_POOL: ${{ inputs.right_meteora_pool }}
      SOLANA_POSTBOND_RIGHT_POSTGRAD_PAYER: ${{ inputs.right_postgrad_payer }}
      SOLANA_POSTBOND_RIGHT_POSTGRAD_BUY_SIGNATURE: ${{ inputs.right_postgrad_buy_signature }}
      SOLANA_POSTBOND_RIGHT_POSTGRAD_SELL_SIGNATURE: ${{ inputs.right_postgrad_sell_signature }}
    steps:
      - name: Exact operator gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.execute_confirmation }}" = 'EXECUTE_SOLANA_POSTBOND_CURRENT_HEAD_CLOSEOUT'
          test "${{ inputs.source_sha }}" = "$EXPECTED_CERT_SHA"
      - name: Checkout exact PR 370 head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Prove exact five-file certification delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CERT_SHA"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" HEAD
          git diff --name-only "$EXPECTED_SOURCE_SHA" HEAD | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/solana-postbond-current-head-closeout.yml' \
            'certification/solana-postbond-current-head/arena-money-closeout.mjs' \
            'certification/solana-postbond-current-head/chain-evidence.mjs' \
            'certification/solana-postbond-current-head/db-runtime-closeout.mjs' \
            'certification/solana-postbond-current-head/source-gate.mjs' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --exit-code "$EXPECTED_SOURCE_SHA" HEAD -- programs/memewarzone_solana/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install certification dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock pg@8.16.3 @solana/web3.js@1.95.4 @solana/spl-token@0.4.8 bs58@6.0.0
      - name: Re-prove source boundary
        run: node certification/solana-postbond-current-head/source-gate.mjs
      - name: Bind current devnet fixtures
        run: node certification/solana-postbond-current-head/chain-evidence.mjs
      - name: Plan locked V3 winner
        shell: bash
        run: |
          mkdir -p reports
          node certification/solana-postbond-current-head/db-runtime-closeout.mjs --plan-winner > reports/battle-plan.json
          WINNER=$(node -e "const x=require('./reports/battle-plan.json'); process.stdout.write(x.winnerSide)")
          test "$WINNER" = left -o "$WINNER" = right
          echo "SOLANA_POSTBOND_BATTLE_WINNER=$WINNER" >> "$GITHUB_ENV"
      - name: Execute accepted ArenaMoneyV2 closeout
        run: node certification/solana-postbond-current-head/arena-money-closeout.mjs
      - name: Execute accepted DB runtime closeout
        run: node certification/solana-postbond-current-head/db-runtime-closeout.mjs
      - name: Verify evidence and unchanged source
        shell: bash
        run: |
          test "$(node -e "const x=require('./reports/solana-postbond-closeout-manifest.json');process.stdout.write(x.sourceAuthority)")" = "$EXPECTED_SOURCE_SHA"
          git diff --exit-code -- . ':!reports'
          git diff --exit-code "$EXPECTED_SOURCE_SHA" HEAD -- programs/memewarzone_solana/
          sha256sum reports/*.json | sort > reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solana-postbond-current-head-${{ inputs.source_sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
