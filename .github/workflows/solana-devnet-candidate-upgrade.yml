name: Solana devnet certified candidate upgrade

# Manual devnet-only program upgrade. This never targets mainnet.
# It builds the already-certified source-head SBF, compares live devnet bytes,
# and upgrades in place only when the deployed program differs.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Upgrade devnet if the live program differs from the certified candidate
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: solana-devnet-certified-candidate-upgrade
  cancel-in-progress: false

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: 1.79.0
  SOLANA_LAUNCHPAD_PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_RPC_URL: ${{ vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
  SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
  SOLANA_DEVNET_CANDIDATE_SHA256: e97c8f70a4bd0c6349d7f2f51d91be7e89f23b03187e18dc7f1a6363ac908c27
  SOLANA_DEVNET_CANDIDATE_BYTES: "1124416"
  SOLANA_DEVNET_UPGRADE_EVIDENCE: /tmp/mwz-solana-devnet-upgrade.json
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: 10

jobs:
  upgrade:
    name: Verify / upgrade certified candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: testnet-certification
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Candidate identity
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "program_id=$SOLANA_LAUNCHPAD_PROGRAM_ID"
          echo "certified_sbf_sha256=$SOLANA_DEVNET_CANDIDATE_SHA256"
          echo "certified_sbf_bytes=$SOLANA_DEVNET_CANDIDATE_BYTES"

      - name: Fail closed unless devnet operator secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_DEVNET_PAYER:-}" || {
            echo "BLOCKER: GitHub Environment secret SOLANA_DEVNET_PAYER is not mapped."
            exit 1
          }

      - name: Install Solana operator dependencies
        shell: bash
        run: npm install --prefix tests/solana --no-audit --no-fund

      - name: Materialize devnet upgrade authority
        shell: bash
        run: |
          set -euo pipefail
          operator_file="${RUNNER_TEMP}/mwz-solana-devnet-upgrade-authority.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs
          chmod 600 "$operator_file"
          echo "SOLANA_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install pinned Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install pinned Anchor CLI
        shell: bash
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Build and pin exact certified SBF
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mwz-devnet-certified-sbf"
          mkdir -p "$CARGO_TARGET_DIR"
          anchor build --program-name memewarzone_solana --no-idl
          isolated_so="$CARGO_TARGET_DIR/deploy/memewarzone_solana.so"
          test -s "$isolated_so"
          actual_sha="$(sha256sum "$isolated_so" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$isolated_so" | tr -d ' ')"
          echo "built_sbf_sha256=$actual_sha"
          echo "built_sbf_bytes=$actual_bytes"
          if [ "$actual_sha" != "$SOLANA_DEVNET_CANDIDATE_SHA256" ]; then
            echo "BLOCKER: source-head SBF does not match the certified candidate SHA. Re-certify before any devnet upgrade."
            exit 1
          fi
          if [ "$actual_bytes" != "$SOLANA_DEVNET_CANDIDATE_BYTES" ]; then
            echo "BLOCKER: source-head SBF byte size does not match the certified candidate."
            exit 1
          fi
          mkdir -p target/deploy
          cp "$isolated_so" target/deploy/memewarzone_solana.so
          sha256sum target/deploy/memewarzone_solana.so

      - name: Compare / deploy certified devnet candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.execute }}" = "true" ]; then
            node scripts/solana/upgrade-devnet-launchpad.cjs --execute
          else
            node scripts/solana/upgrade-devnet-launchpad.cjs
          fi

      - name: Upload devnet upgrade evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solana-devnet-candidate-upgrade-${{ github.sha }}
          path: /tmp/mwz-solana-devnet-upgrade.json
          if-no-files-found: warn
          retention-days: 14
