name: Agent2 Graduation Source Formatter

on:
  push:
    branches:
      - 'agent/solana-agent2-basic-graduation-cert'

permissions:
  contents: write

jobs:
  format-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.79.0 --profile minimal
          rustup component add rustfmt --toolchain 1.79.0
      - name: Apply deterministic safety corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('programs/memewarzone_solana/src/graduation.rs')
          s = p.read_text()

          # 1) Persist the operator balance immediately before campaign graduation SOL is staged.
          marker = 'pub struct GraduationState {'
          a = s.index(marker)
          b = s.index('\n}', a)
          block = s[a:b]
          old = '    pub quote_recovery_account: Pubkey,\n'
          new = old + '    pub authority_lamports_before: u64,\n'
          if 'authority_lamports_before' not in block:
              if old not in block:
                  raise SystemExit('GraduationState insertion marker missing')
              block = block.replace(old, new, 1)
              s = s[:a] + block + s[b:]

          # 2) Capture the pre-staging authority lamport balance after the exact transfer amount is known.
          old = '''    move_program_owned_lamports(&ctx.accounts.sol_vault.to_account_info(), &ctx.accounts.authority.to_account_info(), quote.max_liquidity_lamports)?;\n\n    let state = &mut ctx.accounts.graduation_state;'''
          new = '''    let authority_lamports_before = ctx.accounts.authority.lamports();\n    move_program_owned_lamports(&ctx.accounts.sol_vault.to_account_info(), &ctx.accounts.authority.to_account_info(), quote.max_liquidity_lamports)?;\n\n    let state = &mut ctx.accounts.graduation_state;'''
          if 'let authority_lamports_before = ctx.accounts.authority.lamports();' not in s:
              if old not in s:
                  raise SystemExit('pre-staging balance marker missing')
              s = s.replace(old, new, 1)

          # 3) Persist captured balance in GraduationState.
          old = 'state.quote_recovery_account = args.quote_recovery_account; state.authorization_hash = digest;'
          new = 'state.quote_recovery_account = args.quote_recovery_account; state.authority_lamports_before = authority_lamports_before; state.authorization_hash = digest;'
          if 'state.authority_lamports_before = authority_lamports_before;' not in s:
              if old not in s:
                  raise SystemExit('state assignment marker missing')
              s = s.replace(old, new, 1)

          # 4) Non-native exact-in must actually consume the staged campaign SOL; it cannot remain with the operator.
          old = 'let native_quote = is_native_quote(state.quote_mint);\n    if native_quote {'
          new = '''let native_quote = is_native_quote(state.quote_mint);\n    if !native_quote {\n        require!(ctx.accounts.authority.lamports() <= state.authority_lamports_before, LaunchpadError::GraduationAssetMismatch);\n    }\n    if native_quote {'''
          if 'ctx.accounts.authority.lamports() <= state.authority_lamports_before' not in s:
              if old not in s:
                  raise SystemExit('confirm balance invariant marker missing')
              s = s.replace(old, new, 1)

          # 5) Preserve precision in the quote/USD deviation calculation.
          old = '''final_spot_nano.checked_mul(u128::from(sol_usd_micros)).ok_or(LaunchpadError::MathOverflow)?.checked_div(1_000_000_000_000_000_000u128).ok_or(LaunchpadError::MathOverflow)?.checked_mul(quote_scale).ok_or(LaunchpadError::MathOverflow)?.checked_div(u128::from(quote_usd_micros)).ok_or(LaunchpadError::MathOverflow)?'''
          new = '''final_spot_nano.checked_mul(u128::from(sol_usd_micros)).ok_or(LaunchpadError::MathOverflow)?.checked_div(u128::from(quote_usd_micros)).ok_or(LaunchpadError::MathOverflow)?.checked_mul(quote_scale).ok_or(LaunchpadError::MathOverflow)?.checked_div(1_000_000_000_000_000_000u128).ok_or(LaunchpadError::MathOverflow)?'''
          if old not in s:
              if new not in s:
                  raise SystemExit('quote deviation precision marker missing')
          else:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Format and validate
        run: |
          rustfmt +1.79.0 --edition 2021 programs/memewarzone_solana/src/graduation.rs
          rustfmt +1.79.0 --edition 2021 --check programs/memewarzone_solana/src/graduation.rs
          git diff --check
      - name: Commit formatted source only
        run: |
          git config user.name 'MemeWarzone Agent2 Cert'
          git config user.email 'actions@users.noreply.github.com'
          git add programs/memewarzone_solana/src/graduation.rs
          git commit -m 'chore(cert): rustfmt agent2 graduation core [skip ci]'
          git push origin HEAD:agent/solana-agent2-basic-graduation-cert
