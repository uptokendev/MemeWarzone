name: Agent3 Tournament Destructive Execution

on:
  push:
    branches:
      - 'agent/solana-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_AUTHORITY: 8eefcc4b49d30f70bda64f4e6f3e647c26de24eb

jobs:
  tournament-runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact source authority and acceptance-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_AUTHORITY" HEAD
          git diff --name-only "$SOURCE_AUTHORITY"...HEAD | tee /tmp/agent3-delta.txt
          test "$(grep -Ev '^(\.github/workflows/agent3-tournament-destructive-retry\.yml|\.github/workflows/agent3-arena-money-v2-devnet-reread\.yml|\.github/workflows/solana-final-launch-blockers\.yml|frontend/scripts/agent3-tournament-only-solana-devnet\.mjs|frontend/scripts/agent3-tournament-only-bsc97\.mjs)$' /tmp/agent3-delta.txt | wc -l)" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Certify Normal Tournament / Vote Tournament / Final Salvo only
        working-directory: frontend
        run: |
          set -euo pipefail
          node --test api/lib/arenaTournamentV2Certification.test.mjs
          node --test api/lib/arenaFinalSalvoRuntime.test.mjs
      - name: Certify Tournament-facing sponsorship authority
        working-directory: frontend
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const api=fs.readFileSync('api/arenaSponsorships.js','utf8');
          assert.match(api,/eventType === "normal_tournament" \|\| eventType === "vote_tournament"/);
          assert.match(api,/prizeBps:\s*7000, marketingOpsBps:\s*2000, protocolBps:\s*1000/);
          assert.doesNotMatch(api,/eventType === "normal_battle"|eventType === "battle"/);
          console.log(JSON.stringify({tournamentEventTypes:true,split:'70/20/10',battleSponsorshipAbsent:true},null,2));
          NODE
      - name: Save runtime evidence
        shell: bash
        run: |
          mkdir -p reports
          printf '{"sourceAuthority":"%s","executionHead":"%s","normalTournament":true,"voteTournament":true,"finalSalvo":true,"battleLaneTouched":false}\n' "$SOURCE_AUTHORITY" "$(git rev-parse HEAD)" > reports/agent3-tournament-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-runtime-certification
          path: reports/agent3-tournament-runtime.json
          if-no-files-found: error

  bsc97-tournament-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet-certification
    env:
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      EVM_TESTNET_PRIVATE_KEY: ${{ secrets.EVM_TESTNET_PRIVATE_KEY }}
      AGENT3_TOURNAMENT_BSC97_OUT: reports/agent3-tournament-bsc97.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove source authority
        run: git merge-base --is-ancestor "$SOURCE_AUTHORITY" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Execute Tournament-only BSC97 destructive money acceptance
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/agent3-tournament-only-bsc97.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-bsc97
          path: frontend/reports/agent3-tournament-bsc97.json
          if-no-files-found: error

  solana-devnet-tournament-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: airdrop-solana-devnet
    env:
      SOLANA_REWARDS_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL }}
      SOLANA_REWARDS_AUTHORITY_SECRET_KEY: ${{ secrets.SOLANA_REWARDS_AUTHORITY_SECRET_KEY }}
      AGENT3_TOURNAMENT_SOLANA_OUT: reports/agent3-tournament-solana-devnet.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove source authority
        run: git merge-base --is-ancestor "$SOURCE_AUTHORITY" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Execute Tournament-only Solana devnet destructive money acceptance
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/agent3-tournament-only-solana-devnet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-solana-devnet
          path: frontend/reports/agent3-tournament-solana-devnet.json
          if-no-files-found: error
