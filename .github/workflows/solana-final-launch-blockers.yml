name: Agent3 Tournament Destructive Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/solana-final-launch-blockers.yml'
      - 'frontend/scripts/agent3-tournament-only-bsc97.mjs'
      - 'frontend/scripts/agent3-tournament-only-solana-devnet.mjs'

permissions:
  contents: read

env:
  SOURCE_AUTHORITY: 8eefcc4b49d30f70bda64f4e6f3e647c26de24eb

jobs:
  tournament-runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout acceptance harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_AUTHORITY }}
          path: source
      - name: Prove exact source
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_AUTHORITY"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Install exact-source dependencies
        working-directory: source/frontend
        run: npm ci
      - name: Normal Tournament / Vote Tournament / Final Salvo exact-source certification
        working-directory: source/frontend
        run: |
          set -euo pipefail
          node --test api/lib/arenaTournamentV2Certification.test.mjs
          node --test api/lib/arenaFinalSalvoRuntime.test.mjs
      - name: Tournament sponsorship exact-source authority
        working-directory: source/frontend
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const api=fs.readFileSync('api/arenaSponsorships.js','utf8');
          assert.match(api,/eventType === "normal_tournament" \|\| eventType === "vote_tournament"/);
          assert.match(api,/prizeBps:\s*7000, marketingOpsBps:\s*2000, protocolBps:\s*1000/);
          assert.doesNotMatch(api,/eventType === "normal_battle"|eventType === "battle"/);
          console.log(JSON.stringify({source:process.env.SOURCE_AUTHORITY,split:'70/20/10',battleSponsorshipAbsent:true,solanaPublicQuoteRejects:/SPONSORSHIP_CHAIN_NOT_SUPPORTED/.test(api)},null,2));
          NODE
      - name: Save runtime artifact
        run: |
          mkdir -p source/reports
          printf '{"sourceAuthority":"%s","normalTournament":true,"voteTournament":true,"finalSalvo":true,"normalBattleExecuted":false}\n' "$SOURCE_AUTHORITY" > source/reports/agent3-tournament-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-runtime-certification
          path: source/reports/agent3-tournament-runtime.json
          if-no-files-found: error

  bsc97-tournament-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet-certification
    env:
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      EVM_TESTNET_PRIVATE_KEY: ${{ secrets.EVM_TESTNET_PRIVATE_KEY }}
      AGENT3_TOURNAMENT_BSC97_OUT: reports/agent3-tournament-bsc97.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_AUTHORITY }}
          path: source
      - name: Overlay acceptance harness, product source remains pinned
        run: cp harness/frontend/scripts/agent3-tournament-only-bsc97.mjs source/frontend/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - working-directory: source/frontend
        run: npm ci
      - name: Execute BSC97 Tournament-only destructive money acceptance
        working-directory: source/frontend
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/agent3-tournament-only-bsc97.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-bsc97
          path: source/frontend/reports/agent3-tournament-bsc97.json
          if-no-files-found: error

  solana-devnet-tournament-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: airdrop-solana-devnet
    env:
      SOLANA_REWARDS_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL }}
      SOLANA_REWARDS_AUTHORITY_SECRET_KEY: ${{ secrets.SOLANA_REWARDS_AUTHORITY_SECRET_KEY }}
      AGENT3_TOURNAMENT_SOLANA_OUT: reports/agent3-tournament-solana-devnet.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_AUTHORITY }}
          path: source
      - name: Overlay acceptance harness, product source remains pinned
        run: cp harness/frontend/scripts/agent3-tournament-only-solana-devnet.mjs source/frontend/scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - working-directory: source/frontend
        run: npm ci
      - name: Execute Solana devnet Tournament-only destructive money acceptance
        working-directory: source/frontend
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/agent3-tournament-only-solana-devnet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-solana-devnet
          path: source/frontend/reports/agent3-tournament-solana-devnet.json
          if-no-files-found: error
