name: devpostgrad proof gate

on:
  push:
    branches:
      - devpostgrad
  workflow_dispatch:
    inputs:
      exhaustive:
        description: Run coverage, gas, simulations, and generated-artifact checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: devpostgrad-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-core:
    name: contracts core proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout devpostgrad source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm run test

      - name: Check contract sizes
        run: npm run size

      - name: Validate security access matrix
        run: npm run security:matrix

      - name: Run repository security checks
        run: npm run security:check

  frontend-core:
    name: frontend core proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout devpostgrad source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend --package-lock=false --no-audit --no-fund

      - name: Check API imports
        run: npm --prefix frontend run check:api-imports

      - name: Check post-grad API preservation
        run: npm --prefix frontend run check:postgrad-api-preservation

      - name: Check post-grad independent API ownership
        run: npm --prefix frontend run check:postgrad-independent-api

      - name: Check post-grad routing readiness
        run: npm --prefix frontend run check:postgrad-routing

      - name: Check post-grad economics readiness
        run: npm --prefix frontend run check:postgrad-economics

      - name: Check local hybrid gateway
        run: npm --prefix frontend run check:localdev-gateway

      - name: Test wallet provider discovery
        run: npm --prefix frontend run test:wallet-discovery

      - name: Build public application
        run: npm --prefix frontend run build

  exhaustive:
    name: exhaustive proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exhaustive }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout devpostgrad source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Run gas report
        run: npm run gas

      - name: Run economic simulations
        run: npm run economics:simulate:suite

      - name: Export indexer schema
        run: npm run indexer:schema

      - name: Upload generated proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devpostgrad-proof-${{ github.sha }}
          if-no-files-found: warn
          path: |
            coverage/
            gas-report.txt
            output/
            generated/
