name: Agent 1 Final Salvo Five-Step

on:
  push:
    branches:
      - agent1/final-salvo-five-step
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base

permissions:
  contents: read

jobs:
  final-salvo-five-step:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact base and forbidden-scope preservation
        shell: bash
        run: |
          set -euo pipefail
          INTEGRATION_REF=origin/build/cross-chain-stabilization-rh-base
          git rev-parse --verify "$INTEGRATION_REF" >/dev/null
          BASE=$(git merge-base "$INTEGRATION_REF" HEAD)
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/final-salvo-files.txt

          AUTHORIZED_STAGING_LANE=false
          if [[ "${{ github.event.pull_request.number || '' }}" == "286" || "${{ github.head_ref || '' }}" == "agent1/warzone-runtime-three-chain-acceptance-d37dcf7" ]]; then
            AUTHORIZED_STAGING_LANE=true
          fi

          final_salvo_authority=(
            frontend/api/arenaFinalSalvo.js
            frontend/api/lib/arenaFinalSalvoFinalizer.js
            frontend/api/lib/arenaFinalSalvoRuntime.mjs
          )
          if [[ "$AUTHORIZED_STAGING_LANE" != "true" ]]; then
            for path in "${final_salvo_authority[@]}"; do
              if ! git diff --quiet "$BASE"...HEAD -- "$path"; then
                echo "Final Salvo authority file changed outside its dedicated lane: $path" >&2
                exit 1
              fi
            done
          fi

          forbidden_exact=(
            .github/workflows/agent3-bnb-postgrad-routing.yml
            db/migrations/202609080003_bnb_postgrad_quote_identity.sql
            frontend/src/lib/bnbTopazQuoteRouting.mjs
            frontend/src/lib/bnbTopazQuoteRouting.test.mjs
            frontend/src/lib/topazV2Trade.ts
            realtime-indexer/src/bnbPostGradQuoteIdentity.test.mjs
            .github/workflows/agent5-bnb-battle-claim-recovery.yml
            frontend/api/dev-fix/reward-claim-battle-router.js
            frontend/api/dev-fix/reward-claim-intent-generic.js
            frontend/api/dev-fix/reward-claim-intent.js
            frontend/api/lib/bnbBattleClaimRecovery.integration.test.mjs
            frontend/api/lib/bnbBattleClaimRecovery.js
            frontend/api/lib/rewardClaimVerification.js
            hardhat.agent5-claim-recovery.config.cjs
          )
          if [[ "$AUTHORIZED_STAGING_LANE" != "true" ]]; then
            forbidden_exact+=(
              .github/workflows/agent1-vote-tournament-three-chain-identity.yml
              frontend/api/arenaTournamentVotes.js
              frontend/api/arenaVoteTournamentIdentityGate.js
              frontend/api/lib/arenaVoteTournamentChainIdentity.js
              frontend/api/lib/arenaVoteTournamentChainIdentity.test.mjs
            )
          fi
          for path in "${forbidden_exact[@]}"; do
            if grep -Fxq "$path" /tmp/final-salvo-files.txt; then
              echo "Forbidden preservation file changed: $path" >&2
              exit 1
            fi
          done

          if grep -E '(^|/)(claim|claims|graduation|imports?|dashboard|mwl|quarterly|sponsorship)(/|[-_.])' /tmp/final-salvo-files.txt; then
            echo "Forbidden scope path changed" >&2
            exit 1
          fi

          if [[ "$AUTHORIZED_STAGING_LANE" == "true" ]]; then
            allowed='^(.github/workflows/agent1-(final-salvo-five-step|normal-tournament-chain-identity|warzone-runtime-three-chain-acceptance)\.yml|frontend/api/arenaFinalSalvo\.js|frontend/api/arenaTournamentAdminContract\.test\.mjs|frontend/api/arenaVoteTournamentIdentityGate\.js|frontend/api/lib/arenaChainEnvironment\.js|frontend/api/lib/arenaFinalSalvoRuntime\.(mjs|test\.mjs)|frontend/api/lib/arenaStagingIdentityCompletion\.test\.mjs|frontend/api/lib/arenaVoteTournamentChainIdentity(\.js|\.test\.mjs))$'
            if grep -Ev "$allowed" /tmp/final-salvo-files.txt; then
              echo "PR #286 contains a file outside the authorized staging-identity scope" >&2
              exit 1
            fi
          fi

          grep -Eq 'import arenaFinalSalvo from "./arenaFinalSalvo.js"' frontend/api/postgrad.js
          grep -Eq 'final-salvo' frontend/api/postgrad.js

      - name: Syntax checks
        run: |
          node --check frontend/api/lib/arenaChainEnvironment.js
          node --check frontend/api/arenaVoteTournamentIdentityGate.js
          node --check frontend/api/arenaFinalSalvo.js
          node --check frontend/api/lib/arenaFinalSalvoFinalizer.js
          node --check frontend/api/lib/arenaFinalSalvoRuntime.mjs

      - name: Staging identity completion matrix
        run: node --test frontend/api/lib/arenaStagingIdentityCompletion.test.mjs

      - name: Final Salvo five-step certification
        run: node --test frontend/api/lib/arenaFinalSalvoRuntime.test.mjs

      - name: Normal Tournament PR 240 regression
        run: node --test frontend/api/lib/arenaTournamentChainIdentity.test.mjs

      - name: Vote Tournament PR 264 regression
        run: node --test frontend/api/lib/arenaVoteTournamentChainIdentity.test.mjs
