name: Agent 6 Command Center Claim Patch

on:
  push:
    branches:
      - agent6/all-launch-claims-three-chain

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent6/all-launch-claims-three-chain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused Command Center fix
        run: python3 scripts/agent6_command_center_claim_patch.py
      - name: Validate frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm --prefix frontend run build
      - name: Commit product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/pages/command-center/CommandCenterClaims.tsx
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(claims): use fresh League record authorization"
          git push origin HEAD:agent6/all-launch-claims-three-chain
