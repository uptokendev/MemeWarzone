name: Agent 2 PR289 final funded golden v3

on:
  push:
    branches:
      - cert/agent2-pr289-final-exact-head-20260911
    paths:
      - .github/workflows/agent2-pr289-final-funded-golden-v3.yml

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  PR_HEAD: f18505e39186a5fa73fd89f00b242b94782f2f2c
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  OPERATOR: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  CAMPAIGN: So9RKvmBQAwnCRtY4qBteNiS7gFFic4JvjxjN9hHHLk
  MINT: FVEBya7Kz2CYMKLK65PZbsixsCgHjAvpGDLNSoXPm824
  CREATE_SIG: 5F7QHoM1tBAhUNRFfHhtFR4FJ8dM7CBCMLEjv7HFW6f3d8p4jwB8EgvbBFs2dUJLKdjr9v6erQ81QhS8yWrTYDJi
  REUSABLE_ALT: ALA7wQRuPdHWzLLpyDwbw7kPbJB7pCp1zNyzrNZApoiA

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact clean PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | tr '\n' ' ')" = "tools/solana-meteora-graduation/graduate-basic-quote.mjs "
          test "$(git diff --numstat "$BASE_SHA"..HEAD -- tools/solana-meteora-graduation/graduate-basic-quote.mjs)" = $'5\t1\ttools/solana-meteora-graduation/graduate-basic-quote.mjs'
          test -z "$(git diff --name-only "$BASE_SHA"..HEAD -- programs/memewarzone_solana programs/mwz_rewards_treasury)"
          echo EXACT_CLEAN_HEAD=YES
          echo PROGRAMS_UNCHANGED=YES
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build IDL only
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --silent @coral-xyz/anchor-cli@0.30.1
          rustup toolchain install nightly-2024-05-09 --profile minimal
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN=nightly-2024-05-09 anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/idl/memewarzone_solana.json
          test ! -e target/deploy/memewarzone_solana.so
      - name: Read existing campaign and funding only - no broadcast
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/operator.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$f" node scripts/solana/materialize-devnet-payer.mjs >/dev/null
          OPFILE="$f" node - <<'NODE' | tee /tmp/pr289-readonly-preflight.log
          const fs=require('fs');
          const anchor=require('./tests/solana/node_modules/@coral-xyz/anchor');
          const web3=require('./tests/solana/node_modules/@solana/web3.js');
          const spl=require('./tests/solana/node_modules/@solana/spl-token');
          const bs58mod=require('./tests/solana/node_modules/bs58'); const bs58=bs58mod.default||bs58mod;
          const {Connection,PublicKey,Keypair,VersionedTransaction}=web3;
          const {getAssociatedTokenAddressSync}=spl;
          const {AnchorProvider,Program,Wallet,BN}=anchor;
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          const PID=new PublicKey(process.env.PROGRAM_ID),OP=new PublicKey(process.env.OPERATOR),CAMP=new PublicKey(process.env.CAMPAIGN),MINT=new PublicKey(process.env.MINT),ALT=new PublicKey(process.env.REUSABLE_ALT);
          (async()=>{
            const genesis=await c.getGenesisHash(); console.log('GENESIS',genesis); if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG')throw new Error('wrong cluster');
            const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.OPFILE,'utf8')))); if(!kp.publicKey.equals(OP))throw new Error('approved operator mismatch');
            const balance=await c.getBalance(OP,'confirmed'); console.log('CURRENT_OPERATOR_BALANCE',balance);
            const tx=await c.getTransaction(process.env.CREATE_SIG,{commitment:'confirmed',maxSupportedTransactionVersion:0}); if(!tx||tx.meta?.err)throw new Error('CREATE absent/failed');
            const logs=tx.meta.logMessages||[]; if(!logs.some(x=>x.includes('Instruction: CreateCampaign')))throw new Error('not CREATE');
            const keys=tx.transaction.message.getAccountKeys({accountKeysFromLookups:tx.meta.loadedAddresses}); const a=Array.from({length:keys.length},(_,i)=>keys.get(i).toBase58()); if(!a.includes(CAMP.toBase58())||!a.includes(MINT.toBase58())||!a.includes(OP.toBase58()))throw new Error('CREATE identity mismatch');
            console.log('CREATE_STATUS','SUCCESS'); console.log('CREATE_SLOT',tx.slot); console.log('CREATE_BLOCK_TIME',tx.blockTime); console.log('CREATE_VERSION',String(tx.version)); console.log('CREATE_BLOCKHASH',tx.transaction.message.recentBlockhash); console.log('CREATE_CU',tx.meta.computeUnitsConsumed??'unknown'); console.log('CREATE_ALTS',(tx.transaction.message.addressTableLookups||[]).map(x=>x.accountKey.toBase58()).join(',')||'NONE');
            try{const vt=new VersionedTransaction(tx.transaction.message);vt.signatures=tx.transaction.signatures.map(s=>Uint8Array.from(bs58.decode(String(s))));console.log('CREATE_RECONSTRUCTED_PACKET_BYTES',vt.serialize().length)}catch(e){console.log('CREATE_RECONSTRUCTED_PACKET_BYTES','UNAVAILABLE:'+e.message)}
            console.log('CREATE_ORIGINAL_LVH','IRRETRIEVABLE'); console.log('CREATE_ORIGINAL_SIMULATION','IRRETRIEVABLE');
            const idl=JSON.parse(fs.readFileSync('target/idl/memewarzone_solana.json','utf8')); const provider=new AnchorProvider(c,new Wallet(kp),{commitment:'confirmed'}); const program=new Program(idl,provider); const s=await program.account.campaign.fetch(CAMP); const v=x=>BN.isBN(x)?x.toString():x?.toBase58?x.toBase58():String(x);
            console.log('CAMPAIGN_CREATOR',v(s.creator)); console.log('CAMPAIGN_MINT',v(s.mint)); console.log('SOLD_TOKENS',v(s.soldTokens)); console.log('NET_RAISED',v(s.netRaisedLamports)); console.log('CREATOR_LOCK_UNTIL',v(s.creatorBuyLockUntil)); console.log('CREATOR_BUY_CAP_BPS',v(s.creatorBuyCapBps)); console.log('CURVE_CLOSED',String(s.curveClosed)); console.log('GRADUATED',String(s.graduated));
            const slot=await c.getSlot('confirmed'),now=(await c.getBlockTime(slot))||Math.floor(Date.now()/1000);console.log('CHAIN_TIME',now);console.log('CREATOR_LOCK_SECONDS_REMAINING',Math.max(0,Number(v(s.creatorBuyLockUntil))-now));
            const ata=getAssociatedTokenAddressSync(MINT,OP),ai=await c.getAccountInfo(ata,'confirmed'),ataRent=ai?0:await c.getMinimumBalanceForRentExemption(165,'confirmed'); console.log('OPERATOR_ATA',ata.toBase58(),ai?'EXISTS':'MISSING'); console.log('ATA_RENT_REQUIRED',ataRent);
            const authSize=188,authRent=await c.getMinimumBalanceForRentExemption(authSize,'confirmed'); console.log('TRADE_AUTH_SIZE',authSize); console.log('TRADE_AUTH_RENT_EACH',authRent);
            const alt=(await c.getAddressLookupTable(ALT,{commitment:'confirmed'})).value;if(!alt)throw new Error('ALT missing');console.log('ALT_STATE',ALT.toBase58(),'addresses='+alt.state.addresses.length,'deactivationSlot='+String(alt.state.deactivationSlot));
            const conservative=5000000+ataRent+2*authRent+10000; const add=Math.max(0,conservative-balance);console.log('CONSERVATIVE_MIN_START_BALANCE',conservative);console.log('CONSERVATIVE_MIN_ADDITIONAL',add);console.log('CONSERVATIVE_MIN_ADDITIONAL_SOL',(add/1e9).toFixed(9));console.log('BROADCAST_PERFORMED','NO');
          })().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-pr289-readonly-preflight
          path: /tmp/pr289-readonly-preflight.log
          if-no-files-found: warn
          retention-days: 14
