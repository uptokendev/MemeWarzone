name: Repair frontend lockfile for V0 release proof

on:
  push:
    branches:
      - fix/solana-v0-transaction-normalization
    paths:
      - .github/workflows/fix-frontend-lock-v0.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/solana-v0-transaction-normalization
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate lock metadata only
        run: npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Require npm ci compatibility
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile if needed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "frontend/package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: synchronize frontend package lock"
          git push origin HEAD:fix/solana-v0-transaction-normalization
