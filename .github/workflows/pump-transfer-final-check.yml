name: Pump transfer final check

on:
  push:
    branches:
      - preview/import-review-c15d5edd
    paths:
      - frontend/api/lib/projectImportAssessment.js
      - frontend/api/lib/projectImportAssessment.test.mjs
      - frontend/api/lib/projectImportPumpChallenge.js
      - frontend/api/lib/projectImportPumpChallenge.test.mjs
      - frontend/api/projectImports.js
      - frontend/api/lib/projectImportSecurity.js
      - frontend/src/lib/projectImports.ts
      - frontend/src/pages/ProjectImport.tsx
      - frontend/src/project-imports-ui.test.mjs
      - .github/workflows/pump-transfer-final-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci
      - name: Focused import tests
        working-directory: frontend
        run: node --test api/lib/projectImportPumpChallenge.test.mjs api/lib/projectImportAssessment.test.mjs src/project-imports-ui.test.mjs api/lib/projectImportHttp.test.mjs api/lib/projectImportRiskRegression.test.mjs
      - name: Frontend build
        working-directory: frontend
        run: npm run build
