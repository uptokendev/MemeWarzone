name: Agent 2 Basic Graduation Certification

on:
  push:
    branches:
      - cert/agent2-basic-graduation-final

permissions:
  contents: read

jobs:
  devnet-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b81ee75a4f8c6c5bc8a99a6b2be70b75ef9e3149
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect canonical Solana devnet USDC funding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const rpc='https://api.devnet.solana.com';
          const owner='HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9';
          const mint='4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU';
          async function call(method,params){const r=await fetch(rpc,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(!r.ok)throw new Error(`${method} HTTP ${r.status}`);const j=await r.json();if(j.error)throw new Error(`${method}: ${JSON.stringify(j.error)}`);return j.result;}
          const genesis=await call('getGenesisHash',[]);
          if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error(`not devnet: ${genesis}`);
          const accounts=await call('getTokenAccountsByOwner',[owner,{mint},{encoding:'jsonParsed',commitment:'confirmed'}]);
          let raw=0n;
          for(const a of accounts.value||[]) raw+=BigInt(a.account.data.parsed.info.tokenAmount.amount);
          console.log(`cluster=devnet`);
          console.log(`operator=${owner}`);
          console.log(`canonical_devnet_usdc_mint=${mint}`);
          console.log(`operator_usdc_raw=${raw}`);
          console.log(`operator_usdc=${Number(raw)/1e6}`);
          console.log(`stable_live_route_prefunded=${raw>0n?'YES':'NO'}`);
          NODE
