name: Agent 2 Basic Graduation Certification

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: read

env:
  BASE_SHA: e0a3107a77fb2b3ce066de6b3bd305a6018bdc14
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Install pinned Solana CLI
        shell: bash
        run: |
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Source and unit gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p memewarzone_solana --lib
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
          node --check tools/solana-meteora-graduation/graduate-basic-quote.mjs
      - name: Build candidate SBF
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          test -s target/deploy/memewarzone_solana.so
          candidate_bytes=$(wc -c < target/deploy/memewarzone_solana.so | tr -d ' ')
          candidate_sha=$(sha256sum target/deploy/memewarzone_solana.so | awk '{print $1}')
          echo "CANDIDATE_BYTES=$candidate_bytes" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA256=$candidate_sha" >> "$GITHUB_ENV"
      - name: Build exact baseline SBF
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/mwz-agent2-base "$BASE_SHA"
          cd /tmp/mwz-agent2-base
          anchor build --program-name memewarzone_solana --no-idl
          test -s target/deploy/memewarzone_solana.so
          baseline_bytes=$(wc -c < target/deploy/memewarzone_solana.so | tr -d ' ')
          baseline_sha=$(sha256sum target/deploy/memewarzone_solana.so | awk '{print $1}')
          echo "BASELINE_BYTES=$baseline_bytes" >> "$GITHUB_ENV"
          echo "BASELINE_SHA256=$baseline_sha" >> "$GITHUB_ENV"
      - name: Read devnet ProgramData allocation and extension rent
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/programdata.json
          const rpc = 'https://api.devnet.solana.com';
          const programId = process.env.PROGRAM_ID;
          const candidateBytes = Number(process.env.CANDIDATE_BYTES);
          async function call(method, params) {
            const r = await fetch(rpc, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
            if (!r.ok) throw new Error(`${method} HTTP ${r.status}`);
            const j = await r.json();
            if (j.error) throw new Error(`${method}: ${JSON.stringify(j.error)}`);
            return j.result;
          }
          function b58(bytes) {
            const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
            let x=0n; for (const b of bytes) x=(x<<8n)+BigInt(b);
            let s=''; while(x>0){const m=Number(x%58n);s=alphabet[m]+s;x/=58n;}
            for(const b of bytes){if(b===0)s='1'+s;else break;} return s||'1';
          }
          const prog = await call('getAccountInfo',[programId,{encoding:'base64',commitment:'confirmed'}]);
          if (!prog.value) throw new Error('program account missing on devnet');
          const pdata = Buffer.from(prog.value.data[0],'base64');
          if (pdata.length < 36 || pdata.readUInt32LE(0) !== 2) throw new Error(`unexpected UpgradeableLoader Program state len=${pdata.length} tag=${pdata.readUInt32LE(0)}`);
          const programDataAddress=b58(pdata.subarray(4,36));
          const pdi=await call('getAccountInfo',[programDataAddress,{encoding:'base64',commitment:'confirmed'}]);
          if(!pdi.value) throw new Error('ProgramData account missing on devnet');
          const raw=Buffer.from(pdi.value.data[0],'base64');
          const metadataBytes=45;
          if(raw.length < metadataBytes) throw new Error(`ProgramData too small: ${raw.length}`);
          const capacity=raw.length-metadataBytes;
          const extensionRequired=candidateBytes>capacity;
          const targetLen=candidateBytes+metadataBytes;
          const targetRent=extensionRequired ? await call('getMinimumBalanceForRentExemption',[targetLen,{commitment:'confirmed'}]) : pdi.value.lamports;
          const extensionRentLamports=extensionRequired ? Math.max(0,targetRent-pdi.value.lamports) : 0;
          console.log(JSON.stringify({programId,programDataAddress,programDataDataLength:raw.length,programBinaryCapacityBytes:capacity,currentProgramDataLamports:pdi.value.lamports,candidateBytes,extensionRequired,targetProgramDataLength:targetLen,targetRentLamports,extensionRentLamports},null,2));
          NODE
          cat /tmp/programdata.json
      - name: Write certification artifact
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "starting_sha=$BASE_SHA"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "baseline_bytes=$BASELINE_BYTES"
            echo "candidate_bytes=$CANDIDATE_BYTES"
            echo "baseline_sha256=$BASELINE_SHA256"
            echo "candidate_sha256=$CANDIDATE_SHA256"
            cat /tmp/programdata.json
          } | tee agent2-certification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent2-basic-graduation-certification
          path: agent2-certification.txt
          retention-days: 7
