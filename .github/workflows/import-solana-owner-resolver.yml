name: Import Solana Owner Resolver

on:
  pull_request:
    paths:
      - "frontend/api/lib/projectOwnershipResolveSolana.js"
      - "frontend/api/lib/projectOwnershipResolveSolana.test.mjs"
      - ".github/workflows/import-solana-owner-resolver.yml"

jobs:
  ownership-resolver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies without mutating lockfile
        working-directory: frontend
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Run focused read-only ownership tests
        working-directory: frontend
        run: node --test api/lib/projectOwnershipResolveSolana.test.mjs
