name: Agent 2 Normal Battle Destructive Closeout

on:
  workflow_dispatch:
    inputs:
      network:
        description: Destructive staging rail
        required: true
        type: choice
        options:
          - bsc97
          - solana-devnet
      confirmation:
        description: Type RUN_AGENT2_NORMAL_BATTLE_DESTRUCTIVE
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_BASE_SHA: 8eefcc4b49d30f70bda64f4e6f3e647c26de24eb

jobs:
  bsc97-market-evidence:
    if: ${{ inputs.network == 'bsc97' }}
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      DEPLOYER_PK: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_TESTNET_RPC: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
      BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
      BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard authority and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_AGENT2_NORMAL_BATTLE_DESTRUCTIVE"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          echo "head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy isolated BSC97 source-head staging stack
        env:
          BNB_6C_ALLOW_SOURCE_HEAD_BROADCAST: "true"
          BNB_6C_ACK_CONTROLLED_TOPAZ: "true"
        run: npx hardhat run scripts/deploy-bnb-testnet-stage.ts --network bscTestnet
      - name: Verify isolated BSC97 staging stack
        env:
          BNB_6C_ALLOW_SOURCE_HEAD_BROADCAST: "true"
        run: npx hardhat run scripts/verify-bnb-testnet-stage.ts --network bscTestnet
      - name: Generate fresh chain-derived Normal Battle market evidence
        env:
          BNB_6C_ALLOW_SOURCE_HEAD_BROADCAST: "true"
        run: npx hardhat run scripts/agent2-bsc97-normal-battle-evidence.ts --network bscTestnet
      - name: Upload BSC97 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-bsc97-normal-battle-${{ github.sha }}
          path: |
            deployments/bnb/testnet.staged.json
            reports/agent2-bsc97-normal-battle-market.json
          if-no-files-found: warn
          retention-days: 30

  solana-devnet-market-evidence:
    if: ${{ inputs.network == 'solana-devnet' }}
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ vars.SOLANA_DEVNET_RPC || secrets.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_KEYPAIR_JSON: ${{ secrets.SOLANA_DEVNET_KEYPAIR_JSON }}
      SOLANA_ROUTE_SIGNER_KEYPAIR_JSON: ${{ secrets.SOLANA_ROUTE_SIGNER_KEYPAIR_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard authority and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RUN_AGENT2_NORMAL_BATTLE_DESTRUCTIVE"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          echo "head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute fresh Solana devnet CREATE BUY SELL chain evidence
        env:
          SOLANA_NETWORK_CANARY_ENABLE_LIVE: "true"
          SOLANA_NETWORK_CANARY_SIGNER: "true"
          SOLANA_NETWORK_CANARY_CONFIRM: "SEND_SOLANA_NETWORK_CANARY"
        run: node scripts/solana/network-canary.mjs --send
      - name: Upload Solana devnet evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-solana-normal-battle-${{ github.sha }}
          path: reports/solana-network-canary.json
          if-no-files-found: warn
          retention-days: 30
