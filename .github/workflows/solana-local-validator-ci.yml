name: Solana Local Validator Acceptance

on:
  pull_request:
    branches:
      - devpostgrad
      - main
    paths:
      - Anchor.toml
      - Cargo.toml
      - Cargo.lock
      - programs/memewarzone_solana/**
      - tests/solana/**
      - scripts/solana/run-local-sbf-gate.sh
      - scripts/solana/fetch-pinned-meteora-cp-amm.mjs
      - config/solana/meteora-cp-amm.certification.json
      - .github/workflows/solana-local-validator-ci.yml
  workflow_dispatch:

concurrency:
  group: solana-validator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANCHOR_VERSION: 0.30.1
  SOLANA_VERSION: 1.18.26
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  CARGO_NET_RETRY: 10
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899

jobs:
  local-validator-acceptance:
    name: V4 create, bonding lifecycle and DAMM v2 graduation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Solana CLI
        shell: bash
        run: |
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Show pinned toolchain
        shell: bash
        run: |
          anchor --version
          solana --version
          rustc --version
          rustup run "$IDL_RUST_TOOLCHAIN" rustc --version
          node --version
          npm --version

      - name: Create ephemeral validator identity
        shell: bash
        run: |
          mkdir -p "$HOME/.config/solana" target/deploy
          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            --force \
            --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
          anchor keys list

      - name: Install acceptance-test dependencies
        run: npm install --prefix tests/solana --no-audit --no-fund

      # The same script developers run locally, so CI and a local run prove the
      # same thing. It builds the SBF, loads Metaplex and the pinned Meteora
      # DAMM v2 binary, restarts the validator between the create and lifecycle
      # suites, and fails if the graduation test reports pending instead of
      # running -- which is how it silently skipped before.
      - name: Local SBF gate (create + lifecycle + DAMM v2 graduation)
        shell: bash
        run: |
          set -o pipefail
          ANCHOR_WALLET="$ANCHOR_WALLET" \
          MWZ_LOCAL_LEDGER=/tmp/mwz-sbf-ledger \
            bash scripts/solana/run-local-sbf-gate.sh 2>&1 | tee /tmp/solana-validator-acceptance.log

      - name: Generated IDL still builds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/idl
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build \
              --out ../../target/idl/memewarzone_solana.json
          ) 2>&1 | tee /tmp/solana-validator-idl.log | tail -n 240
          test -s target/idl/memewarzone_solana.json

      - name: Program unit tests
        run: cargo test -p memewarzone_solana --lib

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memewarzone-solana-validator-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/solana-validator-idl.log
            /tmp/mwz-local-validator.log
            /tmp/mwz-lifecycle.log
            /tmp/solana-validator-acceptance.log

  validator-failure-diagnostic:
    name: Focused validator failure diagnostic
    if: ${{ always() && needs.local-validator-acceptance.result == 'failure' }}
    needs: local-validator-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Download validator diagnostics
        uses: actions/download-artifact@v4
        with:
          name: memewarzone-solana-validator-${{ github.sha }}
          path: /tmp/validator-diagnostics

      - name: Print compact acceptance failure
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('/tmp/validator-diagnostics')
          logs = list(root.rglob('solana-validator-acceptance.log'))
          if not logs:
              candidates = sorted(root.rglob('*.log'))
              diagnostic = {
                  'error': 'acceptance log missing',
                  'available_logs': [str(path.relative_to(root)) for path in candidates],
              }
          else:
              lines = logs[0].read_text(encoding='utf-8', errors='replace').splitlines()
              failing = next(
                  (index for index, line in enumerate(lines) if 'failing' in line.lower()),
                  -1,
              )
              start = max(0, failing - 25) if failing >= 0 else max(0, len(lines) - 140)
              diagnostic = {
                  'log': str(logs[0].relative_to(root)),
                  'line_count': len(lines),
                  'focused_lines': lines[start:start + 140],
              }

          print('SOLANA_VALIDATOR_DIAGNOSTIC=' + json.dumps(diagnostic, ensure_ascii=True))
