name: Agent 2 IDL Safety Documentation Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2490f8a19bf3cbe5799845bab49e86e211137c
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Anchor CHECK documentation only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('programs/memewarzone_solana/src/graduation.rs')
          s=p.read_text()
          comments={'global_config':'PDA-constrained and serialized fields validated by the graduation handler before use.','generation_config':'validated against campaign generation key, PDA, owner, active state, and generation settings before use.','campaign':'decoded through generation-safe CampaignView helpers and validated against mint, vault, and generation bindings before mutation.','mint':'validated against the campaign mint and canonical SPL token program before token operations.','token_vault':'validated as the campaign token-vault PDA and unpacked as an SPL token account before use.','sol_vault':'validated as the campaign SOL-vault PDA and campaign binding before lamport movement.','fee_escrow':'PDA-constrained and explicitly required empty for this campaign before graduation begins.','authority_token_account':'unpacked as an SPL token account and validated for mint, authority ownership, and staging balance before use.','meteora_pool':'derived deterministically from campaign mint plus signed quote mint and validated against Meteora account data before confirmation.','meteora_position':'derived from the signed position NFT mint and validated against Meteora position data and permanent-lock state.','instructions':'address-constrained to the instructions sysvar and parsed only through Solana instruction-sysvar helpers.','creator':'validated against the campaign creator before payout.','creator_token_account':'unpacked and validated as the creator SPL token account for the campaign mint before transfer.','creator_profile':'validated against the creator-profile PDA and campaign creator before mutation.','meteora_token_vault':'validated against the token vault encoded in the signed/derived Meteora pool before use.','meteora_native_vault':'validated against the quote/native vault encoded in the signed/derived Meteora pool before use.'}
          lines=s.splitlines(); out=[]; target=False
          for line in lines:
            st=line.strip()
            if st.startswith('pub struct BeginGraduation') or st.startswith('pub struct ConfirmGraduation'): target=True
            if target and st.startswith('pub ') and ': UncheckedAccount<' in st:
              name=st.split()[1].split(':')[0]
              if not (out and out[-1].lstrip().startswith('/// CHECK:')):
                out.append('    /// CHECK: '+comments.get(name,'validated explicitly by the graduation handler before use.'))
            out.append(line)
            if target and st=='}': target=False
          p.write_text('\n'.join(out)+'\n')
          PY
          test "$(git diff --name-only | tr -d '\n')" = "programs/memewarzone_solana/src/graduation.rs"
      - name: Format and core regressions
        run: |
          set -euo pipefail
          cargo fmt --package memewarzone_solana -- --check
          cargo test -p memewarzone_solana --lib
          node --check frontend/api/dev-fix/solana-graduation-auth-bytes.js
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
          node tools/solana-meteora-graduation/check-graduation-auth-fixture.mjs
      - name: Pinned IDL proof
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2024-05-09 --profile minimal
          npm install --global --silent @coral-xyz/anchor-cli@0.30.1
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN=nightly-2024-05-09 anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/idl/memewarzone_solana.json
          node -e 'const j=require("./target/idl/memewarzone_solana.json");const n=new Set((j.instructions||[]).map(x=>x.name));for(const x of ["beginGraduation","confirmGraduation"])if(!n.has(x))throw new Error("missing "+x);console.log("IDL_SAFETY_FIX_PASS")'
      - name: Commit candidate to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/memewarzone_solana/src/graduation.rs
          git commit -m "fix(agent2): document graduation account safety for IDL"
          git push origin HEAD:agent2/solana-basic-graduation-market
