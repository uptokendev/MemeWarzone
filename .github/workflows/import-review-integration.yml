name: Import review integration proof
on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - frontend/api/lib/fixtures/**
      - 'frontend/api/projectImport*.js'
      - 'frontend/api/lib/projectImport*'
      - 'frontend/api/lib/projectOwnership*'
      - 'frontend/api/lib/projectSolanaProjectAuthority*'
      - 'frontend/api/lib/imageFileValidation.js'
      - 'frontend/api/server.mjs'
      - 'frontend/src/components/imports/**'
      - 'frontend/src/features/projectImports/**'
      - 'frontend/src/pages/ProjectImport.tsx'
      - 'frontend/src/pages/TokenDetailsEntry.tsx'
      - 'frontend/src/pages/TokenDetailsLiveEntry.tsx'
      - 'frontend/src/pages/ImportedProjectDetails.tsx'
      - 'frontend/src/pages/ImportedTokenDetailsPage.tsx'
      - 'frontend/src/lib/projectImport*'
      - 'frontend/src/project-imports-ui.test.mjs'
      - 'frontend/src/project-import-identity-ui.test.mjs'
      - 'frontend/src/imported-token-details-page.test.mjs'
      - 'frontend/src/robinhood-import-gate.test.mjs'
      - 'frontend/e2e/project-import-feedback.browser.ts'
      - 'frontend/scripts/check-project-import-server-mount.mjs'
      - 'db/migrations/*project_import*'
      - 'supabase/migrations/*project_import*'
      - '.github/workflows/import-review-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: import_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d import_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROJECT_IMPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/import_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/import_test
      PG_DISABLE_SSL: '1'
      ENABLE_PROJECT_IMPORTS: 'true'
      VITE_ENABLE_PROJECT_IMPORTS: 'true'
      ENABLE_PROJECT_IMPORT_ROBINHOOD: 'false'
      VITE_ENABLE_PROJECT_IMPORT_ROBINHOOD: 'false'
      ENABLE_ARENA: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git rev-parse HEAD && npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run check:api-imports
      - name: Exact Project Import core regressions
        run: |
          set -e
          for file in frontend/api/lib/projectImport*.test.mjs; do node --test "$file"; done
      - name: Exact Project Import ownership resolver regressions
        run: |
          set -e
          for file in frontend/api/lib/projectOwnershipResolve*.test.mjs; do node --test "$file"; done
      - name: Exact Solana project authority regressions
        run: node --test frontend/api/lib/projectSolanaProjectAuthority.test.mjs
      - name: Exact Project ownership review regressions
        run: node --test frontend/api/lib/projectOwnershipReview.test.mjs
      - name: Exact Project Import UI regressions
        run: node --test frontend/src/project-imports-ui.test.mjs
      - name: Exact Project Import identity UI regressions
        run: node --test frontend/src/project-import-identity-ui.test.mjs
      - name: Exact imported-token details regressions
        run: node --test frontend/src/imported-token-details-page.test.mjs
      - name: Exact Robinhood Import gate regressions
        run: node --test frontend/src/robinhood-import-gate.test.mjs
      - name: Exact Project Import feedback regressions
        run: node --test frontend/src/lib/projectImportFeedback.test.mjs
      - name: Apply import-only schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20260908_000001_project_import_onboarding.sql
      - name: Server mount proof
        run: node frontend/scripts/check-project-import-server-mount.mjs
      - run: npm --prefix frontend run build
      - name: Chromium
        working-directory: frontend
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.imports.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: import-integration-browser-failures
          path: frontend/test-results
          retention-days: 3