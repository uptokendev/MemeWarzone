name: RH46630 PR #359 native lifecycle dispatcher

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CERTIFY_CHAIN_46630_NATIVE_LIFECYCLE
        required: true
        type: string
      source_sha:
        description: Exact reviewed PR #359 certification source SHA
        required: true
        default: e280f35de8bd80d632baf6d7c2c2e89c965f566d
        type: string

permissions:
  contents: read

concurrency:
  group: rh46630-native-lifecycle-exact-head
  cancel-in-progress: false

jobs:
  certify:
    if: ${{ github.event.inputs.confirmation == 'CERTIFY_CHAIN_46630_NATIVE_LIFECYCLE' }}
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      EXPECTED_CERT_SHA: e280f35de8bd80d632baf6d7c2c2e89c965f566d
      EXPECTED_AUTHORITY_SHA: 8944382619e05f09539614f5690b98521fe244ed
      RH46630_LIFECYCLE_EVIDENCE: rh46630-native-lifecycle-evidence.json
      ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
      ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
      ROBINHOOD_TESTNET_ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER_PRIVATE_KEY }}
      ROBINHOOD_TESTNET_CREATOR_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_CREATOR_PRIVATE_KEY }}
      ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY }}
      ROBINHOOD_TESTNET_TRADER_B_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_TRADER_B_PRIVATE_KEY }}

    steps:
      - name: Reject wrong confirmation or source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.confirmation }}" = 'CERTIFY_CHAIN_46630_NATIVE_LIFECYCLE'
          test "${{ github.event.inputs.source_sha }}" = "$EXPECTED_CERT_SHA" || {
            echo "BLOCKER: source_sha must equal reviewed PR #359 head $EXPECTED_CERT_SHA"
            exit 1
          }
          for name in \
            ROBINHOOD_TESTNET_RPC_URL \
            ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY \
            ROBINHOOD_TESTNET_ORACLE_UPDATER_PRIVATE_KEY \
            ROBINHOOD_TESTNET_CREATOR_PRIVATE_KEY \
            ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY \
            ROBINHOOD_TESTNET_TRADER_B_PRIVATE_KEY; do
            test -n "${!name:-}" || { echo "BLOCKER: missing protected input $name"; exit 1; }
          done

      - name: Checkout exact reviewed PR #359 certification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}
          fetch-depth: 0

      - name: Prove exact source, authority ancestry, isolation and unchanged contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CERT_SHA"
          git cat-file -e "${EXPECTED_AUTHORITY_SHA}^{commit}"
          git merge-base --is-ancestor "$EXPECTED_AUTHORITY_SHA" HEAD
          git diff --name-only "$EXPECTED_AUTHORITY_SHA" HEAD | tee /tmp/rh46630-changed.txt
          if grep -Ev '^(scripts/rh46630-native-lifecycle-certification\.mjs|scripts/rh46630-native-lifecycle-runner\.mjs|scripts/rh46630-native-lifecycle-fault-preflight\.mjs|scripts/rh46630-native-lifecycle-postchecks\.mjs|scripts/rh46630-native-lifecycle-readonly-diagnostic\.mjs|\.github/workflows/agent4-rh46630-native-lifecycle\.yml)$' /tmp/rh46630-changed.txt; then
            echo 'BLOCKER: certification head contains non-certification changes'
            exit 1
          fi
          for f in \
            contracts/LaunchFactory.sol \
            contracts/LaunchCampaign.sol \
            contracts/PermanentV3PositionLocker.sol \
            contracts/integrations/RobinhoodUniswapV3GraduationAdapter.sol \
            contracts/TreasuryRouterV3.sol \
            contracts/GraduationOracle.sol; do
            test "$(git show "${EXPECTED_AUTHORITY_SHA}:$f" | git hash-object --stdin)" = "$(git show "HEAD:$f" | git hash-object --stdin)"
          done
          echo 'exact_source_and_contract_pins=ok'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Re-run certification transport gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/rh46630-native-lifecycle-certification.mjs
          node --check scripts/rh46630-native-lifecycle-runner.mjs
          node --check scripts/rh46630-native-lifecycle-fault-preflight.mjs
          node --check scripts/rh46630-native-lifecycle-postchecks.mjs
          node --check scripts/rh46630-native-lifecycle-readonly-diagnostic.mjs
          npx hardhat compile
          npx hardhat test test/GraduationOracle.spec.ts
          grep -F 'const CHAIN_ID = 46630;' scripts/rh46630-native-lifecycle-certification.mjs
          grep -F 'const FORBIDDEN_CHAIN_ID = 4663;' scripts/rh46630-native-lifecycle-certification.mjs
          grep -F 'PRODUCTION_4663_FORBIDDEN' scripts/rh46630-native-lifecycle-certification.mjs
          grep -F 'SIGNER_MISMATCH_' scripts/rh46630-native-lifecycle-certification.mjs
          grep -F 'REPLAY_HARVEST_DUPLICATED_FINANCIAL_STATE' scripts/rh46630-native-lifecycle-postchecks.mjs

      - name: Execute live RH46630 fault preflight
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_CERT_SHA" node scripts/rh46630-native-lifecycle-fault-preflight.mjs

      - name: Execute real RH46630 native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_CERT_SHA" node scripts/rh46630-native-lifecycle-runner.mjs

      - name: Fresh-process restart and reconcile from chain
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_CERT_SHA" node scripts/rh46630-native-lifecycle-runner.mjs --reconcile

      - name: Prove financial replay no-op and permanent locker
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_CERT_SHA" node scripts/rh46630-native-lifecycle-postchecks.mjs

      - name: Reconcile again after replay postchecks
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$EXPECTED_CERT_SHA" node scripts/rh46630-native-lifecycle-runner.mjs --reconcile

      - name: Validate exact-head evidence and hard production rejection
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RH46630_LIFECYCLE_EVIDENCE"
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(process.env.RH46630_LIFECYCLE_EVIDENCE, 'utf8'));
          const want = process.env.EXPECTED_CERT_SHA;
          const required = ['campaign','token','pool','tokenId','locker','restartReconciliation','retryFinancialNoOp','permanentLockerFaults'];
          if (r.sourceSha !== want) throw new Error(`SOURCE_SHA_MISMATCH_${r.sourceSha}`);
          if (r.chainId !== 46630) throw new Error(`WRONG_CHAIN_${r.chainId}`);
          if (r.productionChainId !== 4663 || r.productionCompatible !== false) throw new Error('PRODUCTION_4663_REJECTION_MISSING');
          for (const key of required) if (!r[key]) throw new Error(`MISSING_EVIDENCE_${key}`);
          if (!Array.isArray(r.txs) || r.txs.length === 0) throw new Error('MISSING_TX_EVIDENCE');
          console.log(JSON.stringify({sourceSha:r.sourceSha,chainId:r.chainId,campaign:r.campaign,token:r.token,pool:r.pool,tokenId:r.tokenId,locker:r.locker,txCount:r.txs.length}, null, 2));
          NODE

      - name: Evidence secret scan
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RH46630_LIFECYCLE_EVIDENCE" ]; then
            ! grep -nE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|https?://[^[:space:]]+:[^[:space:]@]+@)' "$RH46630_LIFECYCLE_EVIDENCE"
            ! grep -nEi '(private.?key|secret)[^\n]{0,40}(0x)?[a-f0-9]{64}' "$RH46630_LIFECYCLE_EVIDENCE"
          fi
          echo 'evidence_secret_scan=ok'

      - name: Upload RH46630 native lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rh46630-native-lifecycle-${{ github.event.inputs.source_sha }}
          path: rh46630-native-lifecycle-evidence.json
          if-no-files-found: error
          retention-days: 14
