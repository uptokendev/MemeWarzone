name: Agent 4 Robinhood Testnet Infrastructure Bootstrap

on:
  push:
    paths:
      - 'contracts/robinhood/testnet/**'
      - 'scripts/deploy-robinhood-testnet-infrastructure.ts'
      - 'scripts/robinhoodTestnetInfrastructureAuthority.mjs'
      - 'scripts/robinhood-testnet-infrastructure-authority.test.mjs'
      - 'scripts/export-robinhood-current-stage-infra-env.mjs'
      - 'test/RobinhoodTestnetInfrastructureBootstrap.spec.ts'
      - 'tools/robinhood-testnet-infra/package.json'
      - 'config/robinhood-testnet-infrastructure.env.example'
      - '.github/workflows/agent4-robinhood-testnet-infrastructure.yml'
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - 'contracts/robinhood/testnet/**'
      - 'scripts/deploy-robinhood-testnet-infrastructure.ts'
      - 'scripts/robinhoodTestnetInfrastructureAuthority.mjs'
      - 'scripts/robinhood-testnet-infrastructure-authority.test.mjs'
      - 'scripts/export-robinhood-current-stage-infra-env.mjs'
      - 'test/RobinhoodTestnetInfrastructureBootstrap.spec.ts'
      - 'tools/robinhood-testnet-infra/package.json'
      - 'config/robinhood-testnet-infrastructure.env.example'
      - '.github/workflows/agent4-robinhood-testnet-infrastructure.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_CHAIN_46630_TESTNET_INFRA to authorize one RH46630 infrastructure bootstrap'
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix tools/robinhood-testnet-infra --ignore-scripts --no-audit --no-fund

      - name: Prove exact pinned Uniswap generations
        run: |
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/v3-core/package.json').version")" = "1.0.1"
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/v3-periphery/package.json').version")" = "1.4.4"
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/swap-router-contracts/package.json').version")" = "1.3.1"

      - name: Static bootstrap authority matrix
        run: node --test scripts/robinhood-testnet-infrastructure-authority.test.mjs

      - name: Compile MemeWarzone plus testnet-only infrastructure wrappers
        run: npx hardhat compile

      - name: Deterministic local WETH V3 swap oracle matrix
        run: npx hardhat test test/RobinhoodTestnetInfrastructureBootstrap.spec.ts

      - name: Real bootstrap executor rejects chain 31337 before any transaction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npx hardhat run scripts/deploy-robinhood-testnet-infrastructure.ts --network hardhat 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -F 'bootstrap requires robinhoodTestnet / 46630'

      - name: No fake infrastructure manifest committed or generated
        run: test ! -f deployments/robinhood/testnet.infrastructure.json

      - name: Historical and mainnet addresses are never bootstrap defaults
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RiE '0x37E402B8081eFcE1D82A09a066512278006e4691|0xFECCB63CD759d768538458Ea56F47eA8004323c1|0xBc82a9aA33ff24FCd56D36a0fB0a2105B193A327|0x1b32F47434a7EF83E97d0675C823E547F9266725|0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73' \
            scripts/deploy-robinhood-testnet-infrastructure.ts \
            scripts/robinhoodTestnetInfrastructureAuthority.mjs \
            config/robinhood-testnet-infrastructure.env.example

      - name: No Quoter in authoritative bootstrap generation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RiE 'Quoter|QUOTER' \
            scripts/deploy-robinhood-testnet-infrastructure.ts \
            scripts/robinhoodTestnetInfrastructureAuthority.mjs \
            config/robinhood-testnet-infrastructure.env.example

      - name: Secret scan bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|0x[a-fA-F0-9]{64})' \
            contracts/robinhood/testnet \
            scripts/deploy-robinhood-testnet-infrastructure.ts \
            scripts/robinhoodTestnetInfrastructureAuthority.mjs \
            scripts/export-robinhood-current-stage-infra-env.mjs \
            config/robinhood-testnet-infrastructure.env.example; then
            echo 'Potential committed secret detected' >&2
            exit 1
          fi

      - name: Push and PR paths cannot broadcast
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ROBINHOOD_TESTNET_INFRA_BROADCAST:-}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            test -z "${ROBINHOOD_TESTNET_RPC_URL:-}"
            test -z "${ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY:-}"
          fi

      - name: Forbidden scope stays untouched
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/changed.txt
          if grep -E '^(programs/|tests/solana/|scripts/solana/|web-dashboard/|frontend/api/(battle|arenaTournaments|finalSalvo|claims|projectImport)|contracts/Bnb)' /tmp/changed.txt; then
            echo 'Forbidden cross-chain/product scope changed' >&2
            cat /tmp/changed.txt >&2
            exit 1
          fi
          if grep -E '^deployments/robinhood/testnet\.staged\.json$' /tmp/changed.txt; then
            echo 'MemeWarzone staged deployment artifact must not be changed' >&2
            exit 1
          fi

  execute:
    name: Manual RH46630 bootstrap
    needs: certify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'DEPLOY_CHAIN_46630_TESTNET_INFRA' &&
      github.ref_name == 'build/cross-chain-stabilization-rh-base'
    runs-on: ubuntu-latest
    environment: testnet-certification
    steps:
      - name: Checkout exact dispatch source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact source pin and production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = "build/cross-chain-stabilization-rh-base"
          test "${{ github.event.inputs.confirmation }}" = "DEPLOY_CHAIN_46630_TESTNET_INFRA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix tools/robinhood-testnet-infra --ignore-scripts --no-audit --no-fund

      - name: Secure pre-broadcast identity chain funding gate
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          ROBINHOOD_TESTNET_ADMIN: ${{ secrets.ROBINHOOD_TESTNET_ADMIN }}
          ROBINHOOD_TESTNET_ORACLE_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
          ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { ethers } = require('ethers');
          const req = (n) => { const v=String(process.env[n]||'').trim(); if(!v) throw new Error(`MISSING_SECURE_INPUT_${n}`); return v; };
          const same = (a,b) => String(a).toLowerCase() === String(b).toLowerCase();
          (async()=>{
            const rpc=req('ROBINHOOD_TESTNET_RPC_URL');
            const pk=req('ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY');
            const provider=new ethers.JsonRpcProvider(rpc);
            const chainId=Number((await provider.getNetwork()).chainId);
            if(chainId!==46630) throw new Error(`WRONG_CHAIN_${chainId}`);
            const deployer=ethers.getAddress(new ethers.Wallet(pk.startsWith('0x')?pk:`0x${pk}`).address);
            const admin=ethers.getAddress(req('ROBINHOOD_TESTNET_ADMIN'));
            if(!same(admin,deployer)) throw new Error(`ADMIN_DEPLOYER_MISMATCH_${admin}_${deployer}`);
            const updater=ethers.getAddress(req('ROBINHOOD_TESTNET_ORACLE_UPDATER'));
            const initial=BigInt(req('ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8'));
            if(initial<=0n) throw new Error('ORACLE_INITIAL_ANSWER_NOT_POSITIVE');
            const deployerBal=await provider.getBalance(deployer);
            if(deployerBal<200000000000000000n) throw new Error(`INSUFFICIENT_DEPLOYER_BALANCE_WEI_${deployerBal}`);
            const source=(fs.readFileSync('scripts/deploy-robinhood-testnet-infrastructure.ts','utf8')+'\n'+fs.readFileSync('scripts/robinhoodTestnetInfrastructureAuthority.mjs','utf8')).toLowerCase();
            for(const a of ['0x37E402B8081eFcE1D82A09a066512278006e4691','0xFECCB63CD759d768538458Ea56F47eA8004323c1','0xBc82a9aA33ff24FCd56D36a0fB0a2105B193A327','0x1b32F47434a7EF83E97d0675C823E547F9266725','0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73']) {
              if(source.includes(a.toLowerCase())) throw new Error('HISTORICAL_INFRASTRUCTURE_REUSE_DETECTED');
            }
            if(/quoter/i.test(source)) throw new Error('QUOTER_FORBIDDEN');
            console.log(JSON.stringify({sourceSha:process.env.GITHUB_SHA,chainId,deployer,admin,oracleUpdater:updater,deployerBalanceEth:ethers.formatEther(deployerBal),production4663:false,historicalReuse:false,quoter:false}));
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE

      - name: Execute one-time infrastructure bootstrap
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          ROBINHOOD_TESTNET_ORACLE_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
          ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8 }}
          ROBINHOOD_NATIVE_USD_MAX_ORACLE_AGE_SECONDS: '900'
          ROBINHOOD_TESTNET_INFRA_BROADCAST: DEPLOY_CHAIN_46630_TESTNET_INFRA
        run: npx hardhat run scripts/deploy-robinhood-testnet-infrastructure.ts --network robinhoodTestnet

      - name: Independently verify manifest provenance and deployed runtime
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          EXPECTED_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const {ethers}=require('ethers');
          (async()=>{
            const m=JSON.parse(fs.readFileSync('deployments/robinhood/testnet.infrastructure.json','utf8'));
            if(m.sourceSha!==process.env.GITHUB_SHA) throw new Error('MANIFEST_SOURCE_SHA_MISMATCH');
            if(m.chainId!==46630||m.productionChainId!==4663||m.productionCompatible!==false) throw new Error('MANIFEST_NETWORK_ISOLATION_INVALID');
            const p=new ethers.JsonRpcProvider(process.env.ROBINHOOD_TESTNET_RPC_URL);
            if(Number((await p.getNetwork()).chainId)!==46630) throw new Error('POSTDEPLOY_WRONG_CHAIN');
            const entries={
              weth:m.weth,
              v3Factory:m.v3Factory,
              nftDescriptor:m.peripheryDependencies?.nftDescriptor,
              tokenDescriptor:m.peripheryDependencies?.tokenDescriptor,
              positionManager:m.positionManager,
              swapRouter02:m.swapRouter02,
              oracle:m.oracle,
            };
            for(const [name,e] of Object.entries(entries)){
              if(!e?.address||!e?.txHash||!e?.blockNumber||!e?.runtimeCodeHash) throw new Error(`${name}_PROVENANCE_MISSING`);
              const receipt=await p.getTransactionReceipt(e.txHash);
              if(!receipt||receipt.status!==1||Number(receipt.blockNumber)!==Number(e.blockNumber)) throw new Error(`${name}_RECEIPT_MISMATCH`);
              const code=await p.getCode(e.address);
              if(!code||code==='0x'||ethers.keccak256(code).toLowerCase()!==String(e.runtimeCodeHash).toLowerCase()) throw new Error(`${name}_RUNTIME_HASH_MISMATCH`);
            }
            const fac=new ethers.Contract(m.v3Factory.address,['function feeAmountTickSpacing(uint24) view returns(int24)'],p);
            const pm=new ethers.Contract(m.positionManager.address,['function factory() view returns(address)','function WETH9() view returns(address)'],p);
            const rt=new ethers.Contract(m.swapRouter02.address,['function factory() view returns(address)','function WETH9() view returns(address)'],p);
            const orc=new ethers.Contract(m.oracle.address,['function updater() view returns(address)','function decimals() view returns(uint8)','function latestRoundData() view returns(uint80,int256,uint256,uint256,uint80)'],p);
            const same=(a,b)=>String(a).toLowerCase()===String(b).toLowerCase();
            if(BigInt(await fac.feeAmountTickSpacing(3000))<=0n) throw new Error('FEE_3000_DISABLED');
            if(!same(await pm.factory(),m.v3Factory.address)||!same(await pm.WETH9(),m.weth.address)) throw new Error('POSITION_MANAGER_BINDING_MISMATCH');
            if(!same(await rt.factory(),m.v3Factory.address)||!same(await rt.WETH9(),m.weth.address)) throw new Error('ROUTER_BINDING_MISMATCH');
            const routerCode=(await p.getCode(m.swapRouter02.address)).toLowerCase().replace(/^0x/,'');
            if(!routerCode.includes('04e45aaf')) throw new Error('SWAP_ROUTER02_SELECTOR_MISSING');
            if(!same(await orc.updater(),process.env.EXPECTED_UPDATER)) throw new Error('ORACLE_UPDATER_MISMATCH');
            const round=await orc.latestRoundData(); const latest=await p.getBlock('latest');
            if(Number(await orc.decimals())!==8||BigInt(round[1])<=0n||BigInt(round[3])<=0n||BigInt(round[4])<BigInt(round[0])||!latest||latest.timestamp-Number(round[3])>900) throw new Error('ORACLE_INVALID_OR_STALE');
            console.log(JSON.stringify({sourceSha:m.sourceSha,chainId:m.chainId,entries},null,2));
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE

      - name: Upload authoritative infrastructure manifest
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-testnet-46630-infrastructure-${{ github.sha }}
          path: deployments/robinhood/testnet.infrastructure.json
          if-no-files-found: error
