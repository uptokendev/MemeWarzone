name: Agent 4 Robinhood Testnet Infrastructure Bootstrap

on:
  push:
    branches:
      - agent4/robinhood-46630-testnet-infra-bootstrap-120401f-working
    paths:
      - 'contracts/robinhood/testnet/**'
      - 'scripts/deploy-robinhood-testnet-infrastructure.ts'
      - 'scripts/robinhoodTestnetInfrastructureAuthority.mjs'
      - 'scripts/robinhood-testnet-infrastructure-authority.test.mjs'
      - 'scripts/export-robinhood-current-stage-infra-env.mjs'
      - 'test/RobinhoodTestnetInfrastructureBootstrap.spec.ts'
      - 'tools/robinhood-testnet-infra/package.json'
      - 'config/robinhood-testnet-infrastructure.env.example'
      - '.github/workflows/agent4-robinhood-testnet-infrastructure.yml'
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - 'contracts/robinhood/testnet/**'
      - 'scripts/deploy-robinhood-testnet-infrastructure.ts'
      - 'scripts/robinhoodTestnetInfrastructureAuthority.mjs'
      - 'scripts/robinhood-testnet-infrastructure-authority.test.mjs'
      - 'scripts/export-robinhood-current-stage-infra-env.mjs'
      - 'test/RobinhoodTestnetInfrastructureBootstrap.spec.ts'
      - 'tools/robinhood-testnet-infra/package.json'
      - 'config/robinhood-testnet-infrastructure.env.example'
      - '.github/workflows/agent4-robinhood-testnet-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install pinned bootstrap artifacts
        run: npm install --prefix tools/robinhood-testnet-infra --ignore-scripts --no-audit --no-fund

      - name: Prove exact pinned Uniswap generations
        run: |
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/v3-core/package.json').version")" = "1.0.1"
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/v3-periphery/package.json').version")" = "1.4.4"
          test "$(node -p "require('./tools/robinhood-testnet-infra/node_modules/@uniswap/swap-router-contracts/package.json').version")" = "1.3.1"

      - name: Static bootstrap authority matrix
        run: node --test scripts/robinhood-testnet-infrastructure-authority.test.mjs

      - name: Compile MemeWarzone plus testnet-only infrastructure wrappers
        run: npx hardhat compile

      - name: Deterministic local WETH V3 swap oracle matrix
        run: npx hardhat test test/RobinhoodTestnetInfrastructureBootstrap.spec.ts

      - name: Real bootstrap executor rejects chain 31337 before any transaction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(npx hardhat run scripts/deploy-robinhood-testnet-infrastructure.ts --network hardhat 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -F 'bootstrap requires robinhoodTestnet / 46630'

      - name: No fake infrastructure manifest committed or generated
        run: test ! -f deployments/robinhood/testnet.infrastructure.json

      - name: Historical and mainnet addresses are never bootstrap defaults
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RiE '0x37E402B8081eFcE1D82A09a066512278006e4691|0xFECCB63CD759d768538458Ea56F47eA8004323c1|0xBc82a9aA33ff24FCd56D36a0fB0a2105B193A327|0x1b32F47434a7EF83E97d0675C823E547F9266725|0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73' \
            scripts/deploy-robinhood-testnet-infrastructure.ts \
            scripts/robinhoodTestnetInfrastructureAuthority.mjs \
            config/robinhood-testnet-infrastructure.env.example

      - name: Secret scan bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|0x[a-fA-F0-9]{64})' \
            contracts/robinhood/testnet \
            scripts/deploy-robinhood-testnet-infrastructure.ts \
            scripts/robinhoodTestnetInfrastructureAuthority.mjs \
            scripts/export-robinhood-current-stage-infra-env.mjs \
            config/robinhood-testnet-infrastructure.env.example; then
            echo 'Potential committed secret detected' >&2
            exit 1
          fi

      - name: Forbidden scope stays untouched
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="7c733830869b73bca31fdf81e2dc55af529b18c4"
          fi
          git diff --name-only "$base_sha" HEAD > /tmp/changed.txt
          if grep -E '^(programs/|tests/solana/|scripts/solana/|web-dashboard/|frontend/api/(battle|arenaTournaments|finalSalvo|claims|projectImport)|contracts/Bnb)' /tmp/changed.txt; then
            echo 'Forbidden cross-chain/product scope changed' >&2
            cat /tmp/changed.txt >&2
            exit 1
          fi
          if grep -E '^(deployments/robinhood/testnet\.staged\.json)$' /tmp/changed.txt; then
            echo 'MemeWarzone staged deployment artifact must not be changed' >&2
            exit 1
          fi
