name: Creator cluster protection CI

on:
  pull_request:
    paths:
      - "frontend/api/dev-fix/security-current-time.js"
      - "frontend/api/dev-fix/creator-cluster-detector.js"
      - "frontend/api/dev-fix/route-auth.js"
      - "frontend/api/dev-fix/creator-cluster-protection.test.mjs"
      - "frontend/scripts/run-contract-sync-worker.mjs"
      - "frontend/scripts/run-creator-funding-indexer.mjs"
      - "frontend/scripts/run-creator-funding-worker.mjs"
      - "frontend/package.json"
      - "frontend/src/lib/apiBase.ts"
      - "frontend/src/lib/launchpadClient.ts"
      - "frontend/src/lib/recruiterApi.ts"
      - "frontend/src/components/token/CreatorProtectionDialog.tsx"
      - "frontend/src/App.tsx"
      - "db/migrations/20260730_000001_creator_cluster_buy_reservations.sql"
      - "db/migrations/20260730_000002_creator_funding_indexer.sql"
      - ".github/workflows/creator-cluster-protection-ci.yml"
  push:
    branches:
      - "agent/fix-creator-cluster-buy-protection"
      - "agent/fix-bsc-cluster-explorer-provider"
    paths:
      - "frontend/api/dev-fix/security-current-time.js"
      - "frontend/api/dev-fix/creator-cluster-detector.js"
      - "frontend/api/dev-fix/route-auth.js"
      - "frontend/api/dev-fix/creator-cluster-protection.test.mjs"
      - "frontend/scripts/run-contract-sync-worker.mjs"
      - "frontend/scripts/run-creator-funding-indexer.mjs"
      - "frontend/scripts/run-creator-funding-worker.mjs"
      - "frontend/package.json"
      - "frontend/src/lib/apiBase.ts"
      - "frontend/src/lib/launchpadClient.ts"
      - "frontend/src/lib/recruiterApi.ts"
      - "frontend/src/components/token/CreatorProtectionDialog.tsx"
      - "frontend/src/App.tsx"
      - "db/migrations/20260730_000001_creator_cluster_buy_reservations.sql"
      - "db/migrations/20260730_000002_creator_funding_indexer.sql"
      - ".github/workflows/creator-cluster-protection-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Check creator funding worker syntax
        run: |
          node --check scripts/run-creator-funding-worker.mjs
          node --check scripts/run-creator-funding-indexer.mjs

      - name: Test creator cluster protection
        run: node --test api/dev-fix/creator-cluster-protection.test.mjs

      - name: Build frontend
        run: npm run build
