name: Agent 4 RH46630 Real Infrastructure Bootstrap

on:
  push:
    branches:
      - agent4/rh46630-real-infra-preflight-4ba6530
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact authority
        uses: actions/checkout@v4
        with:
          ref: 4ba6530526b7f646feb051b20052fa7cae94cd36
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix tools/robinhood-testnet-infra --ignore-scripts --no-audit --no-fund

      - name: Compile exact authority
        run: npx hardhat compile

      - name: Secure pre-broadcast gate
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          FALLBACK_PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
          FALLBACK_DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          ROBINHOOD_TESTNET_ADMIN: ${{ secrets.ROBINHOOD_TESTNET_ADMIN }}
          ROBINHOOD_TESTNET_ORACLE_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
          ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8 }}
          SAFE_DEPLOYER_BALANCE_WEI: '200000000000000000'
          RECOMMENDED_UPDATER_BALANCE_WEI: '10000000000000000'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { ethers } = require('ethers');
          const required = (n,v) => { const x=String(v||'').trim(); if(!x) throw new Error(`MISSING_SECURE_INPUT_${n}`); return x; };
          const normalizePk = v => v.startsWith('0x') ? v : `0x${v}`;
          (async()=>{
            const rpc = required('ROBINHOOD_TESTNET_RPC_URL', process.env.ROBINHOOD_TESTNET_RPC_URL);
            if (/4663(?!0)/.test(rpc)) throw new Error('PRODUCTION_4663_RPC_REUSE_FORBIDDEN');
            const pk = String(process.env.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY || process.env.FALLBACK_PRIVATE_KEY_DEPLOY || process.env.FALLBACK_DEPLOYER_PK || '').trim();
            if (!pk) throw new Error('MISSING_SECURE_INPUT_ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY');
            const provider = new ethers.JsonRpcProvider(rpc);
            const net = await provider.getNetwork();
            const chainId = Number(net.chainId);
            if (chainId !== 46630) throw new Error(`WRONG_CHAIN_${chainId}`);
            const wallet = new ethers.Wallet(normalizePk(pk), provider);
            const deployer = ethers.getAddress(wallet.address);
            const adminRaw = String(process.env.ROBINHOOD_TESTNET_ADMIN || '').trim();
            const admin = adminRaw ? ethers.getAddress(adminRaw) : deployer;
            if (admin !== deployer) throw new Error(`ADMIN_DEPLOYER_MISMATCH_${admin}_${deployer}`);
            const updater = ethers.getAddress(required('ROBINHOOD_TESTNET_ORACLE_UPDATER', process.env.ROBINHOOD_TESTNET_ORACLE_UPDATER));
            const initial = BigInt(required('ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8', process.env.ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8));
            if (initial <= 0n) throw new Error('ORACLE_INITIAL_ANSWER_NOT_POSITIVE');
            const deployerBal = await provider.getBalance(deployer);
            const updaterBal = await provider.getBalance(updater);
            const safe = BigInt(process.env.SAFE_DEPLOYER_BALANCE_WEI);
            const updaterRecommended = BigInt(process.env.RECOMMENDED_UPDATER_BALANCE_WEI);
            if (deployerBal < safe) throw new Error(`INSUFFICIENT_DEPLOYER_BALANCE_WEI_${deployerBal}_REQUIRED_${safe}`);
            if (fs.existsSync('deployments/robinhood/testnet.infrastructure.json')) throw new Error('INFRA_MANIFEST_ALREADY_EXISTS');
            const executor = fs.readFileSync('scripts/deploy-robinhood-testnet-infrastructure.ts','utf8');
            const authority = fs.readFileSync('scripts/robinhoodTestnetInfrastructureAuthority.mjs','utf8');
            const historical = [
              '0x37E402B8081eFcE1D82A09a066512278006e4691',
              '0xFECCB63CD759d768538458Ea56F47eA8004323c1',
              '0xBc82a9aA33ff24FCd56D36a0fB0a2105B193A327',
              '0x1b32F47434a7EF83E97d0675C823E547F9266725',
              '0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73'
            ];
            const source = `${executor}\n${authority}`.toLowerCase();
            if (historical.some(a => source.includes(a.toLowerCase()))) throw new Error('HISTORICAL_INFRASTRUCTURE_REUSE_DETECTED');
            const p = JSON.parse(fs.readFileSync('tools/robinhood-testnet-infra/package.json','utf8'));
            console.log('RH46630_PREBROADCAST=' + JSON.stringify({
              sourceSha:'4ba6530526b7f646feb051b20052fa7cae94cd36',
              chainId,
              latestBlock: await provider.getBlockNumber(),
              deployer,
              admin,
              deployerBalanceWei: deployerBal.toString(),
              deployerBalanceEth: ethers.formatEther(deployerBal),
              oracleUpdater: updater,
              updaterBalanceWei: updaterBal.toString(),
              updaterBalanceEth: ethers.formatEther(updaterBal),
              minimumFundingRule:'bootstrap gas plus sufficient reserve; workflow hard-gates 0.20 ETH safe funding',
              recommendedSafeFundingEth:'0.20',
              recommendedUpdaterFundingEth:'0.01',
              updaterAtRecommendedBalance: updaterBal >= updaterRecommended,
              generation:{
                wrappedNative:'canonical-weth9-behavior/mwz-rh46630-v1',
                v3Core:p.dependencies['@uniswap/v3-core'],
                v3Periphery:p.dependencies['@uniswap/v3-periphery'],
                swapRouter02:p.dependencies['@uniswap/swap-router-contracts'],
                oracle:'mwz-rh46630-eth-usd-aggregator-v1',
                quoter:false
              },
              production4663Reuse:false,
              historicalInfrastructureReuse:false
            }));
          })().catch(e=>{ console.error(e.stack || e.message || e); process.exit(1); });
          NODE

      - name: Execute one-time 46630 bootstrap
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
          DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          ROBINHOOD_TESTNET_ORACLE_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
          ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_INITIAL_ETH_USD_8 }}
          ROBINHOOD_NATIVE_USD_MAX_ORACLE_AGE_SECONDS: '900'
          ROBINHOOD_TESTNET_INFRA_BROADCAST: DEPLOY_CHAIN_46630_TESTNET_INFRA
        run: npx hardhat run scripts/deploy-robinhood-testnet-infrastructure.ts --network robinhoodTestnet

      - name: Independent deployed-state verification
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          FALLBACK_PRIVATE_KEY_DEPLOY: ${{ secrets.PRIVATE_KEY_DEPLOY }}
          FALLBACK_DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
          EXPECTED_UPDATER: ${{ secrets.ROBINHOOD_TESTNET_ORACLE_UPDATER }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { ethers } = require('ethers');
          (async()=>{
            const m = JSON.parse(fs.readFileSync('deployments/robinhood/testnet.infrastructure.json','utf8'));
            if (m.chainId !== 46630 || m.productionChainId !== 4663 || m.productionCompatible !== false) throw new Error('MANIFEST_NETWORK_BOUNDARY_INVALID');
            const provider = new ethers.JsonRpcProvider(process.env.ROBINHOOD_TESTNET_RPC_URL);
            if (Number((await provider.getNetwork()).chainId) !== 46630) throw new Error('POSTDEPLOY_WRONG_CHAIN');
            for (const k of ['weth','v3Factory','positionManager','swapRouter02','oracle']) {
              const code = await provider.getCode(m[k].address);
              if (!code || code === '0x') throw new Error(`${k}_NO_RUNTIME`);
              const h = ethers.keccak256(code);
              if (h.toLowerCase() !== String(m[k].runtimeCodeHash).toLowerCase()) throw new Error(`${k}_RUNTIME_HASH_MISMATCH`);
            }
            const fac = new ethers.Contract(m.v3Factory.address,['function feeAmountTickSpacing(uint24) view returns (int24)'],provider);
            const pm = new ethers.Contract(m.positionManager.address,['function factory() view returns(address)','function WETH9() view returns(address)'],provider);
            const rt = new ethers.Contract(m.swapRouter02.address,['function factory() view returns(address)','function WETH9() view returns(address)'],provider);
            const orc = new ethers.Contract(m.oracle.address,['function updater() view returns(address)','function certifiedChainId() view returns(uint256)','function decimals() view returns(uint8)','function latestRoundData() view returns(uint80,int256,uint256,uint256,uint80)'],provider);
            if (BigInt(await fac.feeAmountTickSpacing(3000)) <= 0n) throw new Error('FEE_3000_DISABLED');
            const same=(a,b)=>String(a).toLowerCase()===String(b).toLowerCase();
            if (!same(await pm.factory(),m.v3Factory.address)) throw new Error('PM_FACTORY_BINDING');
            if (!same(await pm.WETH9(),m.weth.address)) throw new Error('PM_WETH_BINDING');
            if (!same(await rt.factory(),m.v3Factory.address)) throw new Error('ROUTER_FACTORY_BINDING');
            if (!same(await rt.WETH9(),m.weth.address)) throw new Error('ROUTER_WETH_BINDING');
            const routerCode=(await provider.getCode(m.swapRouter02.address)).toLowerCase().replace(/^0x/,'');
            if (!routerCode.includes('04e45aaf')) throw new Error('NO_DEADLINE_EXACT_INPUT_SINGLE_MISSING');
            const updater=await orc.updater();
            if (!same(updater,process.env.EXPECTED_UPDATER)) throw new Error('ORACLE_UPDATER_MISMATCH');
            if (Number(await orc.certifiedChainId()) !== 46630) throw new Error('ORACLE_CHAIN_CERT_MISMATCH');
            const round=await orc.latestRoundData();
            if (Number(await orc.decimals()) !== 8 || BigInt(round[1]) <= 0n || BigInt(round[3]) <= 0n || BigInt(round[4]) < BigInt(round[0])) throw new Error('ORACLE_ROUND_INVALID');
            const latest=await provider.getBlock('latest');
            if (!latest || latest.timestamp - Number(round[3]) > 900) throw new Error('ORACLE_STALE');
            const pk=String(process.env.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY || process.env.FALLBACK_PRIVATE_KEY_DEPLOY || process.env.FALLBACK_DEPLOYER_PK || '').trim();
            const wallet=new ethers.Wallet(pk.startsWith('0x')?pk:`0x${pk}`,provider);
            const weth=new ethers.Contract(m.weth.address,['function deposit() payable','function withdraw(uint256)','function balanceOf(address) view returns(uint256)'],wallet);
            const before=await weth.balanceOf(wallet.address);
            const dep=await weth.deposit({value:1n}); const depR=await dep.wait(); if(!depR || depR.status!==1) throw new Error('WETH_DEPOSIT_FAILED');
            const mid=await weth.balanceOf(wallet.address); if(mid!==before+1n) throw new Error('WETH_DEPOSIT_BEHAVIOR_INVALID');
            const wd=await weth.withdraw(1n); const wdR=await wd.wait(); if(!wdR || wdR.status!==1) throw new Error('WETH_WITHDRAW_FAILED');
            const after=await weth.balanceOf(wallet.address); if(after!==before) throw new Error('WETH_WITHDRAW_BEHAVIOR_INVALID');
            const finalBal=await provider.getBalance(wallet.address);
            const updaterBal=await provider.getBalance(updater);
            console.log('RH46630_POSTDEPLOY=' + JSON.stringify({manifest:m,wethBehavior:{depositTx:dep.hash,depositBlock:depR.blockNumber,withdrawTx:wd.hash,withdrawBlock:wdR.blockNumber},finalDeployerBalanceWei:finalBal.toString(),finalDeployerBalanceEth:ethers.formatEther(finalBal),finalUpdaterBalanceWei:updaterBal.toString(),finalUpdaterBalanceEth:ethers.formatEther(updaterBal)}));
          })().catch(e=>{console.error(e.stack||e.message||e);process.exit(1);});
          NODE

      - name: Upload receipt-derived infrastructure manifest
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-46630-infrastructure-manifest
          path: deployments/robinhood/testnet.infrastructure.json
          if-no-files-found: error
