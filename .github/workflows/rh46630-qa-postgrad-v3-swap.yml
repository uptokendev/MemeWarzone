name: RH46630 QA post-grad V3 swap

# Dispatch from main; the script is read from the integration branch.
# Proves graduated-token volume, which bonding create/buy/sell cannot produce.
# 46630 only. Never 4663. Never the staged 0xF170 surface.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type POSTGRAD_V3_SWAP_CHAIN_46630
        required: true
        type: string
      integration_ref:
        description: Branch or SHA holding the script
        required: false
        default: build/cross-chain-stabilization-rh-base
        type: string
      live:
        description: Send real 46630 swaps (false = dry-run, no txs)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  postgrad-v3-swap:
    runs-on: ubuntu-latest
    environment: testnet-certification
    steps:
      - name: Refuse without confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "POSTGRAD_V3_SWAP_CHAIN_46630" ]; then
            echo "confirmation string does not match"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund

      - name: Pin tests
        run: node --test scripts/rh46630-postgrad-v3-swap.test.mjs

      - name: Require live secrets
        if: ${{ inputs.live }}
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in ROBINHOOD_TESTNET_RPC_URL ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "missing environment secret: $name (GitHub environment testnet-certification)"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Swap on the graduated 46630 V3 pool
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY }}
          RH46630_POSTGRAD_SWAP_LIVE: ${{ inputs.live }}
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module -e '
            import fs from "node:fs";
            import { runPostGradSwap } from "./scripts/rh46630-postgrad-v3-swap.mjs";
            const result = await runPostGradSwap({}, process.env);
            fs.writeFileSync("reports/rh46630-postgrad-v3-swap.json", JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            if (result.chainId !== 46630) throw new Error("WRONG_CHAIN");
            if (result.liveRequested && !result.sent) throw new Error("LIVE_REQUESTED_BUT_NOTHING_SENT");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh46630-postgrad-v3-swap
          path: reports/rh46630-postgrad-v3-swap.json
          if-no-files-found: warn
