name: Agent3 Wire Arena Money V2

on:
  push:
    branches:
      - agent3/solana-arena-money-v2-runtime
    paths:
      - .github/workflows/agent3-wire-arena-money-v2.yml

permissions:
  contents: write

jobs:
  wire-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent3/solana-arena-money-v2-runtime

      - name: Add thin Competition V2 cancel/refund wrappers
        shell: python
        run: |
          from pathlib import Path

          path = Path('programs/mwz_rewards_treasury/src/lib.rs')
          source = path.read_text()
          anchor = '''    pub fn initialize_postgrad_league_treasury_v2(
              ctx: Context<InitializePostGradLeagueTreasuryV2>,
              monthly_receiver: Pubkey,
              quarterly_receiver: Pubkey,
          ) -> Result<()> {'''
          wrappers = '''    pub fn cancel_competition_pool_v2(
              ctx: Context<CancelCompetitionPoolV2>,
              competition_id: [u8; 32],
          ) -> Result<()> {
              cancel_competition_pool_v2_handler(ctx, competition_id)
          }

          pub fn refund_competition_entry_v2(
              ctx: Context<RefundCompetitionEntryV2>,
              competition_id: [u8; 32],
              entry_asset: Pubkey,
          ) -> Result<()> {
              refund_competition_entry_v2_handler(ctx, competition_id, entry_asset)
          }

          pub fn refund_competition_boost_v2(
              ctx: Context<RefundCompetitionBoostV2>,
              competition_id: [u8; 32],
              funding_id: [u8; 32],
          ) -> Result<()> {
              refund_competition_boost_v2_handler(ctx, competition_id, funding_id)
          }

'''
          names = [
              'pub fn cancel_competition_pool_v2(',
              'pub fn refund_competition_entry_v2(',
              'pub fn refund_competition_boost_v2(',
          ]
          present = [name in source for name in names]
          if all(present):
              print('wrappers already present')
          elif any(present):
              raise SystemExit('refusing partial Competition V2 wrapper state')
          else:
              if source.count(anchor) != 1:
                  raise SystemExit(f'expected exactly one postgrad league anchor, found {source.count(anchor)}')
              source = source.replace(anchor, wrappers + anchor, 1)
              path.write_text(source)

          final = path.read_text()
          for needle in [
              'cancel_competition_pool_v2_handler(ctx, competition_id)',
              'refund_competition_entry_v2_handler(ctx, competition_id, entry_asset)',
              'refund_competition_boost_v2_handler(ctx, competition_id, funding_id)',
          ]:
              if final.count(needle) != 1:
                  raise SystemExit(f'wrapper verification failed: {needle}')

      - name: Verify historical Arena file is untouched
        run: git diff --exit-code HEAD -- programs/mwz_rewards_treasury/src/arena.rs

      - name: Test rewards treasury including Arena Money V2 economics
        run: cargo test -p mwz_rewards_treasury

      - name: Commit only the surgical lib.rs wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- programs/mwz_rewards_treasury/src/lib.rs; then
            echo "lib.rs wrappers already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/mwz_rewards_treasury/src/lib.rs
          git commit -m "feat(arena): expose Competition V2 cancel refund entrypoints"
          git push origin HEAD:agent3/solana-arena-money-v2-runtime
