name: RH46630 QA seed pool liquidity

# Dispatch from main; the script is read from the integration branch.
# Mints a full-range position on the graduated 46630 pool so QA trades stop
# moving price by multiples. Does not touch the locked graduation position.
# 46630 only. Never 4663. Never the staged 0xF170 surface.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEED_POOL_LIQUIDITY_CHAIN_46630
        required: true
        type: string
      eth_amount:
        description: Native side to deposit, in ETH (token side is derived from pool price)
        required: false
        default: "0.1"
        type: string
      campaign:
        description: Graduated campaign address
        required: false
        default: "0xB69E19C4387905170aa17E986aAA3b805dAfe440"
        type: string
      integration_ref:
        description: Branch or SHA holding the script
        required: false
        default: build/cross-chain-stabilization-rh-base
        type: string
      live:
        description: Actually deposit (false = dry-run, deposits nothing)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  seed-pool-liquidity:
    runs-on: ubuntu-latest
    environment: testnet-certification
    steps:
      - name: Refuse without confirmation
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "SEED_POOL_LIQUIDITY_CHAIN_46630" ]; then
            echo "confirmation string does not match"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.integration_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund

      - name: Pin tests
        run: node --test scripts/rh46630-seed-pool-liquidity.test.mjs

      - name: Require live secrets
        if: ${{ inputs.live }}
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in ROBINHOOD_TESTNET_RPC_URL ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "missing environment secret: $name (GitHub environment testnet-certification)"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Seed the graduated 46630 pool
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          RH46630_SEED_LIQUIDITY_LIVE: ${{ inputs.live }}
          RH46630_SEED_CAMPAIGN: ${{ inputs.campaign }}
          RH46630_SEED_ETH: ${{ inputs.eth_amount }}
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module -e '
            import fs from "node:fs";
            import { ethers } from "ethers";
            import { runSeedLiquidity } from "./scripts/rh46630-seed-pool-liquidity.mjs";
            const eth = String(process.env.RH46630_SEED_ETH || "0.1").trim();
            const result = await runSeedLiquidity({ nativeWei: ethers.parseEther(eth) }, process.env);
            fs.writeFileSync("reports/rh46630-seed-pool-liquidity.json", JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            if (result.chainId !== 46630) throw new Error("WRONG_CHAIN");
            if (result.liveRequested && !result.sent) throw new Error("LIVE_REQUESTED_BUT_NOTHING_DEPOSITED");
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh46630-seed-pool-liquidity
          path: reports/rh46630-seed-pool-liquidity.json
          if-no-files-found: warn
