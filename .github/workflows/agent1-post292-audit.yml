name: Agent 1 Post-292 Solana 102 Audit

on:
  push:
    branches:
      - agent1/finish-solana-102-elimination-a5cfa696
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head and focused authority audit
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo '--- solanaArenaLayout callers ---'
          grep -RInE "solanaArenaLayout|expectedGenesisHash|validateCanonicalArenaConfig|isSolanaWarzoneChainId" frontend --exclude-dir=node_modules || true
          echo '--- broad helper operational usages ---'
          grep -nE "isSolanaChain\(" frontend/api/dev-fix/solana-trade-authorization-v1.js frontend/api/dev-fix/solana-vote-ingest.js frontend/api/arenaVotes.js frontend/api/dev-fix/solana-graduation-authorization-v2.js || true
          echo '--- chainNative callers ---'
          grep -RInE "isSolanaChainId\(|nativeSymbolFor\(" frontend --exclude-dir=node_modules || true
          echo '--- all tracked quote/catalog/migration lines containing 102 ---'
          git grep -n -i -E "102" -- '*.sql' '*.js' '*.mjs' '*.ts' '*.json' '*.md' | grep -Ei "basic|quote|graduat|devnet|chain_id" | head -n 1000 || true
          echo '--- exact current devnet quote migration ---'
          grep -nE "102|101|devnet|mainnet|quoteMint|contract_address_or_mint|identity_key" frontend/supabase/migrations/20260907001000_solana_basic_quote_catalog.sql frontend/supabase/migrations/20260907163000_solana_devnet_basic_quote_certification.sql || true
