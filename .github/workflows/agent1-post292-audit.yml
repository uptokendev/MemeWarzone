name: Agent 1 Post-292 Solana 102 Audit

on:
  push:
    branches:
      - agent1/finish-solana-102-elimination-a5cfa696
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact head and focused authority audit
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo '--- solanaArenaLayout callers ---'
          rg -n "solanaArenaLayout|expectedGenesisHash|validateCanonicalArenaConfig|isSolanaWarzoneChainId" frontend || true
          echo '--- broad helper operational usages ---'
          rg -n "isSolanaChain\(" frontend/api/dev-fix/solana-trade-authorization-v1.js frontend/api/dev-fix/solana-vote-ingest.js frontend/api/arenaVotes.js frontend/api/dev-fix/solana-graduation-authorization-v2.js || true
          echo '--- chainNative callers ---'
          rg -n "isSolanaChainId\(|nativeSymbolFor\(" frontend --glob '!**/node_modules/**' || true
          echo '--- quote/catalog/migration 102 candidates ---'
          rg -n -i "(chain_id\s*=\s*102|chain_id[^\n]{0,40}102|\b102\b[^\n]{0,120}(basic|quote|graduat|devnet)|(basic|quote|graduat|devnet)[^\n]{0,120}\b102\b)" . --glob '*.sql' --glob '*.js' --glob '*.mjs' --glob '*.ts' --glob '*.json' --glob '*.md' | head -n 1000 || true
          echo '--- quote asset/catalog paths ---'
          find . -type f \( -iname '*quote*' -o -iname '*graduat*' \) | sort | head -n 1000
