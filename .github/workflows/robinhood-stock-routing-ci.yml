name: Robinhood Stock ETH routing proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "contracts/integrations/RobinhoodV3MultiHopSwapAdapter.sol"
      - "contracts/integrations/RobinhoodV3NativeSwapAdapter.sol"
      - "test/RobinhoodV3MultiHopSwapAdapter.spec.ts"
      - "test/RobinhoodV3MultiHopRouteIdentity.spec.ts"
      - "test/RobinhoodV3NativeSwapAdapter.spec.ts"
      - ".github/workflows/robinhood-stock-routing-ci.yml"
  push:
    branches:
      - "feat/robinhood-*"
      - "build/cross-chain-stabilization-rh-base"
    paths:
      - "contracts/integrations/RobinhoodV3MultiHopSwapAdapter.sol"
      - "contracts/integrations/RobinhoodV3NativeSwapAdapter.sol"
      - "test/RobinhoodV3MultiHopSwapAdapter.spec.ts"
      - "test/RobinhoodV3MultiHopRouteIdentity.spec.ts"
      - "test/RobinhoodV3NativeSwapAdapter.spec.ts"
      - ".github/workflows/robinhood-stock-routing-ci.yml"

permissions:
  contents: read

jobs:
  stock-eth-routing:
    name: Exact 0204 Stock Battlefield contract baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0204c4a47555a747b95e7c80deb113d36f91e491
      - name: Pin exact production authority
        run: test "$(git rev-parse HEAD)" = "0204c4a47555a747b95e7c80deb113d36f91e491"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked contract dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile contracts
        run: npx hardhat compile
      - name: Prove native graduation, permanent V3 custody, Stock pending safety, exact binding and recovery
        run: >-
          npx hardhat test
          test/RobinhoodV3Mocks.spec.ts
          test/RobinhoodV3GraduationAdapter.spec.ts
          test/RobinhoodStockGraduationAdapter.spec.ts
          test/RobinhoodStockPendingGraduation.spec.ts
          test/RobinhoodStockFactoryBinding.spec.ts
          test/RobinhoodStockGraduationCompletion.spec.ts
          test/LaunchFactoryLiquidityKinds.spec.ts
          test/LaunchFactoryGraduationThresholds.spec.ts
      - name: Prove ETH Stock MEME BUY SELL, route identity and native ETH compatibility
        run: >-
          npx hardhat test
          test/RobinhoodV3MultiHopSwapAdapter.spec.ts
          test/RobinhoodV3MultiHopRouteIdentity.spec.ts
          test/RobinhoodV3NativeSwapAdapter.spec.ts
