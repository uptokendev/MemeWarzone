name: Agent 2 Orca devnet certification pool

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market
    paths:
      - .github/workflows/agent2-orca-devnet-cert.yml
      - tools/solana-meteora-graduation/orca-devnet-cert-pool.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca-devnet-cert-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet-certification
    env:
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      ORCA_DEVNET_CERT_REPORT: /tmp/mwz-orca-devnet-cert-pool.json
      ORCA_DEVNET_CERT_SOL_USDC_PRICE: "150"
      ORCA_DEVNET_CERT_SEED_SOL: "0.25"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize dedicated devnet operator
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_DEVNET_PAYER:-}" || { echo "BLOCKER: SOLANA_DEVNET_PAYER missing"; exit 1; }
          operator_file="${RUNNER_TEMP}/mwz-solana-devnet-operator.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs
          echo "SOLANA_GRADUATION_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"

      - name: Install pinned Orca certification SDK without changing lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tools/solana-meteora-graduation --no-save --no-audit --no-fund @orca-so/whirlpools@8.0.1 @solana/kit@5.0.0

      - name: Create or verify and seed canonical Circle-USDC Whirlpool
        shell: bash
        run: node tools/solana-meteora-graduation/orca-devnet-cert-pool.mjs

      - name: Upload certification pool evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-orca-devnet-cert-pool-${{ github.sha }}
          path: /tmp/mwz-orca-devnet-cert-pool.json
          if-no-files-found: warn
          retention-days: 14
