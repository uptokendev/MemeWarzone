name: Event Sponsorship Process Certification

on:
  pull_request:
    paths:
      - "certification/event-sponsorship/**"
      - "frontend/scripts/certify-event-sponsorship-process.mjs"
      - ".github/workflows/event-sponsorship-process-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mwz_sponsorship_process_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mwz_sponsorship_process_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mwz_sponsorship_process_cert
      SPONSORSHIP_CERT_RPC: http://127.0.0.1:8545
      SPONSORSHIP_CERT_API_PORT: "3301"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify certification branch contains current integration authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin build/cross-chain-stabilization-rh-base
          authority="$(git rev-parse origin/build/cross-chain-stabilization-rh-base)"
          base="$(git merge-base HEAD origin/build/cross-chain-stabilization-rh-base)"
          echo "CURRENT_INTEGRATION_SHA=$authority"
          test "$base" = "$authority"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend/API dependencies
        run: npm --prefix frontend ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build disposable Event Sponsorship database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/sponsorships_import.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/migrations/20260904_000000_event_sponsorship_core_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/migrations/20260904_000001_solana_arena_money_v2_runtime.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/migrations/20260905_000001_solana_arena_payment_lifecycle.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/migrations/20260905_000002_event_sponsorship_authority.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/migrations/20260905_000003_event_sponsorship_db_security.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f certification/event-sponsorship/fixture-scaffold.sql

      - name: Compile authoritative Sponsorship contracts for local chain 97
        run: npx hardhat --config certification/event-sponsorship/hardhat.config.cjs compile

      - name: Start local Hardhat chain 97
        shell: bash
        run: |
          set -euo pipefail
          nohup npx hardhat --config certification/event-sponsorship/hardhat.config.cjs node >/tmp/sponsorship-hardhat.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sS -X POST http://127.0.0.1:8545 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' | grep -q '0x61'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sponsorship-hardhat.log
          exit 1

      - name: Real production API process certification
        id: process_cert
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node frontend/scripts/certify-event-sponsorship-process.mjs 2>&1 | tee /tmp/event-sponsorship-process-certification.log

      - name: Preserve process certification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-sponsorship-process-certification-log
          path: /tmp/event-sponsorship-process-certification.log
          if-no-files-found: warn

      - name: Require process certification success
        if: steps.process_cert.outcome != 'success'
        run: exit 1

      - name: Existing Event Sponsorship authority tests
        working-directory: frontend
        run: node --test api/lib/eventSponsorshipAuthority.test.mjs api/lib/eventSponsorshipSeparation.test.mjs api/lib/arenaSponsorshipProviderAwait.test.mjs

      - name: Event Sponsorship DB security certification
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/db/tests/event_sponsorship_security_certification.sql

      - name: Production frontend build
        run: npm --prefix frontend run build
