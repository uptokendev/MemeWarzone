name: Agent 1 Import Server Mount Cert

on:
  push:
    branches:
      - agent1/import-server-mount-cert
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-import-server-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memewarzone_import_mount
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memewarzone_import_mount"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/memewarzone_import_mount
      PG_DISABLE_SSL: "1"
      ENABLE_PROJECT_IMPORTS: "true"
      ENABLE_ARENA: "false"
      ENABLE_POSTGRAD_ARENA: "false"
      ENABLE_POSTGRAD_BATTLE: "false"
      ENABLE_POSTGRAD_TOURNAMENT: "false"
      ENABLE_POSTGRAD_LEAGUE: "false"
      ENABLE_POSTGRAD_CLAIMS: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund

      - name: Apply import-only schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20260908_000001_project_import_onboarding.sql

      - name: Focused real-server mount certification
        run: node frontend/scripts/check-project-import-server-mount.mjs

      - name: Existing API import graph
        run: node frontend/scripts/check-api-relative-imports.mjs
