name: Agent 2 BASIC devnet acceptance

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market
    paths:
      - .github/workflows/agent2-basic-devnet-acceptance.yml

permissions:
  contents: read

jobs:
  current-live-program-identity:
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_LAUNCHPAD_PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
      EXPECTED_SOURCE_HEAD: 433365096d91e7e1b11d394cd57ad45c5c7031ad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact PR source head and one-file delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test "$(git diff --name-only 4ba6530526b7f646feb051b20052fa7cae94cd36..HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only 4ba6530526b7f646feb051b20052fa7cae94cd36..HEAD)" = "tools/solana-meteora-graduation/graduate-basic-quote.mjs"
          git diff --numstat 4ba6530526b7f646feb051b20052fa7cae94cd36..HEAD
      - name: Install Solana web3 dependency
        shell: bash
        run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Read live devnet program and binary identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' | tee /tmp/mwz-agent2-live-program.json
          const crypto=require('crypto');
          const fs=require('fs');
          const {Connection,PublicKey}=require('./tests/solana/node_modules/@solana/web3.js');
          const rpc=process.env.SOLANA_RPC_URL;
          const programId=new PublicKey(process.env.SOLANA_LAUNCHPAD_PROGRAM_ID);
          const expectedGenesis='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG';
          (async()=>{
            const c=new Connection(rpc,'confirmed');
            const genesis=await c.getGenesisHash();
            if(genesis!==expectedGenesis) throw new Error(`refusing non-devnet genesis ${genesis}`);
            const p=await c.getAccountInfo(programId,'confirmed');
            if(!p||!p.executable) throw new Error('launchpad program missing/not executable');
            const tag=p.data.readUInt32LE(0);
            if(tag!==2) throw new Error(`unexpected upgradeable Program tag ${tag}`);
            const programDataAddress=new PublicKey(p.data.subarray(4,36));
            const pd=await c.getAccountInfo(programDataAddress,'confirmed');
            if(!pd) throw new Error('ProgramData missing');
            const pdTag=pd.data.readUInt32LE(0);
            if(pdTag!==3) throw new Error(`unexpected ProgramData tag ${pdTag}`);
            const slot=Number(pd.data.readBigUInt64LE(4));
            const authorityOption=pd.data[12];
            const metadataBytes=authorityOption===1?45:13;
            const authority=authorityOption===1?new PublicKey(pd.data.subarray(13,45)).toBase58():null;
            const binary=pd.data.subarray(metadataBytes);
            const report={
              cluster:'solana-devnet',
              applicationChainId:101,
              genesisHash:genesis,
              sourceHead:process.env.EXPECTED_SOURCE_HEAD,
              programId:programId.toBase58(),
              programDataAddress:programDataAddress.toBase58(),
              deploymentSlot:slot,
              upgradeAuthority:authority,
              binaryBytes:binary.length,
              binarySha256:crypto.createHash('sha256').update(binary).digest('hex'),
              readOnly:true
            };
            fs.writeFileSync('/tmp/mwz-agent2-live-program.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-current-live-program-identity-${{ env.EXPECTED_SOURCE_HEAD }}
          path: /tmp/mwz-agent2-live-program.json
          if-no-files-found: error
          retention-days: 14
