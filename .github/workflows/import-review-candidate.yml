name: Import review candidate verification
on:
  push:
    branches: [diagnose/import-review-build-kit-20260909]
    paths: [.github/workflows/import-review-candidate.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: import_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d import_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROJECT_IMPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/import_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/import_test
      PG_DISABLE_SSL: '1'
      ENABLE_PROJECT_IMPORTS: 'true'
      VITE_ENABLE_PROJECT_IMPORTS: 'true'
      ENABLE_ARENA: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ce2e9ba4eac69fe3d8b5f6395a3a86f47e7b7e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate bytes and source scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const blobs=['6662cbb97d2922011289cf84cf053ac88c042abb','459a2cb9b3e8a49fc7805f31a9a2f91d38238f9e','9e1889920f20812c7123ddea03d1d3fb643dbc6b','6da67ffb85d1f0aa5936c3f009b6a903068bd343'];
          let joined='';
          for(const sha of blobs){
            const response=await fetch(`https://api.github.com/repos/uptokendev/MemeWarzone/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(20000)});
            if(!response.ok)throw Error(`Blob fetch ${response.status}`);
            const blob=await response.json(),bytes=Buffer.from(blob.content,'base64');
            const actual=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if(actual!==sha)throw Error('Blob identity mismatch');
            joined+=bytes.toString();
          }
          const patch=brotliDecompressSync(Buffer.from(joined,'base64'));
          if(crypto.createHash('sha256').update(patch).digest('hex')!=='42f4ff6479e94bf2ccd7d327bc9720563a456ef8ac2597c42c027c76048d4794')throw Error('Candidate checksum mismatch');
          fs.writeFileSync('/tmp/import-review.patch',patch);
          execFileSync('git',['apply','--unidiff-zero','--check','/tmp/import-review.patch'],{stdio:'inherit'});
          execFileSync('git',['apply','--unidiff-zero','/tmp/import-review.patch'],{stdio:'inherit'});
          const expected=['docs/import-review-v1.md','frontend/api/lib/projectImportAssessment.js','frontend/api/lib/projectImportAssessment.test.mjs','frontend/api/lib/projectImportEvidenceStore.js','frontend/api/lib/projectImportEvidenceStore.test.mjs','frontend/api/lib/projectImportHttp.test.mjs','frontend/api/lib/projectImportPumpEvidence.js','frontend/api/lib/projectImportPumpEvidence.test.mjs','frontend/api/lib/projectImportResolverAdapters.js','frontend/api/lib/projectImportResolvers.js','frontend/api/lib/projectImportRiskRegression.test.mjs','frontend/api/lib/projectImportRiskSecurity.js','frontend/api/lib/projectOwnershipResolveSolana.js','frontend/api/lib/projectOwnershipReview.js','frontend/api/lib/projectOwnershipReview.test.mjs','frontend/api/lib/projectSolanaProjectAuthority.js','frontend/api/projectImports.js','frontend/e2e/project-import-feedback.browser.ts','frontend/src/components/imports/PumpImportHelp.tsx','frontend/src/lib/projectImportFeedback.mjs','frontend/src/lib/projectImportFeedback.test.mjs','frontend/src/lib/projectImports.ts','frontend/src/pages/ProjectImport.tsx','frontend/src/project-imports-ui.test.mjs','supabase/migrations/20260909213428_project_import_review_evidence.sql'].sort();
          const actual=[...execFileSync('git',['diff','--name-only']).toString().trim().split('\n'),...execFileSync('git',['ls-files','--others','--exclude-standard']).toString().trim().split('\n')].filter(Boolean).sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))throw Error(`Unexpected candidate scope: ${JSON.stringify(actual)}`);
          execFileSync('git',['add','--',...expected],{stdio:'inherit'});
          JS
          git config user.name 'MemeWarzone import build'
          git config user.email 'import-build@users.noreply.github.com'
          git commit -m 'feat(import): gated market checks, Pump wallet help and immutable review evidence'
          git rev-parse HEAD
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run check:api-imports
      - name: Serial isolated import and database regressions
        run: |
          set -e
          for file in frontend/api/lib/projectImport*.test.mjs frontend/api/lib/projectOwnershipResolve*.test.mjs frontend/api/lib/projectSolanaProjectAuthority.test.mjs frontend/api/lib/projectOwnershipReview.test.mjs frontend/src/project-imports-ui.test.mjs frontend/src/lib/projectImportFeedback.test.mjs; do node --test "$file"; done
      - run: npm --prefix frontend run build
      - name: Chromium setup
        working-directory: frontend
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Actual import component browser tests
        working-directory: frontend
        run: npx playwright test -c playwright.imports.config.ts
      - name: Publish only the tested feature branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = c0ce2e9ba4eac69fe3d8b5f6395a3a86f47e7b7e
          test -z "$(git ls-remote origin refs/heads/feat/import-review-v1)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:refs/heads/feat/import-review-v1
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: import-review-candidate-failures
          path: frontend/test-results
          retention-days: 3
