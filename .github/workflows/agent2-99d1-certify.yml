name: Agent 2 Final Head Certification

on:
  push:
    branches:
      - cert/agent2-99d1-final

permissions:
  contents: read

env:
  CANDIDATE_SHA: 1e7b45802a7e2e39e13e46321209d2eb6c87606f
  HARNESS_SOURCE_SHA: 93b2359db5910fb16552a7a7e574ba078d3df61b
  PREVIOUS_CERT_SHA: e9c1e2be6bcd259de72fcfe103bcdd5f99b75462
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  PROGRAMDATA_ID: 9y6db1TSRHuMk1FK2GdLDYG4frdFH1z1wWtu2d1v5qM6
  CANDIDATE_BYTES: 1165328
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_TOOLCHAIN: nightly-2024-05-09
  LOCAL_RPC: http://127.0.0.1:8899
  DEVNET_RPC: https://api.devnet.solana.com

jobs:
  programdata-rent-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only ProgramData allocation and rent proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const rpc = process.env.DEVNET_RPC;
          const programId = process.env.PROGRAM_ID;
          const programDataId = process.env.PROGRAMDATA_ID;
          const candidateBytes = Number(process.env.CANDIDATE_BYTES);
          const metadataBytes = 45;
          async function call(method, params = []) {
            const response = await fetch(rpc, {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({jsonrpc:'2.0', id:1, method, params}),
            });
            if (!response.ok) throw new Error(`${method} HTTP ${response.status}`);
            const json = await response.json();
            if (json.error) throw new Error(`${method}: ${JSON.stringify(json.error)}`);
            return json.result;
          }
          const genesis = await call('getGenesisHash');
          const program = (await call('getAccountInfo', [programId, {encoding:'base64', commitment:'confirmed', dataSlice:{offset:0,length:0}}])).value;
          if (!program || !program.executable) throw new Error('program account missing or not executable');
          if (program.owner !== 'BPFLoaderUpgradeab1e11111111111111111111111') throw new Error(`unexpected program owner ${program.owner}`);
          const pd = (await call('getAccountInfo', [programDataId, {encoding:'base64', commitment:'confirmed', dataSlice:{offset:0,length:0}}])).value;
          if (!pd) throw new Error('ProgramData account missing');
          if (pd.owner !== 'BPFLoaderUpgradeab1e11111111111111111111111') throw new Error(`unexpected ProgramData owner ${pd.owner}`);
          let currentTotal = Number(pd.space);
          if (!Number.isInteger(currentTotal) || currentTotal <= metadataBytes) {
            const full = (await call('getAccountInfo', [programDataId, {encoding:'base64', commitment:'confirmed'}])).value;
            currentTotal = Buffer.from(full.data[0], 'base64').length;
          }
          const currentCapacity = currentTotal - metadataBytes;
          const extensionBytes = Math.max(0, candidateBytes - currentCapacity);
          const targetTotal = candidateBytes + metadataBytes;
          const rentMinimum = Number(await call('getMinimumBalanceForRentExemption', [targetTotal, {commitment:'confirmed'}]));
          const currentLamports = Number(pd.lamports);
          const additionalLamports = Math.max(0, rentMinimum - currentLamports);
          console.log(`devnet_genesis ${genesis}`);
          console.log(`program ${programId}`);
          console.log(`programdata ${programDataId}`);
          console.log(`current_programdata_allocation ${currentTotal}`);
          console.log(`current_binary_capacity ${currentCapacity}`);
          console.log(`candidate_binary_bytes ${candidateBytes}`);
          console.log(`extension_bytes ${extensionBytes}`);
          console.log(`resulting_required_allocation ${targetTotal}`);
          console.log(`rent_exempt_minimum_lamports ${rentMinimum}`);
          console.log(`current_balance_lamports ${currentLamports}`);
          console.log(`additional_lamports_required ${additionalLamports}`);
          console.log(`programdata_extension_required ${extensionBytes > 0 ? 'YES' : 'NO'}`);
          if (currentCapacity !== 1124416) throw new Error(`capacity drift ${currentCapacity}`);
          if (extensionBytes !== 40912) throw new Error(`extension drift ${extensionBytes}`);
          NODE

  accept-local-basic-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          d="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$d"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error -o /tmp/solana.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$d" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$d" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build exact candidate and pinned Meteora fixture
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
          npm install --prefix tests/solana --no-audit --no-fund
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/solana/fetch-pinned-meteora-cp-amm.mjs --with-accounts
      - name: Execute existing dedicated harness adaptation and add pending retry assertion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HARNESS_SOURCE_SHA" "$PREVIOUS_CERT_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/workflows/agent2-99d1-local-quotes.yml" > /tmp/agent2-existing-harness.yml
          git show "$PREVIOUS_CERT_SHA:.github/workflows/agent2-99d1-certify.yml" > /tmp/agent2-prev-cert.yml
          python <<'PY'
          from pathlib import Path
          import base64, re
          raw=Path('/tmp/agent2-existing-harness.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(raw) if line.strip()=="python <<'PY'")+1
          end=next(i for i in range(start,len(raw)) if raw[i].strip()=='PY')
          code=[line[10:] if line.startswith('          ') else line for line in raw[start:end]]
          exec(compile('\n'.join(code),'<existing-agent2-local-harness>','exec'),{'__name__':'__main__'})
          p=Path('tests/solana/v4-lifecycle-acceptance.cjs'); s=p.read_text(); slash_n=chr(92)+'n'
          s=s.replace('atomic.logs.join("'+chr(10)+'")','atomic.logs.join("'+slash_n+'")')
          s=s.replace('(simulation.value.logs||[]).join("'+chr(10)+'")','(simulation.value.logs||[]).join("'+slash_n+'")')
          old='let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null;'
          new='let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null,acquisitionSource=null,acquired=0n;'
          if old not in s: raise SystemExit('stable setup declaration not found')
          s=s.replace(old,new,1)
          s=s.replace('authorityQuote=await getOrCreateAssociatedTokenAccount(connection,adminKeypair,quoteMint,admin);','console.log("[stable-stage] authority-token-account:start"); authorityQuote={address:await createAccount(connection,adminKeypair,quoteMint,admin)}; console.log("[stable-stage] authority-token-account:ok",authorityQuote.address.toBase58());',1)
          s=s.replace('const acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin);','console.log("[stable-stage] acquisition-source:start"); acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin); console.log("[stable-stage] acquisition-source:ok",acquisitionSource.toBase58());',1)
          s=s.replace('recoveryAccount=await createAccount(connection,adminKeypair,quoteMint,campaign.creator);','console.log("[stable-stage] recovery-account:start",campaign.creator.toBase58()); recoveryAccount=await createAccount(connection,adminKeypair,quoteMint,campaign.creator); console.log("[stable-stage] recovery-account:ok",recoveryAccount.toBase58());',1)
          s=s.replace('quoteMint=await createMint(connection,adminKeypair,admin,null,quoteDecimals);','console.log("[stable-stage] mint:start",admin.toBase58()); quoteMint=await createMint(connection,adminKeypair,admin,null,quoteDecimals); console.log("[stable-stage] mint:ok",quoteMint.toBase58());',1)
          s=s.replace('const acquired=poolQuoteRaw+residual;','acquired=poolQuoteRaw+residual;',1)
          s=s.replace('const creatorAta=getAssociatedTokenAddressSync(campaignAccounts.mint,campaign.creator);','console.log("[stable-stage] creator-ata:owner",campaign.creator.toBase58()); const creatorAta=getAssociatedTokenAddressSync(campaignAccounts.mint,campaign.creator);',1)
          prev=Path('/tmp/agent2-prev-cert.yml').read_text()
          match=re.search(r"pending = base64\.b64decode\('([^']+)'\)\.decode\('utf-8'\)",prev)
          if not match: raise SystemExit('pending retry assertion payload not found')
          pending=base64.b64decode(match.group(1)).decode('utf-8')
          marker='const latest=await connection.getLatestBlockhash("confirmed"); const versioned=v0Helpers.buildLaunchpadV0Transaction(web3,{payer:admin,recentBlockhash:latest.blockhash,instructions,lookupTableAccounts:[lookupTableAccount]});'
          if marker not in s: raise SystemExit('safe graduation V0 marker not found')
          s=s.replace(marker,pending,1); p.write_text(s)
          PY
          node --check tests/solana/v4-lifecycle-acceptance.cjs
      - name: Run canonical-stable graduation on fresh disposable validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          ledger=/tmp/agent2-stable-ledger
          rm -rf "$ledger"
          solana-test-validator --reset --quiet --ledger "$ledger" --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so --bpf-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG third_party/meteora/cp_amm.so --account-dir third_party/meteora/accounts >/tmp/agent2-stable-validator.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana cluster-version --url "$LOCAL_RPC" >/dev/null 2>&1 && break
            if [ "$i" -eq 60 ]; then cat /tmp/agent2-stable-validator.log; exit 1; fi
            sleep 2
          done
          solana config set --url "$LOCAL_RPC" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && BASIC_GRAD_QUOTE_MODE=stable ANCHOR_PROVIDER_URL="$LOCAL_RPC" ANCHOR_WALLET="$ANCHOR_WALLET" GATE_K_METEORA=1 npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs)
