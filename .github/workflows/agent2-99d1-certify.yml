name: Agent 2 Final Head Certification

on:
  push:
    branches:
      - cert/agent2-99d1-final

permissions:
  contents: read

env:
  CANDIDATE_SHA: 1e7b45802a7e2e39e13e46321209d2eb6c87606f
  HARNESS_SOURCE_SHA: 93b2359db5910fb16552a7a7e574ba078d3df61b
  PREVIOUS_CERT_SHA: e9c1e2be6bcd259de72fcfe103bcdd5f99b75462
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_TOOLCHAIN: nightly-2024-05-09
  LOCAL_RPC: http://127.0.0.1:8899

jobs:
  accept-local-basic-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          d="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$d"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error -o /tmp/solana.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$d" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$d" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build exact candidate and pinned Meteora fixture
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
          npm install --prefix tests/solana --no-audit --no-fund
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/solana/fetch-pinned-meteora-cp-amm.mjs --with-accounts
      - name: Execute existing dedicated harness adaptation and add pending retry assertion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HARNESS_SOURCE_SHA" "$PREVIOUS_CERT_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/workflows/agent2-99d1-local-quotes.yml" > /tmp/agent2-existing-harness.yml
          git show "$PREVIOUS_CERT_SHA:.github/workflows/agent2-99d1-certify.yml" > /tmp/agent2-prev-cert.yml
          python <<'PY'
          from pathlib import Path
          import base64, re
          raw=Path('/tmp/agent2-existing-harness.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(raw) if line.strip()=="python <<'PY'")+1
          end=next(i for i in range(start,len(raw)) if raw[i].strip()=='PY')
          code=[line[10:] if line.startswith('          ') else line for line in raw[start:end]]
          exec(compile('\n'.join(code),'<existing-agent2-local-harness>','exec'),{'__name__':'__main__'})
          p=Path('tests/solana/v4-lifecycle-acceptance.cjs'); s=p.read_text(); slash_n=chr(92)+'n'
          s=s.replace('atomic.logs.join("'+chr(10)+'")','atomic.logs.join("'+slash_n+'")')
          s=s.replace('(simulation.value.logs||[]).join("'+chr(10)+'")','(simulation.value.logs||[]).join("'+slash_n+'")')
          old='let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null;'
          new='let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null,acquisitionSource=null,acquired=0n;'
          if old not in s: raise SystemExit('stable setup declaration not found')
          s=s.replace(old,new,1)
          s=s.replace('authorityQuote=await getOrCreateAssociatedTokenAccount(connection,adminKeypair,quoteMint,admin);','authorityQuote={address:await createAccount(connection,adminKeypair,quoteMint,admin)};',1)
          s=s.replace('const acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin);','acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin);',1)
          s=s.replace('const acquired=poolQuoteRaw+residual;','acquired=poolQuoteRaw+residual;',1)
          prev=Path('/tmp/agent2-prev-cert.yml').read_text()
          match=re.search(r"pending = base64\.b64decode\('([^']+)'\)\.decode\('utf-8'\)",prev)
          if not match: raise SystemExit('pending retry assertion payload not found')
          pending=base64.b64decode(match.group(1)).decode('utf-8')
          marker='const latest=await connection.getLatestBlockhash("confirmed"); const versioned=v0Helpers.buildLaunchpadV0Transaction(web3,{payer:admin,recentBlockhash:latest.blockhash,instructions,lookupTableAccounts:[lookupTableAccount]});'
          if marker not in s: raise SystemExit('safe graduation V0 marker not found')
          s=s.replace(marker,pending,1); p.write_text(s)
          PY
          node --check tests/solana/v4-lifecycle-acceptance.cjs
      - name: Run canonical-stable graduation on fresh disposable validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          ledger=/tmp/agent2-stable-ledger
          rm -rf "$ledger"
          solana-test-validator --reset --quiet --ledger "$ledger" --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so --bpf-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG third_party/meteora/cp_amm.so --account-dir third_party/meteora/accounts >/tmp/agent2-stable-validator.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            solana cluster-version --url "$LOCAL_RPC" >/dev/null 2>&1 && break
            if [ "$i" -eq 60 ]; then cat /tmp/agent2-stable-validator.log; exit 1; fi
            sleep 2
          done
          solana config set --url "$LOCAL_RPC" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && BASIC_GRAD_QUOTE_MODE=stable ANCHOR_PROVIDER_URL="$LOCAL_RPC" ANCHOR_WALLET="$ANCHOR_WALLET" GATE_K_METEORA=1 npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs)
