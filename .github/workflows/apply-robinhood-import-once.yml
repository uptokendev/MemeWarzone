name: Apply Robinhood import patch once
on:
  push:
    branches: [release/live-import-20260910]
    paths: ['.github/workflows/apply-robinhood-import-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/live-import-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(path, edits){
            let s=fs.readFileSync(path,'utf8');
            for(const [from,to] of edits){
              if(!s.includes(from)) throw new Error(`Missing patch anchor in ${path}: ${from.slice(0,120)}`);
              s=s.replace(from,to);
            }
            fs.writeFileSync(path,s);
          }

          patch('frontend/src/features/projectImports/config.ts', [[
            'export const projectImportsEnabled = readBoolean(import.meta.env.VITE_ENABLE_PROJECT_IMPORTS, false);',
            'export const projectImportsEnabled = readBoolean(import.meta.env.VITE_ENABLE_PROJECT_IMPORTS, false);\nexport const projectImportRobinhoodEnabled = readBoolean(import.meta.env.VITE_ENABLE_PROJECT_IMPORT_ROBINHOOD, false);'
          ]]);

          patch('frontend/api/lib/projectImportCore.js', [[
            'export function normalizeProjectIdentity(chainId,tokenAddress){const id=Number(chainId);if(!Number.isSafeInteger(id)||![56,101].includes(id))throw Object.assign(new Error("Unsupported project import chain"),{code:"UNSUPPORTED_CHAIN"});const token=normalizeAddress(tokenAddress,id);',
            'export const ROBINHOOD_PROJECT_IMPORT_CHAIN_ID=4663;\nexport function robinhoodProjectImportEnabled(){return /^(1|true|yes|on)$/i.test(String(process.env.ENABLE_PROJECT_IMPORT_ROBINHOOD||"").trim());}\nfunction enabledProjectImportChains(){return robinhoodProjectImportEnabled()?[56,101,ROBINHOOD_PROJECT_IMPORT_CHAIN_ID]:[56,101];}\nexport function normalizeProjectIdentity(chainId,tokenAddress){const id=Number(chainId);if(!Number.isSafeInteger(id)||!enabledProjectImportChains().includes(id))throw Object.assign(new Error(id===ROBINHOOD_PROJECT_IMPORT_CHAIN_ID?"Robinhood project import is disabled":"Unsupported project import chain"),{code:id===ROBINHOOD_PROJECT_IMPORT_CHAIN_ID?"PROJECT_IMPORT_CHAIN_DISABLED":"UNSUPPORTED_CHAIN"});const token=normalizeAddress(tokenAddress,id);'
          ],[
            'export async function listUserProjectImports(pool,{chainId,walletAddress}){const id=Number(chainId);if(![56,101].includes(id))throw Object.assign(new Error("Unsupported project import chain"),{code:"UNSUPPORTED_CHAIN"});',
            'export async function listUserProjectImports(pool,{chainId,walletAddress}){const id=Number(chainId);if(!enabledProjectImportChains().includes(id))throw Object.assign(new Error(id===ROBINHOOD_PROJECT_IMPORT_CHAIN_ID?"Robinhood project import is disabled":"Unsupported project import chain"),{code:id===ROBINHOOD_PROJECT_IMPORT_CHAIN_ID?"PROJECT_IMPORT_CHAIN_DISABLED":"UNSUPPORTED_CHAIN"});'
          ],[
            '`SELECT * FROM public.arena_token_imports\n      WHERE chain_id IN (56,101)\n        AND ownership_status=\'ownership_verified\'\n        AND image_url IS NOT NULL\n        AND btrim(image_url) <> \'\'\n      ORDER BY created_at DESC NULLS LAST, metadata_updated_at DESC NULLS LAST\n      LIMIT $1`,\n    [n],',
            '`SELECT * FROM public.arena_token_imports\n      WHERE chain_id = ANY($2::integer[])\n        AND ownership_status=\'ownership_verified\'\n        AND image_url IS NOT NULL\n        AND btrim(image_url) <> \'\'\n      ORDER BY created_at DESC NULLS LAST, metadata_updated_at DESC NULLS LAST\n      LIMIT $1`,\n    [n,enabledProjectImportChains()],'
          ]]);

          patch('frontend/api/lib/projectImportResolverAdapters.js', [[
            'import { resolveProjectOwnershipBnb } from "./projectOwnershipResolveBnb.js";',
            'import { resolveProjectOwnershipBnb } from "./projectOwnershipResolveBnb.js";\nimport { resolveProjectOwnershipEvm } from "./projectOwnershipResolveEvm.js";'
          ],[
            'const SOLANA_CHAIN_ID = 101;\nconst TOKEN_METADATA_PROGRAM_ID',
            'const SOLANA_CHAIN_ID = 101;\nconst ROBINHOOD_CHAIN_ID = 4663;\nconst TOKEN_METADATA_PROGRAM_ID'
          ],[
            'let bnbProvider = null;\nlet solanaConnection = null;',
            'let bnbProvider = null;\nlet robinhoodProvider = null;\nlet solanaConnection = null;'
          ],[
            'function solanaRpcUrl() { return String(process.env.SOLANA_RPC_URL || process.env.SOLANA_MAINNET_RPC_URL || "").trim(); }',
            'function solanaRpcUrl() { return String(process.env.SOLANA_RPC_URL || process.env.SOLANA_MAINNET_RPC_URL || "").trim(); }\nfunction robinhoodRpcUrl() { return String(process.env.ROBINHOOD_RPC_URL || process.env.ROBINHOOD_MAINNET_RPC_URL || process.env.RH_RPC_URL || process.env.RPC_URL_4663 || "").trim(); }\nfunction robinhoodEnabled() { return /^(1|true|yes|on)$/i.test(String(process.env.ENABLE_PROJECT_IMPORT_ROBINHOOD || "").trim()); }'
          ],[
            'function getSolanaConnection() {',
            'function getRobinhoodProvider() {\n  if (robinhoodProvider) return robinhoodProvider;\n  const url = robinhoodRpcUrl();\n  if (!url) throw Object.assign(new Error("Robinhood project import resolver is not configured"), { code: "PROJECT_IMPORT_RPC_UNAVAILABLE" });\n  const request = new FetchRequest(url); request.timeout = 7000;\n  robinhoodProvider = new JsonRpcProvider(request, ROBINHOOD_CHAIN_ID, { batchMaxCount: 1 });\n  return robinhoodProvider;\n}\nfunction getSolanaConnection() {'
          ],[
            'export function setProjectImportReadClientsForTest({ bnb = null, solana = null } = {}) {\n  bnbProvider = bnb;\n  solanaConnection = solana;\n}',
            'export function setProjectImportReadClientsForTest({ bnb = null, solana = null, robinhood = null } = {}) {\n  bnbProvider = bnb;\n  solanaConnection = solana;\n  robinhoodProvider = robinhood;\n}'
          ],[
            '\nfunction readMetadataString(data, offset, maxBytes) {',
            '\nexport async function resolveRobinhoodProjectImport({ chainId, tokenAddress, signedWallet }) {\n  if (!robinhoodEnabled()) throw Object.assign(new Error("Robinhood project import is disabled"), { code: "PROJECT_IMPORT_CHAIN_DISABLED" });\n  if (Number(chainId) !== ROBINHOOD_CHAIN_ID) throw Object.assign(new Error("Robinhood project import resolver only supports chain 4663"), { code: "UNSUPPORTED_CHAIN" });\n  const raw = await resolveProjectOwnershipEvm({ provider:getRobinhoodProvider(), chainId:ROBINHOOD_CHAIN_ID, contractAddress:tokenAddress, signedConnectedWallet:signedWallet });\n  if (!raw?.ok) throw Object.assign(new Error(raw?.error || "Robinhood token resolution failed"), { code: raw?.errorCode || "PROJECT_IMPORT_RESOLVE_FAILED" });\n  return {\n    chainId:ROBINHOOD_CHAIN_ID, tokenAddress:raw.contractAddress,\n    name:raw.token?.name??null, symbol:raw.token?.symbol??null, decimals:raw.token?.decimals??null, totalSupply:raw.token?.totalSupply??null,\n    metadataSource:"erc20_contract", metadataType:"erc20_readonly",\n    automaticOwnershipAvailable:raw.ownership?.automaticOwnershipVerification!=="unavailable"&&Boolean(raw.ownership?.currentOwner),\n    currentAuthority:raw.ownership?.currentOwner??null, signedWalletMatchesAuthority:Boolean(raw.ownership?.automaticOwnershipVerified),\n    authoritySource:raw.ownership?.method?`evm_${raw.ownership.method}`:null,\n    market:{phase:"import_only",verified:true,reason:"robinhood_read_only_project_import",venue:"Robinhood",liquidityAvailable:null,pricingValid:null,buyEnabled:null,sellEnabled:null,requiresLaunchReview:false},\n  };\n}\n\nfunction readMetadataString(data, offset, maxBytes) {'
          ],[
            '  registerProjectImportResolver(BNB_CHAIN_ID, resolveBnbProjectImport);\n  registerProjectImportResolver(SOLANA_CHAIN_ID, resolveSolanaProjectImport);',
            '  registerProjectImportResolver(BNB_CHAIN_ID, resolveBnbProjectImport);\n  registerProjectImportResolver(SOLANA_CHAIN_ID, resolveSolanaProjectImport);\n  if (robinhoodEnabled()) registerProjectImportResolver(ROBINHOOD_CHAIN_ID, resolveRobinhoodProjectImport);'
          ]]);

          patch('frontend/api/lib/projectImportRiskSecurity.js', [[
            'const match = custody.find(c => c.verified === true && (context.chainId===56',
            'const match = custody.find(c => c.verified === true && (context.chainId!==101'
          ],[
            'const assessment = Number(chainId) === 56 ? bnbAssessment(raw, context) : Number(chainId) === 101 ? solanaAssessment(raw, context) : null;',
            'const assessment = Number(chainId) === 101 ? solanaAssessment(raw, context) : [56,4663].includes(Number(chainId)) ? bnbAssessment(raw, context) : null;'
          ],[
            'const url = id === 56\n    ? `${GOPLUS_BASE}/token_security/56?contract_addresses=${encodeURIComponent(token.toLowerCase())}`\n    : id === 101',
            'const url = [56,4663].includes(id)\n    ? `${GOPLUS_BASE}/token_security/${id}?contract_addresses=${encodeURIComponent(token.toLowerCase())}`\n    : id === 101'
          ],[
            'const raw = id === 56 ? result?.[token.toLowerCase()] || result?.[token] : result?.[token];',
            'const raw = id === 101 ? result?.[token] : result?.[token.toLowerCase()] || result?.[token];'
          ]]);

          patch('frontend/api/lib/projectImportAssessment.js', [[
            "const postgrad=market.verified===true&&['postgrad','dex_market'].includes(market.phase)&&market.liquidityAvailable===true;",
            "const postgrad=market.verified===true&&['postgrad','dex_market'].includes(market.phase)&&market.liquidityAvailable===true;\n  const robinhoodImportOnly=identity.chainId===4663&&market.verified===true&&market.phase==='import_only';\n  const pageMarketEligible=postgrad||robinhoodImportOnly;"
          ],[
            "{key:'identity',status:resolved.resolverError?'unknown':'pass',title:'Token identity',finding:resolved.resolverError?'Token checks could not finish.':`${resolved.name||'Token'} (${resolved.symbol||'symbol unavailable'}) on ${identity.chainId===101?'Solana':'BNB'}.`,",
            "{key:'identity',status:resolved.resolverError?'unknown':'pass',title:'Token identity',finding:resolved.resolverError?'Token checks could not finish.':`${resolved.name||'Token'} (${resolved.symbol||'symbol unavailable'}) on ${identity.chainId===101?'Solana':identity.chainId===4663?'Robinhood':'BNB'}.`,"
          ],[
            "{key:'market',status:bonding?'blocked':postgrad?'pass':'unknown',title:'Market stage',finding:bonding?`Still bonding on ${platform}.`:postgrad?`${venue} pool identity and actual funded reserves verified.${launchReview?' Launch origin is unresolved; independent review is required.':''}`:['migration_pending','postgrad_unverified'].includes(market.phase)?'Bonding completed; this verifier has not established a supported post-grad market. This does not prove migration is pending.':'Launch stage or market is not supported by the current automatic verifier.'",
            "{key:'market',status:bonding?'blocked':postgrad?'pass':robinhoodImportOnly?'review':'unknown',title:'Market stage',finding:bonding?`Still bonding on ${platform}.`:postgrad?`${venue} pool identity and actual funded reserves verified.${launchReview?' Launch origin is unresolved; independent review is required.':''}`:robinhoodImportOnly?'Robinhood import checks token identity and ownership only. No trading market is approved by this check.':['migration_pending','postgrad_unverified'].includes(market.phase)?'Bonding completed; this verifier has not established a supported post-grad market. This does not prove migration is pending.':'Launch stage or market is not supported by the current automatic verifier.'"
          ],[
            "nextAction:bonding?'Return after graduation.':postgrad?(launchReview?'Independently confirm the launch history and absence of active external bonding; record the evidence reference.':'Continue ownership and safety review.'):'Escalate for a supported market verifier; do not approve on a chart alone.'},",
            "nextAction:bonding?'Return after graduation.':postgrad?(launchReview?'Independently confirm the launch history and absence of active external bonding; record the evidence reference.':'Continue ownership and safety review.'):robinhoodImportOnly?'Continue ownership and safety review. Trading remains disabled.':'Escalate for a supported market verifier; do not approve on a chart alone.'},"
          ],[
            'const automaticImportAllowed=match&&postgrad&&safe&&!technicalFailure&&!launchReview&&marketControlsOk;',
            'const automaticImportAllowed=match&&pageMarketEligible&&safe&&!technicalFailure&&!launchReview&&marketControlsOk;'
          ],[
            "const decision=bonding?'not_eligible':mismatch&&!pumpCreatorMismatch?'wrong_wallet':technicalFailure||!postgrad||!marketControlsOk?'technical_review':automaticImportAllowed?'automatic':'manual_review';",
            "const decision=bonding?'not_eligible':mismatch&&!pumpCreatorMismatch?'wrong_wallet':technicalFailure||!pageMarketEligible||!marketControlsOk?'technical_review':automaticImportAllowed?'automatic':'manual_review';"
          ],[
            "canVerifyOwner:!bonding&&(!mismatch||pumpCreatorMismatch)&&postgrad&&!technicalFailure&&marketControlsOk&&['pass','review'].includes(security?.status),",
            "canVerifyOwner:!bonding&&(!mismatch||pumpCreatorMismatch)&&pageMarketEligible&&(!technicalFailure||robinhoodImportOnly)&&marketControlsOk&&['pass','review'].includes(security?.status),"
          ],[
            "if(!snapshot.canVerifyOwner||!['postgrad','dex_market'].includes(snapshot.market?.phase)||snapshot.market?.verified!==true||snapshot.market?.liquidityAvailable!==true||snapshot.market?.pricingValid===false||snapshot.market?.buyEnabled===false||snapshot.market?.sellEnabled===false||!['pass','review'].includes(snapshot.security?.status))throw error('The checks require technical review. Ownership approval cannot override them.','PROJECT_IMPORT_TECHNICAL_REVIEW');",
            "const robinhoodImportOnly=snapshot.chainId===4663&&snapshot.market?.phase==='import_only'&&snapshot.market?.verified===true;\n  const supportedMarket=robinhoodImportOnly||(['postgrad','dex_market'].includes(snapshot.market?.phase)&&snapshot.market?.verified===true&&snapshot.market?.liquidityAvailable===true&&snapshot.market?.pricingValid!==false&&snapshot.market?.buyEnabled!==false&&snapshot.market?.sellEnabled!==false);\n  if(!snapshot.canVerifyOwner||!supportedMarket||!['pass','review'].includes(snapshot.security?.status))throw error('The checks require technical review. Ownership approval cannot override them.','PROJECT_IMPORT_TECHNICAL_REVIEW');"
          ]]);

          patch('frontend/src/pages/ProjectImport.tsx', [[
            'import { BNB_CHAIN_ID, SOLANA_CHAIN_ID } from "@/lib/chainConfig";',
            'import { BNB_CHAIN_ID, SOLANA_CHAIN_ID } from "@/lib/chainConfig";\nimport { projectImportRobinhoodEnabled } from "@/features/projectImports/config";'
          ],[
            'type ImportChain = "bnb" | "solana";',
            'type ImportChain = "bnb" | "solana" | "robinhood";\nconst ROBINHOOD_CHAIN_ID = 4663;'
          ],[
            'const chainId=chain==="bnb"?BNB_CHAIN_ID:SOLANA_CHAIN_ID; const connectedWallet=chain==="bnb"?wallet.account:solanaWallet.solanaAccount;',
            'const chainId=chain==="solana"?SOLANA_CHAIN_ID:chain==="robinhood"?ROBINHOOD_CHAIN_ID:BNB_CHAIN_ID; const connectedWallet=chain==="solana"?solanaWallet.solanaAccount:wallet.account;'
          ],[
            'const validAddress=useMemo(()=>{const value=tokenAddress.trim();return chain==="bnb"?/^0x[a-fA-F0-9]{40}$/.test(value):isSolanaAddress(value);},[chain,tokenAddress]);',
            'const validAddress=useMemo(()=>{const value=tokenAddress.trim();return chain==="solana"?isSolanaAddress(value):/^0x[a-fA-F0-9]{40}$/.test(value);},[chain,tokenAddress]);'
          ],[
            '<Button type="button" disabled={working} variant={chain==="solana"?"default":"outline"} onClick={()=>{setChainChosenByUser(true);setChain("solana");reset();}}>Solana</Button></div></div>',
            '<Button type="button" disabled={working} variant={chain==="solana"?"default":"outline"} onClick={()=>{setChainChosenByUser(true);setChain("solana");reset();}}>Solana</Button>{projectImportRobinhoodEnabled?<Button type="button" disabled={working} variant={chain==="robinhood"?"default":"outline"} onClick={()=>{setChainChosenByUser(true);setChain("robinhood");reset();}}>Robinhood</Button>:null}</div></div>'
          ],[
            'disabled={chain==="bnb"?wallet.connecting:solanaWallet.connectingSolana}>{connected?"WALLET CONNECTED":chain==="bnb"?"CONNECT BNB WALLET":"CONNECT SOLANA WALLET"}',
            'disabled={chain==="solana"?solanaWallet.connectingSolana:wallet.connecting}>{connected?"WALLET CONNECTED":chain==="solana"?"CONNECT SOLANA WALLET":chain==="robinhood"?"CONNECT ROBINHOOD WALLET":"CONNECT BNB WALLET"}'
          ]]);

          patch('frontend/src/pages/ImportedProjectDetails.tsx', [[
            'const chainLabel=solana?"Solana":"BNB",identityLabel=solana?"Mint":"Contract";',
            'const chainLabel=solana?"Solana":item.chainId===4663?"Robinhood":"BNB",identityLabel=solana?"Mint":"Contract";'
          ]]);

          patch('frontend/src/pages/TokenDetailsEntry.tsx', [[
            'import { projectImportsEnabled } from "@/features/projectImports/config";',
            'import { projectImportsEnabled, projectImportRobinhoodEnabled } from "@/features/projectImports/config";'
          ],[
            'if (requested === BNB_CHAIN_ID || requested === SOLANA_CHAIN_ID) return requested;',
            'if (requested === BNB_CHAIN_ID || requested === SOLANA_CHAIN_ID || (requested === 4663 && projectImportRobinhoodEnabled)) return requested;'
          ]]);

          patch('frontend/src/imported-token-details-page.test.mjs', [[
            'test("BNB and Solana imported identities select the dedicated project page", () => {',
            'test("BNB, Solana and feature-gated Robinhood imported identities select the dedicated project page", () => {'
          ],[
            'assert.match(entry, /requested === BNB_CHAIN_ID \\|\\| requested === SOLANA_CHAIN_ID/);',
            'assert.match(entry, /requested === BNB_CHAIN_ID \\|\\| requested === SOLANA_CHAIN_ID \\|\\| \\(requested === 4663 && projectImportRobinhoodEnabled\\)/);'
          ],[
            'assert.match(page, /const chainLabel=solana\\?"Solana":"BNB"/);',
            'assert.match(page, /item\\.chainId===4663\\?"Robinhood":"BNB"/);'
          ]]);

          fs.writeFileSync('frontend/api/lib/projectOwnershipResolveEvm.test.mjs', `import assert from "node:assert/strict";\nimport test from "node:test";\nimport { Interface, ZeroAddress } from "ethers";\nimport { resolveProjectOwnershipEvm } from "./projectOwnershipResolveEvm.js";\n\nconst iface=new Interface(["function name() view returns (string)","function symbol() view returns (string)","function decimals() view returns (uint8)","function totalSupply() view returns (uint256)","function owner() view returns (address)","function getOwner() view returns (address)"]);\nconst token="0x1111111111111111111111111111111111111111";\nconst owner="0x2222222222222222222222222222222222222222";\nfunction provider(chainId=4663,currentOwner=owner){return{getNetwork:async()=>({chainId:BigInt(chainId)}),getCode:async()=>"0x6001600055",call:async({data})=>{for(const method of ["name","symbol","decimals","totalSupply","owner","getOwner"]){if(data===iface.encodeFunctionData(method)){if(method==="name")return iface.encodeFunctionResult(method,["Robin Meme"]);if(method==="symbol")return iface.encodeFunctionResult(method,["RHM"]);if(method==="decimals")return iface.encodeFunctionResult(method,[18]);if(method==="totalSupply")return iface.encodeFunctionResult(method,[1000000n]);return iface.encodeFunctionResult(method,[currentOwner]);}}throw new Error("unknown call");}};}\n\ntest("generic EVM resolver verifies exposed owner on Robinhood chain",async()=>{const r=await resolveProjectOwnershipEvm({provider:provider(),chainId:4663,contractAddress:token,signedConnectedWallet:owner});assert.equal(r.ok,true);assert.equal(r.chainId,4663);assert.equal(r.token.symbol,"RHM");assert.equal(r.ownership.automaticOwnershipVerified,true);});\ntest("generic EVM resolver rejects wrong wallet without trusting deployer history",async()=>{const r=await resolveProjectOwnershipEvm({provider:provider(),chainId:4663,contractAddress:token,signedConnectedWallet:"0x3333333333333333333333333333333333333333"});assert.equal(r.ok,true);assert.equal(r.ownership.currentOwner,owner);assert.equal(r.ownership.automaticOwnershipVerified,false);});\ntest("renounced owner becomes unavailable instead of auto-verifying",async()=>{const r=await resolveProjectOwnershipEvm({provider:provider(4663,ZeroAddress),chainId:4663,contractAddress:token,signedConnectedWallet:owner});assert.equal(r.ok,true);assert.equal(r.ownership.automaticOwnershipVerification,"unavailable");});\ntest("wrong RPC chain fails closed before token reads",async()=>{const r=await resolveProjectOwnershipEvm({provider:provider(56),chainId:4663,contractAddress:token,signedConnectedWallet:owner});assert.equal(r.ok,false);assert.equal(r.errorCode,"PROJECT_IMPORT_CHAIN_MISMATCH");});\n`);

          fs.writeFileSync('frontend/src/robinhood-import-gate.test.mjs', `import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\nconst read=p=>readFile(new URL(p,import.meta.url),"utf8");\ntest("Robinhood import is independently frontend-gated and has no launch dependency",async()=>{const [cfg,page,entry,adapter]=await Promise.all([read("./features/projectImports/config.ts"),read("./pages/ProjectImport.tsx"),read("./pages/TokenDetailsEntry.tsx"),read("../api/lib/projectImportResolverAdapters.js")]);assert.match(cfg,/VITE_ENABLE_PROJECT_IMPORT_ROBINHOOD/);assert.match(page,/projectImportRobinhoodEnabled/);assert.match(page,/>Robinhood<\\/Button>/);assert.match(entry,/requested === 4663 && projectImportRobinhoodEnabled/);assert.match(adapter,/ROBINHOOD_CHAIN_ID = 4663/);assert.doesNotMatch(adapter,/LaunchFactory|graduation|locker|swap router|claims|Arena/i);});\n`);

          fs.rmSync('.github/workflows/apply-robinhood-import-once.yml');
          NODE
      - name: Install and prove patch before commit
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          node --test frontend/api/lib/projectOwnershipResolveEvm.test.mjs frontend/src/robinhood-import-gate.test.mjs frontend/src/imported-token-details-page.test.mjs
          npm --prefix frontend run build
      - name: Commit patch
        run: |
          git config user.name "MemeWarzone Launch Control"
          git config user.email "launch-control@users.noreply.github.com"
          git add -A
          git commit -m "feat(import): add feature-gated Robinhood EVM onboarding"
          git push origin HEAD:release/live-import-20260910
