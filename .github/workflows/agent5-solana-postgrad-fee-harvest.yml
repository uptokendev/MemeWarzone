name: Agent 5 Solana Post-Grad Fee Harvest

on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - ".github/workflows/agent5-solana-postgrad-fee-harvest.yml"
      - "realtime-indexer/src/solanaLpFees.ts"
      - "realtime-indexer/src/tests/solanaLpFeesTreasury.test.ts"
      - "realtime-indexer/scripts/certifySolanaPostgradFeeHarvest.ts"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  destructive-solana-fee-harvest:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'agent5/solana-postgrad-fee-harvest-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOLANA_APPLICATION_CHAIN_ID: "101"
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || secrets.SOLANA_DEVNET_RPC_URL || vars.SOLANA_DEVNET_RPC }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER || secrets.SOLANA_DEVNET_PRIVATE_KEY }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
      SOLANA_UPGRADE_AUTHORITY_PUBLIC_KEY: ${{ vars.SOLANA_DEVNET_UPGRADE_AUTHORITY_PUBLIC_KEY || secrets.SOLANA_DEVNET_UPGRADE_AUTHORITY_PUBLIC_KEY }}
      SOLANA_EXPECTED_PROGRAMDATA_ADDRESS: ${{ vars.SOLANA_DEVNET_PROGRAMDATA_ADDRESS }}
      SOLANA_EXPECTED_DEPLOYMENT_SLOT: ${{ vars.SOLANA_DEVNET_DEPLOYMENT_SLOT }}
      SOLANA_PROTOCOL_TREASURY_ADDRESS: ${{ vars.SOLANA_DEVNET_PROTOCOL_TREASURY_ADDRESS || secrets.SOLANA_DEVNET_PROTOCOL_TREASURY_ADDRESS }}
      SOLANA_LAUNCHPAD_PROGRAM_ID: "3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt"
      SOLANA_EXPECTED_DEVNET_GENESIS: "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
      SOLANA_LAUNCHPAD_PROGRAM_SHA256: "27ad65b560dba8a33330bd95f08ae7ca6945f71ebf667a5a3756ae0cb9f7f080"
      SOLANA_LAUNCHPAD_PROGRAM_BYTES: "1165328"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PG_DISABLE_SSL: "1"
      SEND_SOLANA_GRADUATION: "true"
      SOLANA_FEE_HARVEST_REPORT: reports/agent5-solana-postgrad-fee-harvest.json

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Enforce lane scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'df8e9dd32387cfe82f208c372461aa629f14cf84' }}"
          if git diff --name-only "$base"...HEAD -- programs/memewarzone_solana frontend/api/arena frontend/src/arena | grep -q .; then
            echo "BLOCKER: Agent 5 fee-harvest lane touched launchpad program or Arena source"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve certification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix tests/solana --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix tools/solana-meteora-graduation --no-audit --no-fund
          npm ci --prefix realtime-indexer --no-audit --no-fund

      - name: Prove fail-closed LP protocol treasury behavior
        shell: bash
        run: npx --prefix realtime-indexer tsx --test realtime-indexer/src/tests/solanaLpFeesTreasury.test.ts

      - name: Build realtime indexer after runtime fix
        shell: bash
        run: npm --prefix realtime-indexer run build

      - name: Build exact-source accepted Solana candidate and IDL
        shell: bash
        env:
          SOLANA_VERSION: "1.18.26"
          ANCHOR_VERSION: "0.30.1"
          RUST_TOOLCHAIN: "1.79.0"
          IDL_RUST_TOOLCHAIN: "nightly-2024-05-09"
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
          anchor build --program-name memewarzone_solana --no-idl
          test -s target/deploy/memewarzone_solana.so
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/idl/memewarzone_solana.json
          sha256sum target/deploy/memewarzone_solana.so
          wc -c target/deploy/memewarzone_solana.so

      - name: Classify destructive receiver readiness
        id: treasury
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DESTRUCTIVE WAIT: pull-request validation never sends Solana transactions. Launch Control must manually dispatch after approving the dedicated receiver."
          elif [ -n "${SOLANA_PROTOCOL_TREASURY_ADDRESS:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Manual destructive dispatch has the dedicated Solana devnet protocol treasury configured; acceptance may proceed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DESTRUCTIVE WAIT: dedicated SOLANA_DEVNET_PROTOCOL_TREASURY_ADDRESS is not configured. No treasury is fabricated and no devnet transaction will be sent."
          fi

      - name: Execute fresh chain-101 lifecycle through real Meteora post-grad BUY and SELL
        if: ${{ steps.treasury.outputs.ready == 'true' }}
        shell: bash
        env:
          SOLANA_LAUNCHPAD_PROGRAM_PATH: target/deploy/memewarzone_solana.so
        run: npm run solana:network-canary

      - name: Materialize harvest operator for current runtime
        if: ${{ steps.treasury.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          operator_file="$RUNNER_TEMP/mwz-solana-fee-harvest-operator.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs >/dev/null
          echo "SOLANA_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"

      - name: Execute real fee harvest and receiver reconciliation
        if: ${{ steps.treasury.outputs.ready == 'true' }}
        shell: bash
        run: npx --prefix realtime-indexer tsx realtime-indexer/scripts/certifySolanaPostgradFeeHarvest.ts execute

      - name: Fresh-process reload proof
        if: ${{ steps.treasury.outputs.ready == 'true' }}
        shell: bash
        run: npx --prefix realtime-indexer tsx realtime-indexer/scripts/certifySolanaPostgradFeeHarvest.ts reload

      - name: Upload Agent 5 Solana fee-harvest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent5-solana-postgrad-fee-harvest-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            reports/agent5-solana-postgrad-fee-harvest.json
            /tmp/mwz-solana-devnet-deployment-identity.json
            /tmp/mwz-solana-101-canary.json
            /tmp/mwz-solana-101-graduation.log
            /tmp/mwz-solana-101-graduation-result.json
            /tmp/mwz-solana-101-postgrad.json
          if-no-files-found: warn
          retention-days: 30
