name: Agent 6 Readiness Bootstrap

on:
  push:
    branches: [agent6/launch-chain-readiness-guard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent6/launch-chain-readiness-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/agent6-readiness-bootstrap.py
      - run: |
          npm ci --prefix frontend --no-audit --no-fund
          node --test frontend/api/lib/launchChainReadiness.test.mjs
          node --test frontend/api/lib/launchChainReadinessIntegration.test.mjs
          npm --prefix frontend run check:api-imports
          npm --prefix frontend run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(launch): fail closed on non-ready creator chains"
          git push origin HEAD:agent6/launch-chain-readiness-guard
