name: Arena Battle Scoring Foundation

on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - "db/migrations/*arena*.sql"
      - "db/migrations/*quarterly_championship*.sql"
      - "frontend/api/arenaLeague.js"
      - "frontend/api/lib/arenaLeagueScore.js"
      - "frontend/api/lib/arenaQuarterlyChampionship*.js"
      - "frontend/api/lib/arenaQuarterlyChampionship*.mjs"
      - "frontend/api/arenaBattleMetrics.js"
      - "frontend/api/arenaBattlesRuntime.js"
      - "frontend/api/postgrad.js"
      - "frontend/api/lib/arenaBattleMetrics.js"
      - "frontend/api/lib/arenaBattleMetrics.test.mjs"
      - "frontend/api/lib/arenaBattleVolume.js"
      - "frontend/api/lib/arenaBattleVolume.test.mjs"
      - "frontend/api/lib/arenaBattlePoints*.js"
      - "frontend/api/lib/arenaBattlePoints*.mjs"
      - "frontend/api/lib/arenaBattleSettle.js"
      - "frontend/api/lib/arenaBattleSettleV3.js"
      - "frontend/api/lib/arenaBattleSettlement*.js"
      - "frontend/api/lib/arenaBattleSettlement*.mjs"
      - "frontend/api/lib/arena4aCertification.test.mjs"
      - ".github/workflows/arena-battle-scoring-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-foundation:
    name: Baseline, volume, scoring and 4a certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Syntax-check scoring foundation and runtime settlement
        working-directory: frontend
        run: |
          node --check api/lib/arenaBattlePointsCanonical.js
          node --check api/lib/arenaBattleVolume.js
          node --check api/lib/arenaBattleMetrics.js
          node --check api/lib/arenaBattleSettlementRuntime.js
          node --check api/lib/arenaBattleSettlementGuard.js
          node --check api/lib/arenaBattleSettlementV2Service.js
          node --check api/lib/arenaBattleSettlementV3Service.js
          node --check api/arenaBattlesRuntime.js
          node --check api/arenaBattleMetrics.js

      - name: Pure calculator, volume and runtime activation certification
        working-directory: frontend
        env:
          DATABASE_URL: ""
        run: |
          node --test api/lib/arenaBattlePointsCanonical.test.mjs
          node --test api/lib/arenaBattleVolume.test.mjs
          node --test api/lib/arenaBattlePoints.test.mjs
          node --test api/lib/arenaBattlePointsV3.test.mjs
          node --test api/lib/arenaBattleSettlementV3Activation.test.mjs

      - name: Baseline regression certification
        working-directory: frontend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          PG_DISABLE_SSL: "1"
        run: node --test api/lib/arenaBattleMetrics.test.mjs

      - name: V2 lock and rollback certification
        working-directory: frontend
        run: node --test --test-name-pattern="historical V2 settlement still locks" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: V2 immutable generation certification
        working-directory: frontend
        run: node --test --test-name-pattern="historical V2 service is selected" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: V2 50 30 20 certification
        working-directory: frontend
        run: node --test --test-name-pattern="V2 reconciliation stays" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: V2 persistence certification
        working-directory: frontend
        run: node --test --test-name-pattern="V2 settlement evidence persists" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: V2 immutable global config certification
        working-directory: frontend
        run: node --test --test-name-pattern="global flags cannot reinterpret" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: V2 worker and tournament regression certification
        working-directory: frontend
        run: node --test --test-name-pattern="existing V2 worker" api/lib/arenaBattleSettlementV2Certification.test.mjs

      - name: Existing 4a certification unchanged
        working-directory: frontend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          PG_DISABLE_SSL: "1"
        run: node --test api/lib/arena4aCertification.test.mjs

      - name: Prove canonical scoring math is chain neutral
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '\b(BNB|Solana|Robinhood)\b|chainId|chain_id' frontend/api/lib/arenaBattlePointsCanonical.js; then
            echo "Chain-specific branch leaked into canonical Battle scoring math" >&2
            exit 1
          fi
          echo "canonical_scoring_chain_neutral=ok"
