name: Agent 3 ArenaMoneyV2 Devnet Reconciliation

on:
  push:
    branches: [agent3/solana-arena-money-v2-reconcile-120401f]
    paths: [.github/workflows/agent3-solana-arena-v2-reconcile-live.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  EXPECTED_GENESIS: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
  TARGET_AUTHORITY: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  REQUIRED_TOPUP_LAMPORTS: '11300000000'
  OPERATING_RESERVE_LAMPORTS: '200000000'

jobs:
  route-signer-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 120401fd1fde0dce6e2439fc4156840e029f1ae6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove exact base and current-repository treatment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          echo 'EXACT_BASE_ROUTE_SIGNER_REFERENCES_BEGIN'
          git grep -n 'SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY' "$BASE_SHA" -- . || true
          echo 'EXACT_BASE_ROUTE_SIGNER_REFERENCES_END'
          echo 'CURRENT_DEVNET_CONFIG_REFERENCES_BEGIN'
          git grep -n -E 'SOLANA_CLUSTER=solana-devnet|SOLANA_ROUTE_SIGNER_SECRET_KEY|SOLANA_DEVNET_PAYER' "$BASE_SHA" -- frontend scripts .github 2>/dev/null | head -n 160 || true
          echo 'CURRENT_DEVNET_CONFIG_REFERENCES_END'
      - name: Install Solana web3 only
        run: npm install --no-save --package-lock=false --no-audit --no-fund @solana/web3.js@1.95.4
      - name: Derive route signer public key and devnet balance only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {Connection,Keypair,PublicKey}=require('@solana/web3.js');
          const ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function decodeBase58(value){let num=0n;for(const c of value){const i=ALPHABET.indexOf(c);if(i<0)throw new Error('invalid base58');num=num*58n+BigInt(i);}let hex=num.toString(16);if(hex.length%2)hex='0'+hex;let body=Buffer.from(hex,'hex');let zeros=0;for(const c of value){if(c==='1')zeros++;else break;}return Uint8Array.from(Buffer.concat([Buffer.alloc(zeros),body]));}
          function parse(raw){const v=String(raw||'').trim();if(!v)throw new Error('SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY missing');let b;if(v.startsWith('['))b=Uint8Array.from(JSON.parse(v).map(Number));else if(/^(0x)?[0-9a-fA-F]{128}$/.test(v))b=Uint8Array.from(Buffer.from(v.replace(/^0x/,''),'hex'));else b=decodeBase58(v);if(b.length===64)return Keypair.fromSecretKey(b);if(b.length===32)return Keypair.fromSeed(b);throw new Error('route signer secret did not decode to 32/64 bytes');}
          (async()=>{
            const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
            const genesis=await c.getGenesisHash();
            console.log('GENESIS '+genesis);
            if(genesis!==process.env.EXPECTED_GENESIS)throw new Error('wrong cluster');
            const kp=parse(process.env.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY);
            const pub=kp.publicKey.toBase58();
            const bal=await c.getBalance(kp.publicKey,'confirmed');
            const reserve=Number(process.env.OPERATING_RESERVE_LAMPORTS);
            const safe=Math.max(0,bal-reserve);
            console.log('ROUTE_SIGNER_PUBLIC_KEY '+pub);
            console.log('ROUTE_SIGNER_BALANCE_LAMPORTS '+bal);
            console.log('ROUTE_SIGNER_BALANCE_SOL '+(bal/1e9).toFixed(9));
            console.log('OPERATING_RESERVE_LAMPORTS '+reserve);
            console.log('SAFE_TRANSFERABLE_LAMPORTS '+safe);
            console.log('SAFE_TRANSFERABLE_SOL '+(safe/1e9).toFixed(9));
            console.log('TARGET_TOPUP_LAMPORTS '+process.env.REQUIRED_TOPUP_LAMPORTS);
            console.log('SUFFICIENT_FOR_TARGET '+(safe>=Number(process.env.REQUIRED_TOPUP_LAMPORTS)));
            console.log('TARGET_AUTHORITY '+new PublicKey(process.env.TARGET_AUTHORITY).toBase58());
          })().catch(e=>{console.error('ROUTE_SIGNER_PROBE_BLOCKER '+(e?.stack||e));process.exit(1)});
          NODE
