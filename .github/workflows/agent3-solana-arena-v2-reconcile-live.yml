name: Agent 3 ArenaMoneyV2 Devnet Reconciliation

on:
  push:
    branches: [agent3/solana-arena-money-v2-reconcile-120401f]
    paths: [.github/workflows/agent3-solana-arena-v2-reconcile-live.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  EXPECTED_SHA: 156ae2069c4c50acd81d6d26754e4ec12bf6f95dfb1e6dbdf99de46688fdb3e8
  EXPECTED_SIZE: '1487736'
  EXPECTED_IDL_SHA: 13eada1464e67e2c4b398a1690ee7d4db476018e644e8403eff8e824b8242fea

jobs:
  canonical-runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 120401fd1fde0dce6e2439fc4156840e029f1ae6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact-base and locked economics gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          grep -F 'COMPETITION_PRIZE_BPS: u64 = 7_500' programs/mwz_rewards_treasury/src/arena_money_v2/competition.rs
          grep -F 'COMPETITION_LEAGUE_BPS: u64 = 2_000' programs/mwz_rewards_treasury/src/arena_money_v2/competition.rs
          grep -F 'COMPETITION_PROTOCOL_BPS: u64 = 500' programs/mwz_rewards_treasury/src/arena_money_v2/competition.rs
          echo PREVIOUSLY_REPRODUCED_SBF=$EXPECTED_SHA
          echo PREVIOUSLY_REPRODUCED_SIZE=$EXPECTED_SIZE
          echo PREVIOUSLY_REPRODUCED_IDL=$EXPECTED_IDL_SHA
      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --prefix frontend --no-audit --no-fund
      - name: Hardhat ArenaMoney V2 and legacy Arena
        run: npx hardhat test test/ArenaMoneyV2.spec.ts test/ArenaWarPoolTreasury.spec.ts
      - name: Focused current Solana Arena runtime
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            frontend/api/lib/solanaArenaMoneyV2Runtime.test.mjs \
            frontend/src/lib/solanaArenaLayout.test.mjs \
            frontend/api/lib/arenaTournamentV2Certification.test.mjs \
            frontend/api/lib/arenaSolanaNormalBoostAuthority.test.mjs
      - name: Full Arena runtime acceptance
        run: npm --prefix frontend run test:arena-runtime-acceptance
      - name: Full Solana Arena client regression
        run: npm --prefix frontend run test:solana-arena
      - name: Solana operator reconciliation/retry matrix
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund @solana/web3.js@1.95.4
          node --test \
            scripts/solana/arena-operator-resolve.test.mjs \
            scripts/solana/arena-operator-tournament.test.mjs \
            scripts/solana/arena-operator-v0.test.mjs \
            scripts/solana/arena-operator-worker.test.mjs
          echo ECONOMICS=7500/2000/500
          echo CANONICAL_RUNTIME_MATRIX=PASS
