name: Agent 3 ArenaMoneyV2 Devnet Reconciliation

on:
  push:
    branches: [agent3/solana-arena-money-v2-reconcile-120401f]
    paths: [.github/workflows/agent3-solana-arena-v2-reconcile-live.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  EXPECTED_GENESIS: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG
  TARGET_AUTHORITY: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  PROGRAM_ID: 2NzthKEZHtbnqXxT4eeEnEQRHkQsdqgqVsfzcCCoZBKX
  EXPECTED_CONFIG: Bio7bTMDLo1rYhKbR26jW98N4YvdeQW3UzUw4cHEv8xX

jobs:
  receiver-authority-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
      V_SOLANA_ARENA_PROTOCOL_RECEIVER: ${{ vars.SOLANA_ARENA_PROTOCOL_RECEIVER }}
      V_SOLANA_ARENA_MARKETING_RECEIVER: ${{ vars.SOLANA_ARENA_MARKETING_RECEIVER }}
      V_ARENA_PROTOCOL_RECEIVER_101: ${{ vars.ARENA_PROTOCOL_RECEIVER_101 }}
      V_ARENA_MARKETING_RECEIVER_101: ${{ vars.ARENA_MARKETING_RECEIVER_101 }}
      V_ARENA_V2_PROTOCOL_RECEIVER: ${{ vars.ARENA_V2_PROTOCOL_RECEIVER }}
      V_ARENA_V2_MARKETING_RECEIVER: ${{ vars.ARENA_V2_MARKETING_RECEIVER }}
      V_PROTOCOL_REVENUE_VAULT: ${{ vars.PROTOCOL_REVENUE_VAULT_ADDRESS }}
      V_MARKETING_RECEIVER: ${{ vars.MARKETING_RECEIVER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze remote authority and install web3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          remote="$(git ls-remote origin refs/heads/build/cross-chain-stabilization-rh-base | awk '{print $1}')"
          echo "REMOTE_INTEGRATION_SHA $remote"
          test "$remote" = "$BASE_SHA"
          npm install --no-save --package-lock=false --no-audit --no-fund @solana/web3.js@1.95.4
      - name: Re-read canonical signer and receiver candidates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {Connection,Keypair,PublicKey}=require('@solana/web3.js');
          const ALPHABET='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          function decodeBase58(value){let num=0n;for(const c of value){const i=ALPHABET.indexOf(c);if(i<0)throw new Error('invalid base58');num=num*58n+BigInt(i);}let hex=num.toString(16);if(hex.length%2)hex='0'+hex;let body=Buffer.from(hex,'hex');let zeros=0;for(const c of value){if(c==='1')zeros++;else break;}return Uint8Array.from(Buffer.concat([Buffer.alloc(zeros),body]));}
          function parse(raw,name){const v=String(raw||'').trim();if(!v)throw new Error(name+' missing');let b;if(v.startsWith('['))b=Uint8Array.from(JSON.parse(v).map(Number));else if(/^(0x)?[0-9a-fA-F]{64}$/.test(v))b=Uint8Array.from(Buffer.from(v.replace(/^0x/,''),'hex'));else if(/^(0x)?[0-9a-fA-F]{128}$/.test(v))b=Uint8Array.from(Buffer.from(v.replace(/^0x/,''),'hex'));else b=decodeBase58(v);if(b.length===64)return Keypair.fromSecretKey(b);if(b.length===32)return Keypair.fromSeed(b);throw new Error(name+' bad key bytes');}
          (async()=>{
            const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
            const genesis=await c.getGenesisHash(); console.log('GENESIS '+genesis); if(genesis!==process.env.EXPECTED_GENESIS)throw new Error('wrong cluster');
            const payer=parse(process.env.SOLANA_DEVNET_PAYER,'payer'); const route=parse(process.env.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY,'route');
            console.log('PAYER '+payer.publicKey.toBase58()); console.log('PAYER_BALANCE '+await c.getBalance(payer.publicKey,'confirmed'));
            console.log('ROUTE_SIGNER '+route.publicKey.toBase58()); console.log('ROUTE_BALANCE '+await c.getBalance(route.publicKey,'confirmed'));
            const program=new PublicKey(process.env.PROGRAM_ID);
            const [legacy]=PublicKey.findProgramAddressSync([Buffer.from('arena_config')],program); console.log('LEGACY_ARENA_CONFIG '+legacy.toBase58());
            const li=await c.getAccountInfo(legacy,'confirmed'); console.log('LEGACY_EXISTS '+Boolean(li));
            if(li){const d=Buffer.from(li.data); console.log('LEGACY_BYTES '+d.length); if(d.length>=8+32*4+3){let o=8; const rd=()=>{const p=new PublicKey(d.subarray(o,o+32)).toBase58();o+=32;return p};console.log('LEGACY_AUTHORITY '+rd());console.log('LEGACY_RESOLVER '+rd());console.log('LEGACY_PROTOCOL_RECEIVER '+rd());console.log('LEGACY_MWL_RECEIVER '+rd());console.log('LEGACY_PAUSED '+Boolean(d[o++]));console.log('LEGACY_BUMP '+d[o++]);console.log('LEGACY_VERSION '+d[o++]);}}
            const [cfg,bump]=PublicKey.findProgramAddressSync([Buffer.from('arena_money_config_v2')],program);console.log('V2_CONFIG '+cfg.toBase58());console.log('V2_BUMP '+bump);console.log('V2_EXISTS '+Boolean(await c.getAccountInfo(cfg,'confirmed')));
            for(const k of ['V_SOLANA_ARENA_PROTOCOL_RECEIVER','V_SOLANA_ARENA_MARKETING_RECEIVER','V_ARENA_PROTOCOL_RECEIVER_101','V_ARENA_MARKETING_RECEIVER_101','V_ARENA_V2_PROTOCOL_RECEIVER','V_ARENA_V2_MARKETING_RECEIVER','V_PROTOCOL_REVENUE_VAULT','V_MARKETING_RECEIVER']){const v=String(process.env[k]||'').trim();if(v){try{console.log(k+' '+new PublicKey(v).toBase58())}catch{console.log(k+' INVALID')}}else console.log(k+' UNSET')}
          })().catch(e=>{console.error(e?.stack||e);process.exit(1)});
          NODE