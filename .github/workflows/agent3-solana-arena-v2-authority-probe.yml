name: Agent 3 ArenaMoneyV2 Authority Probe

on:
  push:
    branches: [agent3/solana-arena-money-v2-reconcile-120401f]
    paths: [.github/workflows/agent3-solana-arena-v2-authority-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  PROGRAM_ID: 2NzthKEZHtbnqXxT4eeEnEQRHkQsdqgqVsfzcCCoZBKX
  EXPECTED_GENESIS: EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG

jobs:
  live-authority-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: airdrop-solana-devnet
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL || secrets.SOLANA_DEVNET_RPC || vars.SOLANA_REWARDS_RPC_URL || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_REWARDS_AUTHORITY_SECRET_KEY: ${{ secrets.SOLANA_REWARDS_AUTHORITY_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 120401fd1fde0dce6e2439fc4156840e029f1ae6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          grep -F 'pub const ARENA_CONFIG_SEED: &[u8] = b"arena_config";' programs/mwz_rewards_treasury/src/arena.rs
          grep -F 'pub struct ArenaConfig' programs/mwz_rewards_treasury/src/arena.rs
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @solana/web3.js@1.95.4
      - name: Decode current live Arena config and rewards config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {Connection,PublicKey,Keypair}=require('@solana/web3.js');
          const program=new PublicKey(process.env.PROGRAM_ID);
          function signer(raw){
            const t=String(raw||'').trim(); if(!t) throw new Error('missing rewards signer');
            const b=t.startsWith('[')?Uint8Array.from(JSON.parse(t).map(Number)):Uint8Array.from(Buffer.from(t,'base64'));
            if(b.length===64)return Keypair.fromSecretKey(b); if(b.length===32)return Keypair.fromSeed(b); throw new Error('bad signer bytes');
          }
          function pk(d,o){return new PublicKey(d.subarray(o,o+32)).toBase58();}
          (async()=>{
            const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
            const g=await c.getGenesisHash(); console.log('GENESIS '+g); if(g!==process.env.EXPECTED_GENESIS) throw new Error('wrong cluster');
            const s=signer(process.env.SOLANA_REWARDS_AUTHORITY_SECRET_KEY); console.log('REWARDS_SIGNER '+s.publicKey.toBase58());
            const [arena,bump]=PublicKey.findProgramAddressSync([Buffer.from('arena_config')],program);
            const ai=await c.getAccountInfo(arena,'confirmed');
            console.log(`LEGACY_ARENA_CONFIG_PDA ${arena.toBase58()} BUMP ${bump} EXISTS ${Boolean(ai)}`);
            if(ai){
              if(!ai.owner.equals(program)) throw new Error('legacy Arena config wrong owner');
              const d=Buffer.from(ai.data); if(d.length<8+131) throw new Error(`legacy Arena config too short ${d.length}`);
              let o=8;
              const authority=pk(d,o);o+=32; const resolver=pk(d,o);o+=32; const protocol=pk(d,o);o+=32; const mwl=pk(d,o);o+=32;
              const paused=Boolean(d[o++]); const storedBump=d[o++]; const version=d[o++];
              console.log('LEGACY_ARENA_AUTHORITY '+authority);
              console.log('LEGACY_ARENA_RESOLVER '+resolver);
              console.log('LEGACY_ARENA_PROTOCOL_RECEIVER '+protocol);
              console.log('LEGACY_ARENA_MWL_RECEIVER '+mwl);
              console.log(`LEGACY_ARENA_PAUSED ${paused} STORED_BUMP ${storedBump} VERSION ${version}`);
            }
            const [rewards,rb]=PublicKey.findProgramAddressSync([Buffer.from('rewards_config')],program);
            const ri=await c.getAccountInfo(rewards,'confirmed');
            console.log(`REWARDS_CONFIG_PDA ${rewards.toBase58()} BUMP ${rb} EXISTS ${Boolean(ri)} BYTES ${ri?.data?.length||0}`);
            if(ri){ console.log('REWARDS_CONFIG_OWNER '+ri.owner.toBase58()); console.log('REWARDS_CONFIG_DATA_SHA256 '+require('crypto').createHash('sha256').update(Buffer.from(ri.data)).digest('hex')); }
          })().catch(e=>{console.error('LIVE_AUTHORITY_BLOCKER '+(e?.stack||e));process.exit(1)});
          NODE
