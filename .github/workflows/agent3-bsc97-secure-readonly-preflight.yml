name: Agent 3 BSC97 Secure Read-Only Preflight

on:
  push:
    branches:
      - agent3/bsc97-secure-readonly-preflight-3512139

permissions:
  contents: read

concurrency:
  group: agent3-bsc97-secure-readonly-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet-certification
    env:
      BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC_URL }}
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK || secrets.PRIVATE_KEY_DEPLOY }}
      BNB_TESTNET_ADMIN: 0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa
      BNB_6C_ROUTE_AUTHORITY_ADDRESS: 0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec
      EXPECTED_OPERATOR: 0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa
      EXPECTED_ROUTE_AUTHORITY: 0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec
      STAGE_MANIFEST: reports/bnb-real-topaz-testnet-stage.json
    steps:
      - name: Checkout pushed source exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --silent

      - name: Secure BSC97 read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { Contract, JsonRpcProvider, Wallet, ZeroAddress, formatEther, getAddress } = require('ethers');
          const {
            loadAuthoritativeTopazManifest,
            assertRuntimeTopazIdentity,
            assertRealStageManifest,
            sameAddress,
          } = require('./scripts/lib/bnbRealTopazAuthority.cjs');
          const { resolveExactCheckedOutHead } = require('./scripts/lib/exactSourceHead.cjs');

          const EXPECTED_CHAIN_ID = 97;
          const expectedOperator = getAddress(process.env.EXPECTED_OPERATOR);
          const expectedRoute = getAddress(process.env.EXPECTED_ROUTE_AUTHORITY);
          const configuredAdmin = getAddress(process.env.BNB_TESTNET_ADMIN);
          const configuredRoute = getAddress(process.env.BNB_6C_ROUTE_AUTHORITY_ADDRESS);
          const rpc = String(process.env.BSC_TESTNET_RPC || '').trim();
          const rawPrivateKey = String(process.env.DEPLOYER_PK || '').trim();
          const privateKey = rawPrivateKey && !rawPrivateKey.startsWith('0x') ? `0x${rawPrivateKey}` : rawPrivateKey;
          const stagePath = String(process.env.STAGE_MANIFEST || 'reports/bnb-real-topaz-testnet-stage.json');

          function fail(code) {
            console.error(`PREFLIGHT FAILED: ${code}`);
            process.exit(1);
          }

          async function safe(label, fn) {
            try {
              return await fn();
            } catch {
              fail(label);
            }
          }

          (async () => {
            if (!rpc) fail('BSC_TESTNET_RPC_OR_URL_MISSING');
            if (!privateKey) fail('DEPLOYER_PK_OR_PRIVATE_KEY_DEPLOY_MISSING');

            const checkedOutSha = await safe('SOURCE_HEAD_UNRESOLVED', () => resolveExactCheckedOutHead(process.cwd()));
            const gitHead = await safe('GIT_HEAD_UNRESOLVED', () =>
              execFileSync('git', ['rev-parse', '--verify', 'HEAD^{commit}'], { encoding: 'utf8' }).trim().toLowerCase(),
            );
            const githubSha = String(process.env.GITHUB_SHA || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(checkedOutSha) || checkedOutSha !== gitHead || checkedOutSha !== githubSha) {
              fail('SOURCE_SHA_NOT_EXACT_HEAD');
            }

            const provider = await safe('RPC_PROVIDER_INIT_FAILED', () => new JsonRpcProvider(rpc));
            const network = await safe('RPC_CHAIN_ID_READ_FAILED', () => provider.getNetwork());
            const chainId = Number(network.chainId);
            if (chainId !== EXPECTED_CHAIN_ID) fail('CHAIN_NOT_97');

            const deployer = await safe('DEPLOYER_DERIVATION_FAILED', () => new Wallet(privateKey));
            const deployerAddress = await safe('DEPLOYER_ADDRESS_INVALID', () => getAddress(deployer.address));
            if (!sameAddress(deployerAddress, expectedOperator)) fail('DEPLOYER_NOT_FROZEN_OPERATOR');
            if (!sameAddress(configuredAdmin, deployerAddress)) fail('ADMIN_NOT_DEPLOYER');
            if (!sameAddress(configuredRoute, expectedRoute)) fail('ROUTE_AUTHORITY_NOT_FROZEN');
            if (sameAddress(configuredRoute, deployerAddress)) fail('ROUTE_AUTHORITY_EQUALS_DEPLOYER');

            const operatorBalance = await safe('OPERATOR_BALANCE_READ_FAILED', () => provider.getBalance(expectedOperator));
            const routeBalance = await safe('ROUTE_BALANCE_READ_FAILED', () => provider.getBalance(expectedRoute));

            const topazLoaded = await safe('TOPAZ_MANIFEST_INVALID', () => loadAuthoritativeTopazManifest());
            const topaz = topazLoaded.manifest;
            const t = topaz.contracts;
            const bytecode = {};
            for (const [label, address] of Object.entries(t)) {
              const code = await safe(`TOPAZ_${label.toUpperCase()}_BYTECODE_READ_FAILED`, () => provider.getCode(address));
              if (!code || code === '0x') fail(`TOPAZ_${label.toUpperCase()}_BYTECODE_MISSING`);
              bytecode[label] = true;
            }

            const routerProbe = await safe('TOPAZ_ROUTER_PROBE_INIT_FAILED', () => new Contract(t.Router, [
              'function defaultFactory() view returns (address)',
              'function factoryRegistry() view returns (address)',
              'function weth() view returns (address)',
            ], provider));
            const poolFactoryProbe = await safe('TOPAZ_POOL_FACTORY_PROBE_INIT_FAILED', () => new Contract(t.PoolFactory, [
              'function implementation() view returns (address)',
              'function getFee(address,bool) view returns (uint256)',
            ], provider));

            const runtime = {
              chainId,
              router: t.Router,
              poolFactory: await safe('TOPAZ_DEFAULT_FACTORY_READ_FAILED', () => routerProbe.defaultFactory()),
              factoryRegistry: await safe('TOPAZ_FACTORY_REGISTRY_READ_FAILED', () => routerProbe.factoryRegistry()),
              wbnb: await safe('TOPAZ_WBNB_READ_FAILED', () => routerProbe.weth()),
              poolImplementation: await safe('TOPAZ_IMPLEMENTATION_READ_FAILED', () => poolFactoryProbe.implementation()),
              volatileFeeBps: Number(await safe('TOPAZ_FEE_READ_FAILED', () => poolFactoryProbe.getFee(ZeroAddress, false))),
            };
            await safe('TOPAZ_RUNTIME_IDENTITY_MISMATCH', () => assertRuntimeTopazIdentity(runtime, topaz));

            let stageExists = false;
            if (fs.existsSync(stagePath)) {
              stageExists = true;
              const stage = await safe('GEN4_STAGE_MANIFEST_PARSE_FAILED', () =>
                JSON.parse(fs.readFileSync(stagePath, 'utf8')),
              );
              await safe('GEN4_STAGE_MANIFEST_INVALID', () => assertRealStageManifest(stage, topaz));
              if (!sameAddress(stage.admin, expectedOperator)) fail('GEN4_STAGE_ADMIN_MISMATCH');
              if (!sameAddress(stage.routeAuthority, expectedRoute)) fail('GEN4_STAGE_ROUTE_AUTHORITY_MISMATCH');
              if (String(stage.sourceBaseSha || '').toLowerCase() !== checkedOutSha) fail('GEN4_STAGE_SOURCE_SHA_MISMATCH');
            }

            console.log(`SHA ${checkedOutSha}`);
            console.log('CHAIN 97 VERIFIED YES');
            console.log(`DEPLOYER ${deployerAddress}`);
            console.log('DEPLOYER MATCH YES');
            console.log(`OPERATOR BALANCE ${formatEther(operatorBalance)} tBNB`);
            console.log(`ROUTE AUTHORITY ${configuredRoute}`);
            console.log(`ROUTE BALANCE ${formatEther(routeBalance)} tBNB`);
            console.log(`TOPAZ BYTECODE Router=${bytecode.Router ? 'YES' : 'NO'} PoolFactory=${bytecode.PoolFactory ? 'YES' : 'NO'} FactoryRegistry=${bytecode.FactoryRegistry ? 'YES' : 'NO'} WBNB=${bytecode.WBNB ? 'YES' : 'NO'} PoolImplementation=${bytecode.PoolImplementation ? 'YES' : 'NO'}`);
            console.log(`TOPAZ RUNTIME Router=${t.Router} PoolFactory=${runtime.poolFactory} FactoryRegistry=${runtime.factoryRegistry} WBNB=${runtime.wbnb} PoolImplementation=${runtime.poolImplementation} VolatileFeeBps=${runtime.volatileFeeBps}`);
            console.log('TOPAZ LIVE VERIFIED YES');
            console.log('SOURCE SHA VERIFIED YES');
            console.log(`GEN-4 STAGE ALREADY EXISTS ${stageExists ? 'YES' : 'NO'}`);
            console.log('GEN-4 DEPLOYMENT READY YES');
          })().catch(() => fail('UNEXPECTED_PREFLIGHT_FAILURE'));
          NODE
