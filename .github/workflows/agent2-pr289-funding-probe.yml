name: Agent 2 PR289 funding probe

on:
  push:
    branches:
      - cert/agent2-pr289-final-exact-head-20260911
    paths:
      - .github/workflows/agent2-pr289-funding-probe.yml

permissions:
  contents: read

env:
  TARGET_SHA: f18505e39186a5fa73fd89f00b242b94782f2f2c
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  STATIC_LAUNCHPAD_ALT: AoX2EzL4i2Zb62LjsGU9xWKXbjG9CU5DGH58vxFEYJev

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Probe approved identities, balances, profiles, and static ALT
        shell: bash
        run: |
          set -euo pipefail
          operator_file="$RUNNER_TEMP/operator.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs >/dev/null
          OPERATOR_FILE="$operator_file" node - <<'NODE'
          const fs=require('fs');
          const {Connection,Keypair,PublicKey,Ed25519Program,ComputeBudgetProgram,SYSVAR_INSTRUCTIONS_PUBKEY,SystemProgram}=require('./tests/solana/node_modules/@solana/web3.js');
          const {TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID}=require('./tests/solana/node_modules/@solana/spl-token');
          const operator=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.OPERATOR_FILE,'utf8'))));
          const route=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(process.env.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY)));
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          const program=new PublicKey(process.env.PROGRAM_ID);
          const rewards=new PublicKey('2NzthKEZHtbnqXxT4eeEnEQRHkQsdqgqVsfzcCCoZBKX');
          const pda=(...seeds)=>PublicKey.findProgramAddressSync(seeds.map(s=>Buffer.isBuffer(s)?s:Buffer.from(s)),program)[0];
          const rewardPda=(seed)=>PublicKey.findProgramAddressSync([Buffer.from(seed)],rewards)[0];
          (async()=>{
            const genesis=await c.getGenesisHash(); if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error('not devnet');
            for(const [label,kp] of [['OPERATOR',operator],['ROUTE_SIGNER',route]]){
              const bal=await c.getBalance(kp.publicKey,'confirmed');
              const cp=pda(Buffer.from('creator'),kp.publicKey.toBuffer());
              const rp=pda(Buffer.from('risk'),kp.publicKey.toBuffer());
              const ci=await c.getAccountInfo(cp,'confirmed'); const ri=await c.getAccountInfo(rp,'confirmed');
              console.log(label+'_PUBKEY',kp.publicKey.toBase58());
              console.log(label+'_BALANCE',bal);
              console.log(label+'_CREATOR_PROFILE',cp.toBase58(),ci?`YES:${ci.data.length}`:'NO');
              console.log(label+'_RISK_PROFILE',rp.toBase58(),ri?`YES:${ri.data.length}`:'NO');
            }
            const altKey=new PublicKey(process.env.STATIC_LAUNCHPAD_ALT);
            const table=(await c.getAddressLookupTable(altKey)).value;
            if(!table) throw new Error('static launchpad ALT missing');
            const expected=[program,pda(Buffer.from('global')),Ed25519Program.programId,ComputeBudgetProgram.programId,SYSVAR_INSTRUCTIONS_PUBKEY,TOKEN_PROGRAM_ID,ASSOCIATED_TOKEN_PROGRAM_ID,SystemProgram.programId,rewards,...['league_vault','airdrop_vault','monthly_league_vault','recruiter_vault','squad_vault','protocol_vault'].map(rewardPda)];
            const missing=expected.filter(k=>!table.state.addresses.some(x=>x.equals(k)));
            console.log('STATIC_ALT',altKey.toBase58(),'ADDRESSES',table.state.addresses.length,'AUTHORITY',table.state.authority?.toBase58?.()||'none','DEACTIVATION_SLOT',String(table.state.deactivationSlot));
            console.log('STATIC_ALT_REQUIRED_MISSING',missing.map(x=>x.toBase58()).join(',')||'NONE');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
