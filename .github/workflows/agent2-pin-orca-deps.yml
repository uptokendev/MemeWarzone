name: Agent 2 pin Orca dependencies

on:
  push:
    branches: [agent2/solana-basic-graduation-market]
    paths: [.github/workflows/agent2-pin-orca-deps.yml]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin frontend and operator Orca SDKs
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix frontend --save-exact --no-audit --no-fund @orca-so/whirlpools@8.0.1 @solana/kit@5.0.0
          npm install --prefix tools/solana-meteora-graduation --save-exact --no-audit --no-fund @orca-so/whirlpools@8.0.1 @solana/kit@5.0.0
          node --check frontend/api/lib/solanaOrcaGraduationQuote.js
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
          node --check tools/solana-meteora-graduation/orca-devnet-cert-pool.mjs
          node --check tools/solana-meteora-graduation/graduate-basic-quote.mjs
      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json tools/solana-meteora-graduation/package.json tools/solana-meteora-graduation/package-lock.json
          git commit -m 'build(agent2): pin Orca devnet acquisition dependencies'
          git push origin HEAD:agent2/solana-basic-graduation-market
