name: RH46630 QA indexer smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin tests (no production secrets)
        run: node --test scripts/rh46630-qa-indexer-smoke.test.mjs

      - name: Read Coolify QA indexer only
        env:
          QA_INDEXER: https://s75mnp6dfpjtv8m8fcefxlay.178.104.232.231.sslip.io
          CAMPAIGN: "0xB69E19C4387905170aa17E986aAA3b805dAfe440"
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -fsS -m 20 "$QA_INDEXER/health" -o reports/rh46630-qa-indexer-health.json
          curl -fsS -m 20 "$QA_INDEXER/api/token/$CAMPAIGN/market-state?chainId=46630" -o reports/rh46630-qa-indexer-market-state.json
          node --input-type=module -e '
            import fs from "node:fs";
            import { evaluateHealth, evaluateMarketState } from "./scripts/rh46630-qa-indexer-smoke.mjs";
            const healthBody = JSON.parse(fs.readFileSync("reports/rh46630-qa-indexer-health.json", "utf8"));
            const marketBody = JSON.parse(fs.readFileSync("reports/rh46630-qa-indexer-market-state.json", "utf8"));
            const health = evaluateHealth(healthBody);
            const market = evaluateMarketState(marketBody);
            const report = { health, market };
            fs.writeFileSync("reports/rh46630-qa-indexer-smoke.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (!health.poolIndexerEnvEnabled) {
              console.error("Robinhood /health says poolIndexerEnabled=false. Set ENABLE_ROBINHOOD_V3_POOL_INDEXER=1 on QA indexer and restart.");
              process.exit(1);
            }
            if (!health.rpc46630Configured) {
              console.error("Robinhood /health says rpc46630Configured=false. Set ROBINHOOD_RPC_HTTP_46630 on QA indexer and restart.");
              process.exit(1);
            }
            if (!health.chain46630Enabled) {
              console.error("Robinhood /health omits chain 46630. Set EVM_INDEXER_CHAIN_IDS=56,46630 on QA indexer and restart.");
              process.exit(1);
            }
          '

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh46630-qa-indexer-smoke
          path: reports/rh46630-qa-indexer-*.json
          if-no-files-found: warn
