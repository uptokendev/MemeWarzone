name: Agent 2 exact clean head final golden debug

on:
  push:
    branches:
      - agent2/cert-solana-native-f18505e
    paths:
      - .github/workflows/agent2-clean-head-final-debug.yml

permissions:
  contents: read

env:
  TARGET_SHA: f18505e39186a5fa73fd89f00b242b94782f2f2c
  OPERATOR_PUBKEY: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Read-only disposable ALT scan
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {Connection,PublicKey}=require('./tests/solana/node_modules/@solana/web3.js');
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          const operator=new PublicKey(process.env.OPERATOR_PUBKEY);
          const alts=[
            ['FINAL_GOLDEN_TEMP','EdNwQtwKnVHPBe7rSBuUnGxD9StmWcUDK2AHNbDauMoL'],
            ['NATIVE_FIXTURE_TEMP','2B3CnpQeBqvxep6jLyVkwJGGeaviiYw7EkqnXtALrVgH'],
          ];
          (async()=>{
            const genesis=await c.getGenesisHash();if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG')throw new Error(`wrong cluster ${genesis}`);
            console.log('EXACT_TARGET',process.env.TARGET_SHA);
            console.log('OPERATOR_BALANCE',await c.getBalance(operator,'confirmed'));
            console.log('CURRENT_SLOT',await c.getSlot('confirmed'));
            for(const [label,s] of alts){
              const key=new PublicKey(s); const info=await c.getAccountInfo(key,'confirmed'); const table=(await c.getAddressLookupTable(key)).value;
              console.log('ALT',label,s,'LAMPORTS',info?.lamports??0,'BYTES',info?.data?.length??0,'OWNER',info?.owner?.toBase58?.()??'missing','AUTHORITY',table?.state?.authority?.toBase58?.()??'none','DEACTIVATION_SLOT',table?String(table.state.deactivationSlot):'missing','LAST_EXTENDED_SLOT',table?String(table.state.lastExtendedSlot):'missing','ADDRESSES',table?.state?.addresses?.length??0);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
