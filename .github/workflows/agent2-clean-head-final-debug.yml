name: Agent 2 exact clean head final golden debug

on:
  push:
    branches:
      - agent2/cert-solana-native-f18505e
    paths:
      - .github/workflows/agent2-clean-head-final-debug.yml

permissions:
  contents: read

env:
  TARGET_SHA: f18505e39186a5fa73fd89f00b242b94782f2f2c
  OPERATOR_PUBKEY: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  TEMP_ALT: EdNwQtwKnVHPBe7rSBuUnGxD9StmWcUDK2AHNbDauMoL

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Materialize authorized operator
        shell: bash
        run: |
          set -euo pipefail
          operator_file="${RUNNER_TEMP}/operator.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs
          echo "SOLANA_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"
      - name: Deactivate, age out, and close prior certification ALT
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const {Connection,Keypair,PublicKey,Transaction,AddressLookupTableProgram}=require('./tests/solana/node_modules/@solana/web3.js');
          const operator=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_OPERATOR_KEYPAIR,'utf8'))));
          const altKey=new PublicKey(process.env.TEMP_ALT);
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          const send=async(ix,label)=>{
            const latest=await c.getLatestBlockhash('confirmed');
            const tx=new Transaction({feePayer:operator.publicKey,recentBlockhash:latest.blockhash}).add(ix);tx.sign(operator);
            const sig=await c.sendRawTransaction(tx.serialize(),{skipPreflight:false,maxRetries:3});
            const conf=await c.confirmTransaction({signature:sig,...latest},'confirmed');
            if(conf.value.err) throw new Error(`${label} failed ${JSON.stringify(conf.value.err)}`);
            console.log(label+'_TX',sig);return sig;
          };
          (async()=>{
            const genesis=await c.getGenesisHash();
            if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error(`wrong cluster ${genesis}`);
            if(operator.publicKey.toBase58()!==process.env.OPERATOR_PUBKEY) throw new Error(`wrong operator ${operator.publicKey.toBase58()}`);
            console.log('EXACT_TARGET',process.env.TARGET_SHA);
            const before=await c.getBalance(operator.publicKey,'confirmed'); console.log('OPERATOR_BEFORE',before);
            const info=await c.getAccountInfo(altKey,'confirmed');
            const table=(await c.getAddressLookupTable(altKey)).value;
            if(!info&&!table){console.log('TEMP_ALT_ALREADY_CLOSED');console.log('OPERATOR_AFTER',before);return;}
            if(!info||!table) throw new Error('temporary ALT malformed');
            if(info.lamports!==3373440) throw new Error(`unexpected temp ALT rent ${info.lamports}`);
            if(table.state.addresses.length!==20) throw new Error(`unexpected temp ALT address count ${table.state.addresses.length}`);
            if(!table.state.authority?.equals(operator.publicKey)) throw new Error(`temporary ALT authority mismatch ${table.state.authority?.toBase58()}`);
            console.log('TEMP_ALT_VERIFIED',altKey.toBase58(),'LAMPORTS',info.lamports,'ADDRESSES',table.state.addresses.length,'AUTHORITY',table.state.authority.toBase58());
            const MAX=BigInt('18446744073709551615');
            let deactivation=BigInt(table.state.deactivationSlot.toString());
            if(deactivation===MAX){
              await send(AddressLookupTableProgram.deactivateLookupTable({lookupTable:altKey,authority:operator.publicKey}),'ALT_DEACTIVATE');
              const refreshed=(await c.getAddressLookupTable(altKey)).value;
              if(!refreshed) throw new Error('ALT vanished after deactivate');
              deactivation=BigInt(refreshed.state.deactivationSlot.toString());
              if(deactivation===MAX) throw new Error('ALT did not deactivate');
            }
            console.log('ALT_DEACTIVATION_SLOT',deactivation.toString());
            for(let i=0;i<180;i++){
              const slot=BigInt(await c.getSlot('confirmed'));
              const age=slot-deactivation;
              if(i%10===0) console.log('ALT_COOLDOWN_SLOT',slot.toString(),'AGE',age.toString());
              if(age>=520n) break;
              await new Promise(r=>setTimeout(r,2500));
            }
            const current=BigInt(await c.getSlot('confirmed'));
            if(current-deactivation<520n) throw new Error(`ALT cooldown not complete age=${current-deactivation}`);
            await send(AddressLookupTableProgram.closeLookupTable({lookupTable:altKey,authority:operator.publicKey,recipient:operator.publicKey}),'ALT_CLOSE');
            const afterInfo=await c.getAccountInfo(altKey,'confirmed');
            if(afterInfo) throw new Error('temporary ALT still exists after close');
            const after=await c.getBalance(operator.publicKey,'confirmed'); console.log('OPERATOR_AFTER',after); console.log('RECLAIMED_NET',after-before);
            if(after<=before) throw new Error('ALT rent was not reclaimed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
