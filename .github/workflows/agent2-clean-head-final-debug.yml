name: Agent 2 exact clean head final golden debug

on:
  push:
    branches:
      - agent2/cert-solana-native-f18505e
    paths:
      - .github/workflows/agent2-clean-head-final-debug.yml

permissions:
  contents: read

env:
  TARGET_SHA: f18505e39186a5fa73fd89f00b242b94782f2f2c
  OPERATOR_PUBKEY: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Read-only route signer and operator balance scan
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY:-}"
          node - <<'NODE'
          const {Connection,Keypair,PublicKey}=require('./tests/solana/node_modules/@solana/web3.js');
          const raw=JSON.parse(process.env.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY);
          if(!Array.isArray(raw)||raw.length!==64) throw new Error('route signer secret shape invalid');
          const route=Keypair.fromSecretKey(Uint8Array.from(raw));
          const operator=new PublicKey(process.env.OPERATOR_PUBKEY);
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          (async()=>{
            const genesis=await c.getGenesisHash();
            if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error(`wrong cluster ${genesis}`);
            console.log('EXACT_TARGET',process.env.TARGET_SHA);
            console.log('ROUTE_SIGNER',route.publicKey.toBase58());
            console.log('ROUTE_SIGNER_BALANCE',await c.getBalance(route.publicKey,'confirmed'));
            console.log('OPERATOR',operator.toBase58());
            console.log('OPERATOR_BALANCE',await c.getBalance(operator,'confirmed'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
