name: Solana / BNB real-network canaries

on:
  pull_request:
    paths:
      - ".github/workflows/solana-network-canary.yml"
      - "package.json"
      - "scripts/solana/network-canary.mjs"
      - "scripts/solana/network-canary.sh"
      - "tests/solana/network-canary-101.cjs"
      - "tools/solana-meteora-graduation/certify-postgrad-101.mjs"
      - "scripts/run-bsc97-live-claims-acceptance.mjs"
  workflow_dispatch:
    inputs:
      network:
        description: Network/mode
        required: true
        type: choice
        options:
          - solana-devnet
          - bsc-testnet-preflight
          - bsc-testnet-stage-deploy
          - bsc-testnet-full-cycle
          - bsc-testnet-real-topaz-full-cycle
          - bsc-testnet-real-topaz-diagnose
          - bsc-testnet-live-claims
          - bsc-mainnet-fork-source-head
      send_solana_graduation:
        description: Send canonical chain-101 Solana destructive certification
        required: false
        default: false
        type: boolean
      solana_campaign:
        description: Historical compatibility input only; canonical 101 destructive certification creates its own campaign
        required: false
        default: ""
        type: string
      bsc_real_topaz_factory:
        description: Existing failed-run Gen-4 factory for read-only real Topaz diagnosis
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  solana-transport-source-gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify canonical 101 transport source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/solana/network-canary.mjs
          node --check tests/solana/network-canary-101.cjs
          node --check tools/solana-meteora-graduation/certify-postgrad-101.mjs
          node --check scripts/run-bsc97-live-claims-acceptance.mjs
          bash -n scripts/solana/network-canary.sh
          node -e 'const p=require("./package.json"); if(p.scripts?.["solana:network-canary"]!=="bash scripts/solana/network-canary.sh") process.exit(1)'
          grep -Fq 'SOLANA_APPLICATION_CHAIN_ID="${SOLANA_APPLICATION_CHAIN_ID:-101}"' scripts/solana/network-canary.sh
          grep -Fq 'a2100000-0000-4000-8000-000000000201' scripts/solana/network-canary.sh
          grep -Fq 'native:102' scripts/solana/network-canary.mjs
          test -z "$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- tools/solana-meteora-graduation/graduate-basic-quote.mjs programs/memewarzone_solana)"
          if git diff "${{ github.event.pull_request.base.sha }}"...HEAD -- scripts/solana/network-canary.mjs scripts/solana/network-canary.sh tests/solana/network-canary-101.cjs tools/solana-meteora-graduation/certify-postgrad-101.mjs | grep -E '^\+.*(SOLANA_[A-Z_]*CHAIN_ID|chainId).*(102|"102")'; then
            echo "BLOCKER: active certification source introduced legacy chain 102"
            exit 1
          fi

  solana-canary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.network == 'solana-devnet' }}
    runs-on: ubuntu-latest
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Solana certification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --prefix tests/solana --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix tools/solana-meteora-graduation --no-audit --no-fund

      - name: Build exact-source Solana candidate and IDL
        shell: bash
        env:
          SOLANA_VERSION: "1.18.26"
          ANCHOR_VERSION: "0.30.1"
          RUST_TOOLCHAIN: "1.79.0"
          IDL_RUST_TOOLCHAIN: "nightly-2024-05-09"
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
          anchor build --program-name memewarzone_solana --no-idl
          test -s target/deploy/memewarzone_solana.so
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/idl/memewarzone_solana.json
          sha256sum target/deploy/memewarzone_solana.so
          wc -c target/deploy/memewarzone_solana.so

      - name: Solana devnet canonical chain-101 canary
        env:
          SEND_SOLANA_GRADUATION: ${{ inputs.send_solana_graduation }}
          SOLANA_APPLICATION_CHAIN_ID: "101"
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || secrets.SOLANA_DEVNET_RPC_URL || vars.SOLANA_DEVNET_RPC }}
          SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER || secrets.SOLANA_DEVNET_PRIVATE_KEY }}
          SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
          SOLANA_UPGRADE_AUTHORITY_PUBLIC_KEY: ${{ vars.SOLANA_DEVNET_UPGRADE_AUTHORITY_PUBLIC_KEY || secrets.SOLANA_DEVNET_UPGRADE_AUTHORITY_PUBLIC_KEY }}
          SOLANA_EXPECTED_PROGRAMDATA_ADDRESS: ${{ vars.SOLANA_DEVNET_PROGRAMDATA_ADDRESS }}
          SOLANA_EXPECTED_DEPLOYMENT_SLOT: ${{ vars.SOLANA_DEVNET_DEPLOYMENT_SLOT }}
          SOLANA_LAUNCHPAD_PROGRAM_ID: "3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt"
          SOLANA_EXPECTED_DEVNET_GENESIS: "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
          SOLANA_LAUNCHPAD_PROGRAM_SHA256: "27ad65b560dba8a33330bd95f08ae7ca6945f71ebf667a5a3756ae0cb9f7f080"
          SOLANA_LAUNCHPAD_PROGRAM_BYTES: "1165328"
          SOLANA_LAUNCHPAD_PROGRAM_PATH: target/deploy/memewarzone_solana.so
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          PG_DISABLE_SSL: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm run solana:network-canary

      - name: Upload Solana 101 certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solana-101-network-canary-${{ github.sha }}
          path: |
            /tmp/mwz-solana-devnet-deployment-identity.json
            /tmp/mwz-solana-101-canary.json
            /tmp/mwz-solana-101-graduation.log
            /tmp/mwz-solana-101-graduation-result.json
            /tmp/mwz-solana-101-postgrad.json
            /tmp/mwz-solana-101-auth.log
            /tmp/mwz-solana-101-auth-health.json
            /tmp/mwz-solana-101-pause-snapshot.json
          if-no-files-found: warn
          retention-days: 14

  bsc-live-claims:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.network == 'bsc-testnet-live-claims' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memewarzone_claim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memewarzone_claim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_TESTNET_RPC: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memewarzone_claim_test
      PG_DISABLE_SSL: "1"
      API_AUTH_ENFORCE_USER_WRITES: "1"
      REWARD_CLAIM_MIN_CONFIRMATIONS_97: "1"
      LEAGUE_ADMIN_TOKEN: agent5-live-test
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve BSC97 claims acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix frontend --no-audit --no-fund

      - name: Execute real BSC97 claims acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bsc97-live-claims-acceptance.mjs

      - name: Upload BSC97 claims evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent5-bsc97-live-claims-${{ github.sha }}
          path: reports/agent5-bsc97-*
          if-no-files-found: warn
          retention-days: 30

  canary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.network != 'solana-devnet' && inputs.network != 'bsc-testnet-live-claims' }}
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      DEPLOYER_PK: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_TESTNET_RPC: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve accepted BSC factory for bytecode preflight
        if: ${{ inputs.network == 'bsc-testnet-preflight' }}
        id: factory
        shell: bash
        run: node scripts/resolve-bsc-certification-factory.mjs --github-output

      - name: Resolve accepted BSC factory for Gen-4 stage preflight
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        id: stage_factory
        shell: bash
        run: node scripts/resolve-bsc-certification-factory.mjs --github-output

      - name: Run BSC Testnet Topaz preflight (accepted 3/2 only)
        if: ${{ inputs.network == 'bsc-testnet-preflight' }}
        env:
          DEPLOYMENT_FILE: ${{ steps.factory.outputs.deployment_file }}
          TOPAZ_MANIFEST: ${{ steps.factory.outputs.topaz_manifest }}
          FACTORY_ADDRESS: ${{ steps.factory.outputs.factory }}
          LAUNCH_FACTORY: ${{ steps.factory.outputs.factory }}
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FACTORY_ADDRESS:-}"
          test -n "${BSC_TESTNET_RPC:-}" || {
            echo "BLOCKER: set GitHub Environment variable BSC_TESTNET_RPC."
            exit 1
          }
          echo "certification_factory=$FACTORY_ADDRESS"
          echo "mode=preflight"
          npm ci
          npx hardhat run scripts/test-topaz-graduation-flow.ts --network bscTestnet

      - name: Run BSC97 Gen-4 read-only preflight then stage deploy only
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        env:
          DEPLOYMENT_FILE: ${{ steps.stage_factory.outputs.deployment_file }}
          TOPAZ_MANIFEST: ${{ steps.stage_factory.outputs.topaz_manifest }}
          FACTORY_ADDRESS: ${{ steps.stage_factory.outputs.factory }}
          LAUNCH_FACTORY: ${{ steps.stage_factory.outputs.factory }}
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ALLOW_SOURCE_HEAD_BROADCAST: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-bnb-gen4-stage-dispatch.mjs
          npx hardhat run scripts/test-topaz-graduation-flow.ts --network bscTestnet
          npx hardhat run scripts/deploy-bnb-real-topaz-testnet-stage.ts --network bscTestnet
          test -s reports/bnb-real-topaz-testnet-stage.json

      - name: Upload BSC97 Gen-4 stage manifest
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-real-topaz-testnet-stage-${{ github.sha }}
          path: reports/bnb-real-topaz-testnet-stage.json
          if-no-files-found: error
          retention-days: 14

      - name: Run BNB 6C controlled-Topaz full lifecycle on chain 97
        if: ${{ inputs.network == 'bsc-testnet-full-cycle' }}
        env:
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY:-}" || {
            echo "BLOCKER: set GitHub Environment secret BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY."
            exit 1
          }
          echo "mode=6c-source-head-full-cycle"
          echo "safety=isolated 4/3 stack; live 3/2 factory must remain unchanged"
          npm ci
          npx hardhat run scripts/run-bnb-lifecycle-certification.ts --network bscTestnet
          test -s reports/bnb-6c-testnet-acceptance.json
          node -e 'const r=require("./reports/bnb-6c-testnet-acceptance.json"); if(r.chainId!==97||r.accepted!==true||r.factoryLiveAfter!==true||r.createPausedAfter!==true) process.exit(1); console.log({accepted:r.accepted,factory:r.factory,campaign:r.campaign,pool:r.pool,realTopazCompatibility:r.realTopazCompatibility});'

      - name: Upload BNB 6C controlled-Topaz chain-97 evidence
        if: ${{ inputs.network == 'bsc-testnet-full-cycle' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-6c-testnet-acceptance-${{ github.sha }}
          path: |
            deployments/bnb/testnet.staged.json
            reports/bnb-6c-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run BSC97 Gen-4 destructive lifecycle against authoritative real Topaz
        if: ${{ inputs.network == 'bsc-testnet-real-topaz-full-cycle' }}
        env:
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
          BNB_REAL_TOPAZ_EXECUTION_AUTHORIZED: "true"
          MEMEWARZONE_SOURCE_SHA: ${{ github.sha }}
          TOPAZ_MANIFEST: deployments/bscTestnet/minimal-topaz.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY:-}" || {
            echo "BLOCKER: set GitHub Environment secret BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY."
            exit 1
          }
          echo "mode=real-topaz-source-head-full-cycle"
          echo "safety=chain97 only; authoritative Topaz; live 3/2 factory must remain unchanged"
          npm ci
          npx hardhat run scripts/run-bnb-real-topaz-certification.ts --network bscTestnet
          test -s reports/bnb-real-topaz-testnet-acceptance.json
          node -e 'const r=require("./reports/bnb-real-topaz-testnet-acceptance.json"); const ok=r.chainId===97&&r.accepted===true&&r.realTopazCompatibility===true&&r.controlledTopazDex===false&&r.permanentLpLock===true&&r.feeHarvest80_20===true&&r.lpPrincipalPreserved===true&&r.factoryLiveAfter===true&&r.createPausedAfter===true&&r.checks?.reloadVerified===true&&r.checks?.immediateHarvestRetryZero===true&&r.transactions?.postGradBuy&&r.transactions?.postGradSell; if(!ok) process.exit(1); console.log({accepted:r.accepted,realTopazCompatibility:r.realTopazCompatibility,factory:r.protocol?.launchFactory,campaign:r.protocol?.campaign,token:r.protocol?.token,pool:r.protocol?.graduatedPool,postGradBuy:r.transactions?.postGradBuy,postGradSell:r.transactions?.postGradSell,reloadVerified:r.checks?.reloadVerified,immediateHarvestRetryZero:r.checks?.immediateHarvestRetryZero});'

      - name: Upload BSC97 real Topaz destructive acceptance evidence
        if: ${{ inputs.network == 'bsc-testnet-real-topaz-full-cycle' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-real-topaz-testnet-acceptance-${{ github.sha }}
          path: |
            reports/bnb-real-topaz-testnet-stage.json
            reports/bnb-real-topaz-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnose existing BSC97 real Topaz harvest state read-only
        if: ${{ inputs.network == 'bsc-testnet-real-topaz-diagnose' }}
        env:
          BNB_REAL_TOPAZ_DIAGNOSTIC_FACTORY: ${{ inputs.bsc_real_topaz_factory }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BNB_REAL_TOPAZ_DIAGNOSTIC_FACTORY:-}" || {
            echo "BLOCKER: provide bsc_real_topaz_factory from the failed real-Topaz run."
            exit 1
          }
          echo "mode=real-topaz-read-only-diagnostic"
          echo "broadcast=NONE"
          npm ci
          npx hardhat run scripts/diagnose-bnb-real-topaz-harvest.ts --network bscTestnet

      - name: Run BNB 4/3 + V3 source head against real Topaz on a mainnet fork
        if: ${{ inputs.network == 'bsc-mainnet-fork-source-head' }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx hardhat run scripts/run-bnb-mainnet-fork-certification.ts --network hardhat
