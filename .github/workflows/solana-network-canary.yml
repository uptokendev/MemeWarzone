name: Solana / BNB real-network canaries

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network/mode
        required: true
        type: choice
        options:
          - solana-devnet
          - bsc-testnet-preflight
          - bsc-testnet-stage-deploy
          - bsc-testnet-full-cycle
          - bsc-testnet-real-topaz-full-cycle
          - bsc-mainnet-fork-source-head
      send_solana_graduation:
        description: Send Solana graduation transaction
        required: false
        default: false
        type: boolean
      solana_campaign:
        description: Existing Solana campaign address for graduation
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CI: true

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: testnet-certification
    env:
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      DEPLOYER_PK: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_TESTNET_RPC: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve Solana dependencies
        if: ${{ inputs.network == 'solana-devnet' }}
        shell: bash
        run: npm ci

      - name: Solana devnet canary
        if: ${{ inputs.network == 'solana-devnet' }}
        env:
          SEND_SOLANA_GRADUATION: ${{ inputs.send_solana_graduation }}
          SOLANA_CAMPAIGN: ${{ inputs.solana_campaign }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC_URL }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_DEVNET_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npm run solana:network-canary

      - name: Resolve accepted BSC factory for bytecode preflight
        if: ${{ inputs.network == 'bsc-testnet-preflight' }}
        id: factory
        shell: bash
        run: node scripts/resolve-bsc-certification-factory.mjs --github-output

      - name: Resolve accepted BSC factory for Gen-4 stage preflight
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        id: stage_factory
        shell: bash
        run: node scripts/resolve-bsc-certification-factory.mjs --github-output

      - name: Run BSC Testnet Topaz preflight (accepted 3/2 only)
        if: ${{ inputs.network == 'bsc-testnet-preflight' }}
        env:
          DEPLOYMENT_FILE: ${{ steps.factory.outputs.deployment_file }}
          TOPAZ_MANIFEST: ${{ steps.factory.outputs.topaz_manifest }}
          FACTORY_ADDRESS: ${{ steps.factory.outputs.factory }}
          LAUNCH_FACTORY: ${{ steps.factory.outputs.factory }}
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FACTORY_ADDRESS:-}"
          test -n "${BSC_TESTNET_RPC:-}" || {
            echo "BLOCKER: set GitHub Environment variable BSC_TESTNET_RPC."
            exit 1
          }
          echo "certification_factory=$FACTORY_ADDRESS"
          echo "mode=preflight"
          npm ci
          npx hardhat run scripts/test-topaz-graduation-flow.ts --network bscTestnet

      - name: Run BSC97 Gen-4 read-only preflight then stage deploy only
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        env:
          DEPLOYMENT_FILE: ${{ steps.stage_factory.outputs.deployment_file }}
          TOPAZ_MANIFEST: ${{ steps.stage_factory.outputs.topaz_manifest }}
          FACTORY_ADDRESS: ${{ steps.stage_factory.outputs.factory }}
          LAUNCH_FACTORY: ${{ steps.stage_factory.outputs.factory }}
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ALLOW_SOURCE_HEAD_BROADCAST: "true"
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-bnb-gen4-stage-dispatch.mjs
          npx hardhat run scripts/test-topaz-graduation-flow.ts --network bscTestnet
          npx hardhat run scripts/deploy-bnb-real-topaz-testnet-stage.ts --network bscTestnet
          test -s reports/bnb-real-topaz-testnet-stage.json

      - name: Upload BSC97 Gen-4 stage manifest
        if: ${{ inputs.network == 'bsc-testnet-stage-deploy' }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-real-topaz-testnet-stage-${{ github.sha }}
          path: reports/bnb-real-topaz-testnet-stage.json
          if-no-files-found: error
          retention-days: 14

      - name: Run BNB 6C controlled-Topaz full lifecycle on chain 97
        if: ${{ inputs.network == 'bsc-testnet-full-cycle' }}
        env:
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY:-}" || {
            echo "BLOCKER: set GitHub Environment secret BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY."
            exit 1
          }
          echo "mode=6c-source-head-full-cycle"
          echo "safety=isolated 4/3 stack; live 3/2 factory must remain unchanged"
          npm ci
          npx hardhat run scripts/run-bnb-lifecycle-certification.ts --network bscTestnet
          test -s reports/bnb-6c-testnet-acceptance.json
          node -e 'const r=require("./reports/bnb-6c-testnet-acceptance.json"); if(r.chainId!==97||r.accepted!==true||r.factoryLiveAfter!==true||r.createPausedAfter!==true) process.exit(1); console.log({accepted:r.accepted,factory:r.factory,campaign:r.campaign,pool:r.pool,realTopazCompatibility:r.realTopazCompatibility});'

      - name: Upload BNB 6C controlled-Topaz chain-97 evidence
        if: ${{ inputs.network == 'bsc-testnet-full-cycle' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-6c-testnet-acceptance-${{ github.sha }}
          path: |
            deployments/bnb/testnet.staged.json
            reports/bnb-6c-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run BSC97 Gen-4 destructive lifecycle against authoritative real Topaz
        if: ${{ inputs.network == 'bsc-testnet-real-topaz-full-cycle' }}
        env:
          BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
          BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
          BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
          BNB_REAL_TOPAZ_EXECUTION_AUTHORIZED: "true"
          MEMEWARZONE_SOURCE_SHA: ${{ github.sha }}
          TOPAZ_MANIFEST: deployments/bscTestnet/minimal-topaz.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY:-}" || {
            echo "BLOCKER: set GitHub Environment secret BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY."
            exit 1
          }
          echo "mode=real-topaz-source-head-full-cycle"
          echo "safety=chain97 only; authoritative Topaz; live 3/2 factory must remain unchanged"
          npm ci
          npx hardhat run scripts/run-bnb-real-topaz-certification.ts --network bscTestnet
          test -s reports/bnb-real-topaz-testnet-acceptance.json
          node -e 'const r=require("./reports/bnb-real-topaz-testnet-acceptance.json"); const ok=r.chainId===97&&r.accepted===true&&r.realTopazCompatibility===true&&r.controlledTopazDex===false&&r.permanentLpLock===true&&r.feeHarvest80_20===true&&r.lpPrincipalPreserved===true&&r.factoryLiveAfter===true&&r.createPausedAfter===true&&r.checks?.reloadVerified===true&&r.checks?.immediateHarvestRetryZero===true&&r.transactions?.postGradBuy&&r.transactions?.postGradSell; if(!ok) process.exit(1); console.log({accepted:r.accepted,realTopazCompatibility:r.realTopazCompatibility,factory:r.protocol?.launchFactory,campaign:r.protocol?.campaign,token:r.protocol?.token,pool:r.protocol?.graduatedPool,postGradBuy:r.transactions?.postGradBuy,postGradSell:r.transactions?.postGradSell,reloadVerified:r.checks?.reloadVerified,immediateHarvestRetryZero:r.checks?.immediateHarvestRetryZero});'

      - name: Upload BSC97 real Topaz destructive acceptance evidence
        if: ${{ inputs.network == 'bsc-testnet-real-topaz-full-cycle' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bnb-real-topaz-testnet-acceptance-${{ github.sha }}
          path: |
            reports/bnb-real-topaz-testnet-stage.json
            reports/bnb-real-topaz-testnet-acceptance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run BNB 4/3 + V3 source head against real Topaz on a mainnet fork
        if: ${{ inputs.network == 'bsc-mainnet-fork-source-head' }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx hardhat run scripts/run-bnb-mainnet-fork-certification.ts --network hardhat
