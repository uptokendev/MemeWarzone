name: frontend pull request proof

on:
  pull_request:
    branches:
      - main
      - devpostgrad
    paths:
      - frontend/**
      - .github/workflows/frontend-pr-proof.yml
  push:
    branches:
      - "hotfix/solana-*"
    paths:
      - frontend/**
      - .github/workflows/frontend-pr-proof.yml

permissions:
  contents: read

concurrency:
  group: frontend-pr-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend imports, production build, and Gate S isolation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend --package-lock=false --no-audit --no-fund

      - name: Check lifecycle API module syntax
        run: |
          node --check frontend/api/campaigns.js
          node --check frontend/api/campaigns-base.js
          node --check frontend/api/featured.js
          node --check frontend/api/dev-fix/drafts.js
          node --check frontend/api/dev-fix/drafts-base.js
          node --check frontend/api/dev-fix/draft-read.js
          node --check frontend/api/dev-fix/draft-read-base.js
          node --check frontend/api/dev-fix/draft-deploy.js
          node --check frontend/api/dev-fix/draft-deploy-base.js
          node --check frontend/api/dev-fix/json-transform.js
          node --check frontend/api/dev-fix/scheduled-lifecycle.js

      - name: Test scheduled lifecycle timestamp transitions
        run: node --test frontend/api/dev-fix/scheduled-lifecycle.test.mjs

      - name: Check API imports
        run: npm --prefix frontend run check:api-imports

      - name: Test wallet provider discovery
        run: npm --prefix frontend run test:wallet-discovery

      - name: Test feed and Token Details chain isolation
        run: npm --prefix frontend run test:feed-isolation

      - name: Build public application
        env:
          VITE_ENABLE_WAR_ROOM: "true"
          VITE_ENABLE_UNIFIED_MARKET_CHART: "1"
          VITE_ENABLE_TESTNET_CAMPAIGNS: "true"
          VITE_ENABLE_TESTNET_FEATURED_FEED: "true"
          VITE_DEFAULT_CHAIN_ID: "97"
          VITE_PUBLIC_RPC_56: "https://rpc-evm-56.test.mwz"
          VITE_PUBLIC_RPC_97: "https://rpc-evm-97.test.mwz"
          VITE_BSC_RPC_56: "https://rpc-evm-56.test.mwz"
          VITE_BSC_RPC_97: "https://rpc-evm-97.test.mwz"
          VITE_BSC_MAINNET_RPC: "https://rpc-evm-56.test.mwz"
          VITE_BSC_TESTNET_RPC: "https://rpc-evm-97.test.mwz"
          VITE_SOLANA_RPC: "https://rpc-solana-101.test.mwz"
          VITE_SOLANA_MAINNET_RPC: "https://rpc-solana-101.test.mwz"
          VITE_PUBLIC_RPC_SOLANA: "https://rpc-solana-101.test.mwz"
          VITE_PUBLIC_RPC_101: "https://rpc-solana-101.test.mwz"
        run: npm --prefix frontend run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Gate S Playwright cross-chain isolation
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_WEBSERVER_BUILD: "1"
        run: npm --prefix frontend run test:e2e:isolation
