name: Agent 6 All Claims Bootstrap

on:
  push:
    branches: [agent6/all-launch-claims-three-chain]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent6/all-launch-claims-three-chain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply claim recovery patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "frontend/api/dev-fix/reward-claim-intent.js"
          old = '''function envDistributorAddress(chainId) {
            const chain = Number(chainId);
            const candidates = [
              process.env[`REWARD_DISTRIBUTOR_ADDRESS_${chain}`],
              process.env[`VITE_REWARD_DISTRIBUTOR_ADDRESS_${chain}`],
              chain === 97 ? process.env.BNB_TESTNET_REWARD_DISTRIBUTOR_ADDRESS : null,
              chain === 56 ? process.env.BNB_REWARD_DISTRIBUTOR_ADDRESS : null,
              chain === 56 ? process.env.REWARD_DISTRIBUTOR_ADDRESS_BNB : null,
              process.env.REWARD_DISTRIBUTOR_ADDRESS,
              process.env.VITE_REWARD_DISTRIBUTOR_ADDRESS,
            ];
            return cleanAddress(candidates.find(Boolean));
          }'''
          new = '''function envDistributorAddress(chainId) {
            const chain = Number(chainId);
            const perChain = [
              process.env[`REWARD_DISTRIBUTOR_ADDRESS_${chain}`],
              process.env[`VITE_REWARD_DISTRIBUTOR_ADDRESS_${chain}`],
            ];
            // Robinhood must never inherit an unscoped BNB/global distributor.
            // Its reward rail is enabled only by explicit chain-local authority.
            if (ROBINHOOD_CHAINS.has(chain)) return cleanAddress(perChain.find(Boolean));
            const candidates = [
              ...perChain,
              chain === 97 ? process.env.BNB_TESTNET_REWARD_DISTRIBUTOR_ADDRESS : null,
              chain === 56 ? process.env.BNB_REWARD_DISTRIBUTOR_ADDRESS : null,
              chain === 56 ? process.env.REWARD_DISTRIBUTOR_ADDRESS_BNB : null,
              process.env.REWARD_DISTRIBUTOR_ADDRESS,
              process.env.VITE_REWARD_DISTRIBUTOR_ADDRESS,
            ];
            return cleanAddress(candidates.find(Boolean));
          }'''
          replace_once(path, old, new)
          replace_once(path, 'supportedRewardTypes: ["airdrop"],', 'supportedRewardTypes: ["airdrop", "squad"],')

          path = "frontend/src/lib/rewardProgramsApi.ts"
          old = '''export async function reconcileSolanaRewardClaims(params: {
            walletAddress: string;
            chainId: number;
            rewardLedgerIds: string[];
          }): Promise<SolanaRewardReconciliationResult> {
            const res = await fetch(buildRealtimeApiUrl("/api/rewards"), {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                action: "reconcile-solana-claims",
                walletAddress: params.walletAddress,
                chainId: params.chainId,
                rewardLedgerIds: params.rewardLedgerIds,
              }),
            });
            return parseJson(res) as Promise<SolanaRewardReconciliationResult>;
          }

          export async function fetchRewardClaims(params: {
            walletAddress: string;
            chainId?: number | null;
            rewardType?: string | null;
            limit?: number;
          }): Promise<RewardLedgerItem[]> {
            const initial = await fetchRewardClaimsRaw(params);
            const chainId = Number(params.chainId || 0);
            if (![101, 102].includes(chainId)) return initial;

            const stale = initial.filter((item) =>
              (item.status === "claim_pending" || item.status === "failed") &&
              (item.rewardType === "airdrop" || item.rewardType === "squad")
            );
            if (!stale.length) return initial;

            try {
              const reconciliation = await reconcileSolanaRewardClaims({
                walletAddress: params.walletAddress,
                chainId,
                rewardLedgerIds: stale.slice(0, 10).map((item) => item.id),
              });

              if (reconciliation.reconciledCount > 0) {
                return fetchRewardClaimsRaw(params);
              }

              const blocked = new Set(
                reconciliation.unresolved
                  .filter((item) => item.code !== "SOLANA_CLAIM_RECEIPT_MISSING")
                  .map((item) => item.rewardLedgerId),
              );
              if (blocked.size) {
                return initial.map((item) => blocked.has(item.id)
