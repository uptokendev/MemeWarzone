          insert_before = 'async function reconcileSolanaClaims(req, res) {'
          evm_block = r'''
async function finalizeRecoveredEvmClaim(row, verification) {
  const client = await pool.connect();
  try {
    await client.query("begin");
    const { rows } = await client.query(
      `select * from public.reward_ledger where id = $1::uuid for update`,
      [row.id],
    );
    const current = rows[0];
    if (!current) {
      await client.query("rollback");
      return { rewardLedgerId: String(row.id), status: "missing" };
    }
    if (
      String(current.wallet_address || "").toLowerCase() !== String(row.wallet_address || "").toLowerCase() ||
      rewardRowChainId(current) !== rewardRowChainId(row)
    ) {
      const error = new Error("Reward entitlement changed during EVM reconciliation");
      error.code = "REWARD_RECONCILE_ROW_CHANGED";
      throw error;
    }
    if (current.status === "claimed") {
      await client.query("commit");
      return { rewardLedgerId: String(current.id), status: "already_claimed", txHash: current.claim_tx_hash || verification.txHash };
    }
    if (!RECOVERABLE_STATUSES.has(String(current.status || ""))) {
      await client.query("commit");
      return { rewardLedgerId: String(current.id), status: "not_recoverable" };
    }

    const reused = await client.query(
      `select id from public.reward_ledger
        where lower(coalesce(claim_tx_hash, '')) = lower($1) and id <> $2::uuid limit 1`,
      [verification.txHash, current.id],
    );
    if (reused.rows.length) {
      const error = new Error("Confirmed EVM claim transaction is already attached to another reward entitlement");
      error.code = "EVM_CLAIM_TX_REUSED";
      throw error;
    }

    const reconciledAt = new Date().toISOString();
    const claimVerification = { ...verification, reconciliationSource: "reward_claimed_event", reconciledAt };
    await client.query(
      `update public.reward_ledger
          set status='claimed', claim_tx_hash=$2, claim_error=null,
              claimed_at=coalesce(claimed_at, now()),
              metadata=coalesce(metadata, '{}'::jsonb) || jsonb_build_object('claimVerification',$3::jsonb,'claimReconciledAt',$4::text),
              updated_at=now()
        where id=$1::uuid`,
      [current.id, verification.txHash, JSON.stringify(claimVerification), reconciledAt],
    );
    await client.query(`update public.reward_batch_items set status='claimed' where reward_ledger_id=$1::uuid`, [current.id]);
    await client.query(
      `insert into public.reward_audit_logs
        (reward_ledger_id, actor_type, actor_id, action, old_value, new_value, reason, tx_hash, metadata)
       values ($1::uuid,'system','evm-reconciler','claim_reconciled_onchain',$2,'claimed',
         'Recovered confirmed EVM RewardDistributor claim from exact on-chain event',$3,$4::jsonb)`,
      [current.id, current.status, verification.txHash, JSON.stringify(claimVerification)],
    );
    await refreshBatchCounts(client, current.id);
    await client.query("commit");
    return { rewardLedgerId: String(current.id), status: "reconciled", txHash: verification.txHash, blockNumber: verification.blockNumber ?? null };
  } catch (error) {
    try { await client.query("rollback"); } catch {}
    throw error;
  } finally {
    client.release();
  }
}

async function reconcileEvmClaims(req, res) {
  if (!pool) return json(res, 500, { error: "Server misconfigured: DATABASE_URL missing" });
  const body = await readJson(req);
  if (String(body?.action || "") !== "reconcile-evm-claims") return json(res, 400, { error: "Unsupported rewards action" });
  const chainId = Number(body?.chainId);
  const walletAddress = String(normalizeWalletFlexible(body?.walletAddress || body?.address) || "").trim().toLowerCase();
  const rawIds = Array.isArray(body?.rewardLedgerIds) ? body.rewardLedgerIds : [];
  const rewardLedgerIds = Array.from(new Set(rawIds.map((id) => String(id || "").trim()).filter(Boolean)));

  if (!EVM_CHAINS.has(chainId)) return json(res, 400, { error: "Reconciliation is only available for BNB/Robinhood EVM reward chains" });
  if (!walletAddress || !isAddress(walletAddress)) return json(res, 400, { error: "Invalid EVM reward wallet address" });
  if (!rewardLedgerIds.length) return json(res, 200, { walletAddress, chainId, requestedCount: 0, checkedCount: 0, reconciledCount: 0, items: [], unresolved: [] });
  if (rewardLedgerIds.length > 10) return json(res, 400, { error: "At most 10 reward claims can be reconciled per request" });
  if (rewardLedgerIds.some((id) => !UUID_RE.test(id))) return json(res, 400, { error: "Invalid reward ledger id" });

  try {
    const { rows } = await pool.query(
      `select * from public.reward_ledger
        where id = any($1::uuid[])
          and lower(wallet_address)=lower($2)
          and chain::text=$3::text
          and status = any($4::text[])
        order by created_at asc`,
      [rewardLedgerIds, walletAddress, String(chainId), Array.from(RECOVERABLE_STATUSES)],
    );
    const items = [];
    const unresolved = [];
    for (const row of rows) {
      try {
        const target = evmRewardRecoveryTarget(row);
        if (!target) {
          unresolved.push({ rewardLedgerId: String(row.id), reason: "claim_target_missing", code: "EVM_CLAIM_TARGET_NOT_READY" });
          continue;
        }
        const verification = await discoverEvmRewardClaim({
          chainId: target.chainId,
          walletAddress,
          distributorAddress: target.distributorAddress,
          batchId: target.batchId,
          amount: target.amount,
          minConfirmations: rewardClaimMinConfirmations(target.chainId),
        });
        if (!verification) {
          unresolved.push({ rewardLedgerId: String(row.id), reason: "not_claimed_onchain", code: "EVM_CLAIM_NOT_CLAIMED_ONCHAIN" });
          continue;
        }
        items.push(await finalizeRecoveredEvmClaim(row, verification));
      } catch (error) {
        console.warn(`[api/rewards] EVM reconciliation deferred for ${row.id}:`, error?.code || error?.message || error);
        unresolved.push({ rewardLedgerId: String(row.id), reason: "verification_pending", code: error?.code || "EVM_CLAIM_RECONCILE_PENDING" });
      }
    }
    return json(res, 200, {
      walletAddress, chainId, requestedCount: rewardLedgerIds.length, checkedCount: rows.length,
      reconciledCount: items.filter((item) => item.status === "reconciled").length,
      items, unresolved, reconciledAt: new Date().toISOString(),
    });
  } catch (error) {
    console.error("[api/rewards:evm-reconcile]", error);
    if (error?.code === "42P01" || error?.code === "42703") return json(res, 503, { error: "Reward reconciliation schema is not installed", code: "REWARD_SCHEMA_MISSING" });
    return json(res, 500, { error: "Server error", code: error?.code || "EVM_REWARD_RECONCILE_FAILED" });
  }
}

'''
