                    .filter((item) => item.code !== "SOLANA_CLAIM_RECEIPT_MISSING")
                    .map((item) => item.rewardLedgerId),
                );
                if (blocked.size) {
                  return initial.map((item) => blocked.has(item.id)
                    ? { ...item, status: "claim_pending", claimError: "On-chain reconciliation is pending." }
                    : item);
                }
              } catch (error) {
                console.warn("[rewardProgramsApi] Solana claim reconciliation deferred:", error);
              }
              return initial;
            }

            if ([56, 97, 4663, 46630].includes(chainId)) {
              if (!staleBase.length) return initial;
              try {
                const reconciliation = await reconcileEvmRewardClaims({
                  walletAddress: params.walletAddress,
                  chainId,
                  rewardLedgerIds: staleBase.slice(0, 10).map((item) => item.id),
                });
                if (reconciliation.reconciledCount > 0) return fetchRewardClaimsRaw(params);
              } catch (error) {
                console.warn("[rewardProgramsApi] EVM claim reconciliation deferred:", error);
              }
            }

            return initial;
          }'''
          replace_once(path, old, new)

          path = "frontend/api/rewards.js"
          text = Path(path).read_text()
          old = 'import { discoverSolanaRewardClaim } from "./lib/solanaRewardReconciliation.js";\n\nconst SOLANA_CHAINS = new Set([101, 102]);'
          new = 'import { discoverEvmRewardClaim } from "./lib/rewardClaimVerification.js";\nimport { discoverSolanaRewardClaim } from "./lib/solanaRewardReconciliation.js";\n\nconst EVM_CHAINS = new Set([56, 97, 4663, 46630]);\nconst SOLANA_CHAINS = new Set([101, 102]);'
          if old not in text: raise SystemExit("rewards.js import pattern missing")
          text = text.replace(old, new, 1)

          marker = 'const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n'
          helpers = r'''
const BYTES32_RE = /^0x[a-fA-F0-9]{64}$/;
const ADDRESS_RE = /^0x[a-fA-F0-9]{40}$/;

function rewardMeta(row) {
  const raw = row?.metadata;
  if (!raw) return {};
  if (typeof raw === "object") return raw;
  try { return JSON.parse(String(raw)) || {}; } catch { return {}; }
}

function firstString(source, keys) {
  for (const key of keys) {
    const value = source?.[key];
    if (value == null) continue;
    const text = String(value).trim();
    if (text) return text;
  }
  return "";
}

function rewardRowChainId(row) {
  const meta = rewardMeta(row);
  const raw = String(row?.chain ?? "").trim().toLowerCase();
  if (raw === "solana" || raw === "sol") return Number(meta.chainId) || 101;
  if (raw === "robinhood" || raw === "rh") return Number(meta.chainId) || 4663;
  const numeric = Number(row?.chain);
  if (Number.isFinite(numeric) && numeric > 0) return numeric;
  const metadataChain = Number(meta.chainId);
  return Number.isFinite(metadataChain) && metadataChain > 0 ? metadataChain : 56;
}

function rewardDistributorAddress(chainId, meta) {
  const chain = Number(chainId);
  const explicit = firstString(meta, ["distributorAddress", "rewardDistributorAddress", "claimContractAddress", "contractAddress"]);
  if (ADDRESS_RE.test(explicit)) return explicit;
  const perChain = String(
    process.env[`REWARD_DISTRIBUTOR_ADDRESS_${chain}`] ||
    process.env[`VITE_REWARD_DISTRIBUTOR_ADDRESS_${chain}`] ||
    "",
  ).trim();
  if (ADDRESS_RE.test(perChain)) return perChain;
  if (chain === 4663 || chain === 46630) return "";
  const fallback = String(
    (chain === 97 ? process.env.BNB_TESTNET_REWARD_DISTRIBUTOR_ADDRESS : "") ||
    (chain === 56 ? process.env.BNB_REWARD_DISTRIBUTOR_ADDRESS : "") ||
    (chain === 56 ? process.env.REWARD_DISTRIBUTOR_ADDRESS_BNB : "") ||
    process.env.REWARD_DISTRIBUTOR_ADDRESS ||
    process.env.VITE_REWARD_DISTRIBUTOR_ADDRESS ||
    "",
  ).trim();
  return ADDRESS_RE.test(fallback) ? fallback : "";
}

function evmRewardRecoveryTarget(row) {
  const chainId = rewardRowChainId(row);
  const meta = rewardMeta(row);
  const batchId = firstString(meta, ["contractBatchId", "merkleBatchId", "batchIdBytes32", "rewardBatchBytes32", "claimBatchBytes32"]);
  const distributorAddress = rewardDistributorAddress(chainId, meta);
  const amount = String(row?.amount ?? "0");
  if (!EVM_CHAINS.has(chainId) || !distributorAddress || !BYTES32_RE.test(batchId) || !/^\d+$/.test(amount) || BigInt(amount) <= 0n) {
    return null;
  }
  return { chainId, distributorAddress, batchId, amount };
}

function rewardClaimMinConfirmations(chainId) {
  const value = Number(process.env[`REWARD_CLAIM_MIN_CONFIRMATIONS_${Number(chainId)}`] || process.env.REWARD_CLAIM_MIN_CONFIRMATIONS || 1);
  return Number.isFinite(value) && value > 0 ? Math.floor(value) : 1;
}
'''
          if marker not in text: raise SystemExit("rewards.js helper marker missing")
