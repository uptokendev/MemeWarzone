name: Robinhood Stock Graduation Registry

on:
  pull_request:
    paths:
      - "database/robinhood_stock_graduation_registry.sql"
      - "frontend/api/admin/robinhoodStockGraduationRegistry.js"
      - "frontend/api/dev-fix/robinhoodStockCreatePolicy.js"
      - "frontend/api/graduation/quote-assets.js"
      - "frontend/api/lib/quoteAssetCatalog.js"
      - "frontend/api/lib/quoteAssetCatalog.test.mjs"
      - "frontend/api/lib/robinhoodStockGraduationRegistry.js"
      - "frontend/api/lib/robinhoodStockGraduationAdminOps.js"
      - "frontend/api/lib/robinhoodStockGraduationRegistry.test.mjs"
      - "frontend/api/robinhood/stock-tokens.js"
      - "frontend/api/server.mjs"
      - ".github/workflows/robinhood-stock-graduation-registry.yml"
  push:
    branches:
      - "feat/robinhood-*"
    paths:
      - ".github/workflows/robinhood-stock-graduation-registry.yml"
  workflow_dispatch:

jobs:
  registry-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PG_DISABLE_SSL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0204c4a47555a747b95e7c80deb113d36f91e491
      - name: Pin exact production authority
        run: test "$(git rev-parse HEAD)" = "0204c4a47555a747b95e7c80deb113d36f91e491"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Registry authority tests
        working-directory: frontend
        run: |
          node --test api/lib/robinhoodStockGraduationRegistry.test.mjs
          node --test api/lib/quoteAssetCatalog.test.mjs
      - name: API relative-import gate
        working-directory: frontend
        run: npm run check:api-imports
      - name: ENV registry cannot remain production authority
        run: |
          if grep -q 'ROBINHOOD_STOCK_TOKEN_REGISTRY_' frontend/api/dev-fix/robinhoodStockCreatePolicy.js; then
            echo 'ENV Stock Token registry is still referenced by production create authorization'
            exit 1
          fi
