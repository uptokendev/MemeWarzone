name: Apply Pump manual proof preview patch

on:
  push:
    branches:
      - preview/import-review-c15d5edd
    paths:
      - frontend/scripts/apply-pump-manual-proof-release.mjs
      - .github/workflows/apply-pump-manual-proof-preview.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/import-review-c15d5edd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        working-directory: frontend
        run: node scripts/apply-pump-manual-proof-release.mjs
      - name: Run focused source tests
        working-directory: frontend
        run: node --test src/project-imports-ui.test.mjs api/lib/projectImportAssessment.test.mjs
      - name: Materialize source changes and remove one-shot machinery
        run: |
          rm -f frontend/scripts/apply-pump-manual-proof-release.mjs .github/workflows/apply-pump-manual-proof-preview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(imports): allow safe Pump.fun manual ownership proof" || exit 0
          git push origin HEAD:preview/import-review-c15d5edd
