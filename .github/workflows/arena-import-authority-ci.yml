name: Arena Import Authority Gate

on:
  push:
    branches:
      - build/cross-chain-stabilization-rh-base
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - "frontend/api/admin/arenaImports.js"
      - "frontend/api/arenaImports.js"
      - "frontend/api/arenaBattles.js"
      - "frontend/api/arenaTournaments.js"
      - "frontend/api/arenaLeague.js"
      - "frontend/api/lib/arenaEligibility.js"
      - "frontend/api/lib/arenaImport*.js"
      - "frontend/api/lib/arenaImport*.mjs"
      - "frontend/src/lib/arenaImports.ts"
      - "frontend/src/lib/arena/importAuditPresentation.mjs"
      - "frontend/src/lib/arena/importAuditPresentation.test.mjs"
      - "frontend/src/pages/ImportedTokenDetails.tsx"
      - "db/migrations/*arena_import*"
      - "docs/arena/imported-token-authority-api.md"
      - ".github/workflows/arena-import-authority-ci.yml"

permissions:
  contents: read

concurrency:
  group: arena-import-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imported-token-authority:
    name: Imported-token authority and production proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Syntax-check imported-token authority modules
        run: |
          node --check frontend/api/admin/arenaImports.js
          node --check frontend/api/arenaImports.js
          node --check frontend/api/arenaBattles.js
          node --check frontend/api/arenaTournaments.js
          node --check frontend/api/arenaLeague.js
          node --check frontend/api/lib/arenaEligibility.js
          node --check frontend/api/lib/arenaImportEligibility.js
          node --check frontend/api/lib/arenaImportScan.js
          node --check frontend/src/lib/arena/importAuditPresentation.mjs

      - name: Run imported-token backend authority certification
        run: node --test frontend/api/lib/arenaImportAuthority.test.mjs frontend/api/lib/arenaImportAuthorityContract.test.mjs

      - name: Run focused public imported-token UX certification
        run: node --test frontend/src/lib/arena/importAuditPresentation.test.mjs

      - name: Check frontend API import graph
        run: npm --prefix frontend run check:api-imports

      - name: Production frontend build
        run: npm --prefix frontend run build
