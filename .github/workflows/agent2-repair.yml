name: Agent 2 Repair

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore lib and bind confirm lifetime
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.run([
              'git', 'checkout', 'bd59f13226de2d6f66fc8bfd3cbb05e0d4f93e93', '--',
              'programs/memewarzone_solana/src/lib.rs'
          ], check=True)
          p = Path('programs/memewarzone_solana/src/lib.rs')
          s = p.read_text()
          old = 'pub fn confirm_graduation(ctx: Context<ConfirmGraduation>) -> Result<()> {'
          new = "pub fn confirm_graduation<'info>(ctx: Context<'_, '_, '_, 'info, ConfirmGraduation<'info>>) -> Result<()> {"
          if old not in s:
              raise SystemExit('confirm_graduation wrapper target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Format Solana program
        run: cargo fmt --all
      - name: Rust formatting gate
        run: cargo fmt --all -- --check
      - name: Rust unit tests
        run: cargo test -p memewarzone_solana --lib
      - name: Commit repaired candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/memewarzone_solana/src/lib.rs
          git commit -m 'fix(solana): bind confirm graduation account lifetime'
          git push origin HEAD:agent2/solana-basic-graduation-market
