name: Agent 2 Repair

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair graduation compile blockers
        shell: python
        run: |
          from pathlib import Path
          p = Path('programs/memewarzone_solana/src/graduation.rs')
          s = p.read_text()
          replacements = [
            (
              "pub fn confirm_graduation_handler(ctx: Context<ConfirmGraduation>) -> Result<()> {",
              "pub fn confirm_graduation_handler<'info>(ctx: Context<'_, '_, '_, 'info, ConfirmGraduation<'info>>) -> Result<()> {",
            ),
            (
              "let token_scale = token_scale(token_decimals)?; let quote_scale = token_scale(quote_decimals)?;",
              "let launch_scale = token_scale(token_decimals)?; let quote_scale = token_scale(quote_decimals)?;",
            ),
            (
              "let expected = final_spot_nano.checked_mul(u128::from(sol_usd_micros)).ok_or(LaunchpadError::MathOverflow)?.checked_div(1_000_000_000_000_000_000u128).ok_or(LaunchpadError::MathOverflow)?.checked_mul(quote_scale).ok_or(LaunchpadError::MathOverflow)?.checked_div(u128::from(quote_usd_micros)).ok_or(LaunchpadError::MathOverflow)?;",
              "let expected_numerator = final_spot_nano.checked_mul(u128::from(sol_usd_micros)).ok_or(LaunchpadError::MathOverflow)?.checked_mul(quote_scale).ok_or(LaunchpadError::MathOverflow)?; let expected_denominator = 1_000_000_000_000_000_000u128.checked_mul(u128::from(quote_usd_micros)).ok_or(LaunchpadError::MathOverflow)?; let expected = expected_numerator.checked_div(expected_denominator).ok_or(LaunchpadError::MathOverflow)?;",
            ),
            (
              "let actual = u128::from(quote_raw).checked_mul(token_scale).ok_or(LaunchpadError::MathOverflow)?.checked_div(u128::from(token_raw)).ok_or(LaunchpadError::MathOverflow)?;",
              "let actual = u128::from(quote_raw).checked_mul(launch_scale).ok_or(LaunchpadError::MathOverflow)?.checked_div(u128::from(token_raw)).ok_or(LaunchpadError::MathOverflow)?;",
            ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected repair target not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Format Solana program
        run: cargo fmt --all
      - name: Commit repaired candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/memewarzone_solana/src/graduation.rs
          git commit -m 'fix(solana): compile generic quote graduation path'
          git push origin HEAD:agent2/solana-basic-graduation-market
      - name: Rust formatting gate
        run: cargo fmt --all -- --check
      - name: Rust unit tests
        run: cargo test -p memewarzone_solana --lib
