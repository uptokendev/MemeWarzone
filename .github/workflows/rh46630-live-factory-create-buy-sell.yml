name: RH46630 live factory create+buy+sell

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE_BUY_SELL_CHAIN_46630_LIVE_FACTORY
        required: true
        type: string
      live:
        description: Set true to send txs on 46630 (needs secrets). False is dry-run only.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create-buy-sell:
    if: github.event.inputs.confirmation == 'CREATE_BUY_SELL_CHAIN_46630_LIVE_FACTORY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry-run pin (live factory, not 0xF170, not 4663)
        run: node --test scripts/rh46630-live-factory-create-buy-sell.test.mjs

      - name: Plan or send create/buy/sell on live factory 0xd03D
        env:
          RH46630_CREATE_BUY_SELL: ${{ github.event.inputs.live == 'true' && '1' || '0' }}
          T2_CHAIN_ID: "46630"
          FACTORY_ADDRESS_46630: "0xd03D1CC03d108B7F9b2195489DC6CFda1FB1a943"
          ROBINHOOD_TESTNET_RPC_URL: ${{ secrets.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY }}
          ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY: ${{ secrets.ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY }}
          ROBINHOOD_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.ROBINHOOD_ROUTE_AUTHORITY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ "${RH46630_CREATE_BUY_SELL}" = "1" ]; then
            test -n "${ROBINHOOD_TESTNET_RPC_URL:-}"
            test -n "${ROBINHOOD_TESTNET_DEPLOYER_PRIVATE_KEY:-}"
            test -n "${ROBINHOOD_TESTNET_TRADER_A_PRIVATE_KEY:-}"
            test -n "${ROBINHOOD_ROUTE_AUTHORITY_PRIVATE_KEY:-}"
          fi
          node scripts/rh46630-live-factory-create-buy-sell.mjs | tee reports/rh46630-live-factory-create-buy-sell.json
          test -s reports/rh46630-live-factory-create-buy-sell.json
          python3 - <<'PY'
          import json
          d=json.load(open("reports/rh46630-live-factory-create-buy-sell.json"))
          assert d.get("factory","").lower()=="0xd03d1cc03d108b7f9b2195489dc6cfda1fb1a943"
          assert "f170" not in d.get("factory","").lower()
          assert d.get("chainId")==46630
          assert d.get("native")=="ETH"
          PY

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh46630-live-factory-create-buy-sell
          path: reports/rh46630-live-factory-create-buy-sell.json
          if-no-files-found: warn
