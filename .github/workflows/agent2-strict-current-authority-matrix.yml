name: Agent 2 strict Solana current-authority matrix

on:
  push:
    branches:
      - agent2/solana-current-authority-launch-d37dcf7
    paths:
      - .github/workflows/agent2-strict-current-authority-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: d37dcf7b39c8cee0d472ad5f393db13104bb19b2
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  EXPECTED_CANDIDATE_SHA: 27ad65b560dba8a33330bd95f08ae7ca6945f71ebf667a5a3756ae0cb9f7f080
  EXPECTED_CANDIDATE_BYTES: "1165328"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mwz_agent2_strict
  PG_DISABLE_SSL: "1"
  SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
  SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
  SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
  SOLANA_LAUNCHPAD_PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_GRADUATION_AUTH_URL: http://127.0.0.1:43101/api/solana/graduation-authorize
  SOLANA_GRADUATION_AUTH_ENABLED: "true"
  SOLANA_GRADUATION_CHAIN_ID: "102"
  SOLANA_GRADUATION_BASIC_RELEASE_ONLY: "true"
  SOLANA_GRADUATION_SOL_USD_MICROS: "145948162"
  SOLANA_GRADUATION_SEND: "true"
  SOLANA_GRADUATION_PAUSE_SNAPSHOT: /tmp/mwz-solana-devnet-pause-snapshot.json
  SOLANA_GRADUATION_FIXTURE_OUTPUT: /tmp/mwz-agent2-strict-fixture.json
  SOLANA_GRADUATION_MATRIX_REPORT: /tmp/mwz-strict-graduation.json
  SOLANA_POSTGRAD_REPORT: /tmp/mwz-strict-postgrad.json

jobs:
  strict-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mwz_agent2_strict
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mwz_agent2_strict"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze current authority and production delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA"..HEAD -- programs/memewarzone_solana frontend/src frontend/api tests/solana/devnet-create-graduation-fixture.cjs)"
          changed_prod="$(git diff --name-only "$BASE_SHA"..HEAD -- tools/solana-meteora-graduation | tr '\n' ' ')"
          test "$changed_prod" = "tools/solana-meteora-graduation/graduate-basic-quote.mjs "
          grep -q 'operator native quote ATA must be empty' tools/solana-meteora-graduation/graduate-basic-quote.mjs
          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "PROGRAM_SOURCE_CHANGED=NO"
          echo "NARROW_PRODUCTION_CHANGE=$changed_prod"
          echo "MAINNET_UPGRADE=NO"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/solana --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix tools/solana-meteora-graduation --no-audit --no-fund

      - name: Materialize operator and route signer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_DEVNET_PAYER:-}"
          test -n "${SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY:-}"
          operator_file="${RUNNER_TEMP}/mwz-solana-strict-operator.json"
          route_file="${RUNNER_TEMP}/mwz-solana-strict-route.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs
          ROUTE_FILE="$route_file" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ['SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY'])
          assert isinstance(value,list) and len(value)==64
          with open(os.environ['ROUTE_FILE'],'w',encoding='utf-8') as h: json.dump(value,h)
          os.chmod(os.environ['ROUTE_FILE'],0o600)
          PY
          route_pubkey="$(ROUTE_FILE="$route_file" node - <<'NODE'
          const fs=require('fs');const {Keypair}=require('./tests/solana/node_modules/@solana/web3.js');
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.ROUTE_FILE,'utf8'))));
          process.stdout.write(kp.publicKey.toBase58());
          NODE
          )"
          echo "SOLANA_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"
          echo "SOLANA_GRADUATION_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"
          echo "SOLANA_NEW_ROUTE_SIGNER_KEYPAIR=$route_file" >> "$GITHUB_ENV"
          echo "SOLANA_ROUTE_SIGNER_PUBLIC_KEY=$route_pubkey" >> "$GITHUB_ENV"

      - name: Verify devnet operator and budget
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const {Connection,Keypair,LAMPORTS_PER_SOL}=require('./tests/solana/node_modules/@solana/web3.js');
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_OPERATOR_KEYPAIR,'utf8'))));
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          (async()=>{
            const genesis=await c.getGenesisHash();
            if(genesis!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error(`wrong cluster ${genesis}`);
            if(kp.publicKey.toBase58()!=='HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9') throw new Error(`wrong operator ${kp.publicKey}`);
            let balance=await c.getBalance(kp.publicKey,'confirmed');
            console.log('OPERATOR',kp.publicKey.toBase58());
            console.log('OPERATOR_BALANCE_BEFORE',balance);
            for(let i=0;i<5 && balance<600000000;i++){
              try{
                const sig=await c.requestAirdrop(kp.publicKey,LAMPORTS_PER_SOL);
                const latest=await c.getLatestBlockhash('confirmed');
                await c.confirmTransaction({signature:sig,...latest},'confirmed');
                console.log('AIRDROP',sig);
              }catch(e){console.log('AIRDROP_FAILED',String(e?.message||e));}
              balance=await c.getBalance(kp.publicKey,'confirmed');
            }
            if(balance<600000000) throw new Error(`operator budget too low ${balance}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Generate current IDLs without deploying
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2024-05-09 --profile minimal
          npm install --global --silent @coral-xyz/anchor-cli@0.30.1
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN=nightly-2024-05-09 anchor idl build --out ../../target/idl/memewarzone_solana.json)
          (cd programs/mwz_rewards_treasury && RUSTUP_TOOLCHAIN=nightly-2024-05-09 anchor idl build --out ../../target/idl/mwz_rewards_treasury.json)
          test -s target/idl/memewarzone_solana.json
          test -s target/idl/mwz_rewards_treasury.json
          test ! -e target/deploy/memewarzone_solana.so

      - name: Materialize test-only golden and middle harnesses with telemetry
        shell: bash
        run: |
          set -euo pipefail
          harness_sha=ad4133dddf9f6033a7ef3af36b196ba080863918
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/${harness_sha}/tests/solana/candidate-wallet-golden-devnet.cjs" -o tests/solana/candidate-wallet-golden-devnet.cjs
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/${harness_sha}/tests/solana/candidate-wallet-middle-devnet.cjs" -o tests/solana/candidate-wallet-middle-devnet.cjs
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/${harness_sha}/tests/solana/patch-candidate-wallet-p1.py" -o /tmp/patch-candidate-wallet-p1.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patch-candidate-wallet-p1.py')
          s=p.read_text()
          s=s.replace('\npatch_fixture()\npatch_graduation()\n', '\n')
          p.write_text(s)
          PY
          python3 /tmp/patch-candidate-wallet-p1.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/solana/candidate-wallet-golden-devnet.cjs')
          s=p.read_text()
          if 'lamports:100_000_000' not in s: raise SystemExit('golden funding target missing')
          p.write_text(s.replace('lamports:100_000_000','lamports:200_000_000'))
          PY
          echo "HISTORICAL_HARNESS_SHA=$harness_sha TEST_ONLY=YES"
          echo "CREATE_PAYER_FUNDING=200000000"

      - name: FIRST CREATE BUY SELL
        id: first
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_GOLDEN_ONLY_FIRST=1 SOLANA_GOLDEN_REPORT=/tmp/mwz-first.json node tests/solana/candidate-wallet-golden-devnet.cjs | tee /tmp/mwz-first.log
          node - <<'NODE'
          const r=require('/tmp/mwz-first.json');
          for(const key of ['create','buy','sell']){
            if(r.first?.[key]?.status!=='PASS') process.exit(1);
            console.log('FIRST',key.toUpperCase(),JSON.stringify(r.first[key]));
          }
          console.log('FIRST_CREATE_DIAGNOSTICS',JSON.stringify(r.first.creatorDiagnostics));
          NODE

      - name: UPVOTE Normal Battle payment Tournament payment
        id: middle
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_MIDDLE_REPORT=/tmp/mwz-middle.json node tests/solana/candidate-wallet-middle-devnet.cjs 2>&1 | tee /tmp/mwz-middle.log
          node - <<'NODE'
          const r=require('/tmp/mwz-middle.json');
          for(const key of ['upvote','battlePayment','tournamentPayment']){
            if(r[key]?.status!=='PASS') process.exit(1);
            console.log('MIDDLE',key.toUpperCase(),JSON.stringify(r[key]));
          }
          NODE

      - name: Start graduation authorization and prepare fresh native fixture
        id: fixture
        continue-on-error: true
        shell: bash
        env:
          SOLANA_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres -d mwz_agent2_strict && break; sleep 1; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/supabase/migrations/20260906231500_quote_asset_catalog.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/supabase/migrations/20260907001000_solana_basic_quote_catalog.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f frontend/supabase/migrations/20260907163000_solana_devnet_basic_quote_certification.sql
          nohup node scripts/solana/devnet-graduation-auth-server.mjs >/tmp/mwz-agent2-auth.log 2>&1 &
          echo $! >/tmp/mwz-agent2-auth.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:43101/health >/tmp/mwz-agent2-auth-health.json; then break; fi
            if ! kill -0 "$(cat /tmp/mwz-agent2-auth.pid)" 2>/dev/null; then cat /tmp/mwz-agent2-auth.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:43101/health
          npm --prefix tests/solana run devnet:graduation-window -- open
          npm --prefix tests/solana run devnet:create-graduation-fixture | tee /tmp/mwz-fixture.log
          test -s "$SOLANA_GRADUATION_FIXTURE_OUTPUT"
          cat "$SOLANA_GRADUATION_FIXTURE_OUTPUT"

      - name: Normalize operator WSOL ATA
        if: always() && steps.fixture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const {Connection,Keypair}=require('./tests/solana/node_modules/@solana/web3.js');
          const {NATIVE_MINT,TOKEN_PROGRAM_ID,getOrCreateAssociatedTokenAccount,getAccount,closeAccount}=require('./tests/solana/node_modules/@solana/spl-token');
          const kp=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_OPERATOR_KEYPAIR,'utf8'))));
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          (async()=>{
            let ata=await getOrCreateAssociatedTokenAccount(c,kp,NATIVE_MINT,kp.publicKey,false,'confirmed',undefined,TOKEN_PROGRAM_ID);
            let state=await getAccount(c,ata.address,'confirmed',TOKEN_PROGRAM_ID);
            if(state.amount!==0n){
              if(!state.isNative) throw new Error('unexpected non-native WSOL ATA');
              const sig=await closeAccount(c,kp,ata.address,kp.publicKey,kp,[],{commitment:'confirmed'},TOKEN_PROGRAM_ID);
              console.log('WSOL_NORMALIZE_CLOSE',sig,state.amount.toString());
              ata=await getOrCreateAssociatedTokenAccount(c,kp,NATIVE_MINT,kp.publicKey,false,'confirmed',undefined,TOKEN_PROGRAM_ID);
              state=await getAccount(c,ata.address,'confirmed',TOKEN_PROGRAM_ID);
            }
            if(state.amount!==0n) throw new Error(`WSOL ATA nonzero ${state.amount}`);
            console.log('WSOL_ATA_READY',ata.address.toBase58());
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: NATIVE SOL GRADUATION to Meteora
        id: native
        if: always() && steps.fixture.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          campaign="$(node -e 'const r=require(process.env.SOLANA_GRADUATION_FIXTURE_OUTPUT);process.stdout.write(r.campaign)')"
          export SOLANA_GRADUATION_QUOTE_CONFIG_ID=a2100000-0000-4000-8000-000000000211
          node tools/solana-meteora-graduation/graduate-basic-quote.mjs "$campaign" 2>&1 | tee /tmp/mwz-native-graduation.log
          node - <<'NODE'
          const fs=require('fs');const fixture=require(process.env.SOLANA_GRADUATION_FIXTURE_OUTPUT);
          const text=fs.readFileSync('/tmp/mwz-native-graduation.log','utf8');
          const matches=[...text.matchAll(/^GRADUATED\s+(\S+)\s+pool\s+(\S+)\s+position\s+(\S+)$/gm)];
          if(matches.length!==1) throw new Error(`expected one graduation, got ${matches.length}`);
          const [,signature,pool,position]=matches[0];
          const report={status:'PASS',cluster:'devnet',campaign:fixture.campaign,mint:fixture.mint,quoteMint:'So11111111111111111111111111111111111111112',signature,pool,position};
          fs.writeFileSync(process.env.SOLANA_GRADUATION_MATRIX_REPORT,JSON.stringify(report,null,2)+'\n');
          console.log('NATIVE_GRADUATION',JSON.stringify(report));
          NODE

      - name: POST-GRAD BUY then SELL on new Meteora pool
        id: postgrad
        if: always() && steps.native.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tests/solana/current-authority-postgrad-roundtrip-devnet.cjs | tee /tmp/mwz-postgrad.log
          node - <<'NODE'
          const r=require(process.env.SOLANA_POSTGRAD_REPORT);
          if(r.status!=='PASS'||r.buy?.status!=='PASS'||r.sell?.status!=='PASS') process.exit(1);
          console.log('POST_GRAD_BUY',JSON.stringify(r.buy));
          console.log('POST_GRAD_SELL',JSON.stringify(r.sell));
          console.log('POST_GRAD_POOL',r.pool);
          NODE

      - name: Restore graduation pause state
        id: restore
        if: always()
        continue-on-error: true
        shell: bash
        run: npm --prefix tests/solana run devnet:graduation-window -- restore

      - name: FINAL CREATE BUY SELL
        id: final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_GOLDEN_ONLY_FINAL=1 SOLANA_GOLDEN_REPORT=/tmp/mwz-final.json node tests/solana/candidate-wallet-golden-devnet.cjs | tee /tmp/mwz-final.log
          node - <<'NODE'
          const r=require('/tmp/mwz-final.json');
          for(const key of ['create','buy','sell']){
            if(r.final?.[key]?.status!=='PASS') process.exit(1);
            console.log('FINAL',key.toUpperCase(),JSON.stringify(r.final[key]));
          }
          console.log('FINAL_CREATE_DIAGNOSTICS',JSON.stringify(r.final.creatorDiagnostics));
          NODE

      - name: Enforce exact ordered matrix and classify external Arena blocker
        if: always()
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.first.outcome }}
          MIDDLE_OUTCOME: ${{ steps.middle.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          POSTGRAD_OUTCOME: ${{ steps.postgrad.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
        run: |
          set -euo pipefail
          echo "first=$FIRST_OUTCOME middle=$MIDDLE_OUTCOME fixture=$FIXTURE_OUTCOME native=$NATIVE_OUTCOME postgrad=$POSTGRAD_OUTCOME restore=$RESTORE_OUTCOME final=$FINAL_OUTCOME"
          if test "$MIDDLE_OUTCOME" != success && grep -Eqi 'ArenaMoneyV2|arena_money|competition pool|rewards' /tmp/mwz-middle.log 2>/dev/null; then
            echo 'EXTERNAL BLOCKER — AGENT 1'
          fi
          test "$FIRST_OUTCOME" = success
          test "$MIDDLE_OUTCOME" = success
          test "$FIXTURE_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          test "$POSTGRAD_OUTCOME" = success
          test "$RESTORE_OUTCOME" = success
          test "$FINAL_OUTCOME" = success
          echo "SOLANA_CURRENT_AUTHORITY_STRICT_MATRIX=PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-strict-solana-matrix-${{ github.sha }}
          path: |
            /tmp/mwz-first.json
            /tmp/mwz-first.log
            /tmp/mwz-middle.json
            /tmp/mwz-middle.log
            /tmp/mwz-agent2-strict-fixture.json
            /tmp/mwz-fixture.log
            /tmp/mwz-strict-graduation.json
            /tmp/mwz-native-graduation.log
            /tmp/mwz-strict-postgrad.json
            /tmp/mwz-postgrad.log
            /tmp/mwz-final.json
            /tmp/mwz-final.log
            /tmp/mwz-agent2-auth.log
            /tmp/mwz-agent2-auth-health.json
            /tmp/mwz-solana-devnet-pause-snapshot.json
          if-no-files-found: warn
          retention-days: 14
