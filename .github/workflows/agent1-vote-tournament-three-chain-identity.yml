name: Agent 1 Vote Tournament Three-Chain Identity

on:
  push:
    branches:
      - agent1/vote-tournament-three-chain-identity
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base

permissions:
  contents: read

jobs:
  vote-tournament-chain-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund
      - name: Syntax check Vote Tournament identity files
        run: |
          node --check frontend/api/lib/arenaVoteTournamentChainIdentity.js
          node --check frontend/api/arenaVoteTournamentIdentityGate.js
          node --check frontend/api/arenaTournamentVotes.js
          node --check frontend/api/postgrad.js
      - name: Focused Vote Tournament three-chain identity tests
        run: node --test frontend/api/lib/arenaVoteTournamentChainIdentity.test.mjs
      - name: Normal Tournament PR 240 regression
        run: node --test frontend/api/lib/arenaTournamentChainIdentity.test.mjs
