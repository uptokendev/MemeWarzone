name: Arena Auxiliary Deployment Authority

on:
  pull_request:
    paths:
      - "contracts/EventPrizeVaultV1.sol"
      - "contracts/WarzoneSponsorshipRouterV1.sol"
      - "contracts/UPVoteTreasury.sol"
      - "scripts/deployArenaAuxiliaryBundle.ts"
      - "scripts/verifyArenaAuxiliaryBundle.ts"
      - "scripts/lib/arenaAuxiliaryDeploymentPolicy.cjs"
      - "scripts/arenaAuxiliaryDeployment.test.mjs"
      - "config/arena-auxiliary.env.example"
      - ".github/workflows/arena-auxiliary-deployment-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused auxiliary deployment authority
        run: node --test scripts/arenaAuxiliaryDeployment.test.mjs
      - name: Hardhat compile
        run: npx hardhat compile
