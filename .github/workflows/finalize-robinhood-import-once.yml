name: Finalize Robinhood import once
on:
  push:
    branches: [release/live-import-20260910]
    paths: ['.github/workflows/finalize-robinhood-import-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/live-import-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Final release edits
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replace(path,from,to){let s=fs.readFileSync(path,'utf8');if(!s.includes(from))throw new Error(`Missing anchor ${path}`);fs.writeFileSync(path,s.replace(from,to));}
          replace('frontend/api/projectImports.js','if (["PROJECT_NOT_FOUND", "IMPORT_NOT_FOUND"].includes(code)) return 404;','if (["PROJECT_NOT_FOUND", "IMPORT_NOT_FOUND", "PROJECT_IMPORT_CHAIN_DISABLED"].includes(code)) return 404;');
          replace('docs/import-review-v1.md','3. Apply the additive `20260910175500_project_import_pump_challenges.sql` migration.\n4. Deploy compatible API first, then frontend, then dashboard.\n5. Smoke-test real BNB and Solana import flows and confirm existing launchpad behavior is unchanged.','3. Apply the additive `20260910175500_project_import_pump_challenges.sql` migration.\n4. Apply the additive `20260910194000_project_import_robinhood_chain.sql` migration.\n5. Deploy compatible API first, then frontend, then dashboard.\n6. Smoke-test real BNB and Solana import flows and confirm existing launchpad behavior is unchanged. Robinhood stays disabled until its independent import switch is deliberately enabled and smoke-tested.');
          replace('docs/import-review-v1.md','BNB coverage authenticates supported Four.meme launch state and canonical PancakeSwap market identity. A recognized still-bonding token is rejected before independent pool discovery can create a false graduation signal. Direct-DEX/unknown-origin markets can require independent launch-history review rather than being auto-cleared.','BNB coverage authenticates supported Four.meme launch state and canonical PancakeSwap market identity. A recognized still-bonding token is rejected before independent pool discovery can create a false graduation signal. Direct-DEX/unknown-origin markets can require independent launch-history review rather than being auto-cleared.\n\nRobinhood import support is fully isolated and read-only on chain 4663. It checks deployed ERC-20 bytecode, name/symbol/decimals/totalSupply where readable, and current `owner()` / `getOwner()` authority. It has no LaunchFactory, graduation, router, locker, oracle, quote-catalog, trading, claims or Arena dependency. Production must keep both `ENABLE_PROJECT_IMPORT_ROBINHOOD=false` and `VITE_ENABLE_PROJECT_IMPORT_ROBINHOOD=false` until Robinhood import is deliberately activated. Enabling later requires both flags, a chain-4663 `ROBINHOOD_RPC_URL`, and a real import smoke test. The import-only market marker never grants trading or Arena approval.');
          fs.writeFileSync('supabase/migrations/20260910194000_project_import_robinhood_chain.sql',`-- Add Robinhood chain identity to private import evidence only.\n-- This does not activate Robinhood import, launchpad creation, trading, claims or Arena.\nALTER TABLE public.project_import_review_evidence\n  DROP CONSTRAINT IF EXISTS project_import_review_evidence_chain_id_check;\nALTER TABLE public.project_import_review_evidence\n  ADD CONSTRAINT project_import_review_evidence_chain_id_check\n  CHECK (chain_id IN (56,101,4663));\n`);
          fs.rmSync('.github/workflows/finalize-robinhood-import-once.yml');
          NODE
      - name: Prove exact source
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          node --test frontend/api/lib/projectOwnershipResolveEvm.test.mjs frontend/src/robinhood-import-gate.test.mjs frontend/src/imported-token-details-page.test.mjs
          npm --prefix frontend run check:api-imports
          npm --prefix frontend run build
      - name: Commit
        run: |
          git config user.name "MemeWarzone Launch Control"
          git config user.email "launch-control@users.noreply.github.com"
          git add -A
          git commit -m "feat(import): finalize gated Robinhood chain support"
          git push origin HEAD:release/live-import-20260910
