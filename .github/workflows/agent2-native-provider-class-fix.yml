name: Agent 2 Native Provider Class Fix

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve native on-chain class while binding Agent 1 provider provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/api/dev-fix/solana-graduation-authorization-v2.js')
          s=p.read_text()
          old='providerClass: providerClassCode(item.provider?.providerClass), decimals: Number(route.decimals ?? (profile === QUOTE_PROFILE.NATIVE ? 9 : 0)),'
          new='providerClass: profile === QUOTE_PROFILE.NATIVE ? PROVIDER_CLASS.NATIVE : providerClassCode(item.provider?.providerClass), decimals: Number(route.decimals ?? (profile === QUOTE_PROFILE.NATIVE ? 9 : 0)),'
          if old not in s:
              raise SystemExit('provider-class mapping marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/api/dev-fix/solana-graduation-authorization-v2.js
          git commit -m 'fix(solana): encode native quote provider class correctly'
          git push origin HEAD:agent2/solana-basic-graduation-market
