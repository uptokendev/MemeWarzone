name: Agent 2 Normal Battle Destructive Closeout Current

on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - ".github/workflows/agent2-normal-battle-destructive-closeout-current.yml"
      - "scripts/agent2-bsc97-normal-battle-evidence.ts"
      - "scripts/agent2-bsc97-normal-battle-cleanup.ts"
      - "tests/solana/agent2-normal-battle-market-evidence.cjs"
      - "frontend/scripts/agent2-normal-battle-db-closeout.mjs"
      - "certification/agent2-bsc97-stage-20260914.json"

permissions:
  contents: read

concurrency:
  group: agent2-normal-battle-current-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI: true
  EXPECTED_BASE: df8e9dd32387cfe82f208c372461aa629f14cf84

jobs:
  bsc97-normal-battle:
    if: ${{ github.head_ref == 'agent2/normal-battle-destructive-closeout-df8e9dd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent2_bsc97_battle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent2_bsc97_battle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent2_bsc97_battle
      PG_DISABLE_SSL: "1"
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      DEPLOYER_PK: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      PRIVATE_KEY_DEPLOY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_TESTNET_RPC: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BSC_TESTNET_RPC_URL: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      BNB_TESTNET_ADMIN: "0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa"
      BNB_6C_ROUTE_AUTHORITY_ADDRESS: "0x2b72A9E6C4Ea3525d83B8C5E8F2044BDbC1f1Dec"
      BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY: ${{ secrets.BNB_6C_ROUTE_AUTHORITY_PRIVATE_KEY }}
      BNB_6C_STAGE_DEPLOYMENT_FILE: certification/agent2-bsc97-stage-20260914.json
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove current integration authority lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          echo "base=$EXPECTED_BASE head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend --no-audit --no-fund
      - name: Bootstrap authoritative Arena DB schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF; END $$;
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF; END $$;
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role; END IF; END $$;
          SQL
          for f in \
            db/migrations/20260826_000001_arena_identity_schema.sql \
            db/migrations/20260827_000004_arena_battle_counter_offers.sql \
            db/migrations/20260827_000005_arena_battle_matched.sql \
            db/migrations/20260827_000006_arena_battle_duration.sql \
            db/migrations/20260828_000007_arena_tournament_support.sql \
            db/migrations/20260829_000001_arena_settle_idempotency.sql \
            db/migrations/20260902_000003_arena_battle_metrics.sql \
            db/migrations/20260903_000002_arena_battle_points_v2_settlement.sql \
            db/migrations/20260903_000103_arena_tournament_battle_modes.sql \
            db/migrations/20260903_000104_arena_vote_boost_sponsorship_v1_foundation.sql \
            db/migrations/20260906_000005_arena_scoring_generation_lock.sql \
            db/migrations/20260906_000006_arena_battle_v3_runtime_activation.sql; do
              echo "apply=$f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Execute real BSC97 two-side market exercise
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npx hardhat run scripts/agent2-bsc97-normal-battle-evidence.ts --network bscTestnet | tee reports/agent2-bsc97-normal-battle-market.log
          test -s reports/agent2-bsc97-normal-battle-market.json
          sleep 15
      - name: Bind BSC97 chain evidence to one authoritative Battle DB row
        working-directory: frontend
        env:
          AGENT2_CHAIN_KEY: bsc97
          AGENT2_MARKET_EVIDENCE: ${{ github.workspace }}/reports/agent2-bsc97-normal-battle-market.json
          AGENT2_BATTLE_DB_REPORT: ${{ github.workspace }}/reports/agent2-bsc97-normal-battle-db.json
        run: node scripts/agent2-normal-battle-db-closeout.mjs | tee ../reports/agent2-bsc97-normal-battle-db.log
      - name: Restore isolated BSC97 create pause
        if: ${{ always() }}
        run: npx hardhat run scripts/agent2-bsc97-normal-battle-cleanup.ts --network bscTestnet
      - name: Upload BSC97 closeout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-bsc97-normal-battle-current-${{ github.event.pull_request.head.sha }}
          path: |
            certification/agent2-bsc97-stage-20260914.json
            reports/agent2-bsc97-normal-battle-market.json
            reports/agent2-bsc97-normal-battle-market.log
            reports/agent2-bsc97-normal-battle-db.json
            reports/agent2-bsc97-normal-battle-db.log
          if-no-files-found: warn
          retention-days: 30

  solana-devnet-normal-battle:
    if: ${{ github.head_ref == 'agent2/normal-battle-destructive-closeout-df8e9dd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent2_solana_battle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent2_solana_battle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent2_solana_battle
      PG_DISABLE_SSL: "1"
      SOLANA_APPLICATION_CHAIN_ID: "101"
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || secrets.SOLANA_DEVNET_RPC_URL || vars.SOLANA_DEVNET_RPC }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER || secrets.SOLANA_DEVNET_PRIVATE_KEY }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
      AGENT2_SOL_USD_PRICE: "200"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prove current integration authority lineage
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          echo "base=$EXPECTED_BASE head=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --prefix tests/solana --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Bootstrap authoritative Arena DB schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF; END $$;
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF; END $$;
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role; END IF; END $$;
          SQL
          for f in \
            db/migrations/20260826_000001_arena_identity_schema.sql \
            db/migrations/20260827_000004_arena_battle_counter_offers.sql \
            db/migrations/20260827_000005_arena_battle_matched.sql \
            db/migrations/20260827_000006_arena_battle_duration.sql \
            db/migrations/20260828_000007_arena_tournament_support.sql \
            db/migrations/20260829_000001_arena_settle_idempotency.sql \
            db/migrations/20260902_000003_arena_battle_metrics.sql \
            db/migrations/20260903_000002_arena_battle_points_v2_settlement.sql \
            db/migrations/20260903_000103_arena_tournament_battle_modes.sql \
            db/migrations/20260903_000104_arena_vote_boost_sponsorship_v1_foundation.sql \
            db/migrations/20260906_000005_arena_scoring_generation_lock.sql \
            db/migrations/20260906_000006_arena_battle_v3_runtime_activation.sql; do
              echo "apply=$f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Materialize governed devnet identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_RPC_URL:-}"
          test -n "${SOLANA_DEVNET_PAYER:-}"
          test -n "${SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY:-}"
          export SOLANA_GRADUATION_OPERATOR_KEYPAIR="$RUNNER_TEMP/mwz-agent2-solana-operator.json"
          node scripts/solana/materialize-devnet-payer.mjs >/dev/null
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(process.env.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY||'null');
          if(!Array.isArray(raw)||raw.length!==64) throw new Error('SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY must be 64-byte JSON array');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/mwz-agent2-solana-route.json',JSON.stringify(raw));
          NODE
      - name: Build current IDL
        shell: bash
        env:
          ANCHOR_VERSION: "0.30.1"
          IDL_RUST_TOOLCHAIN: "nightly-2024-05-09"
        run: |
          set -euo pipefail
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
      - name: Rehydrate accepted prior Solana chain evidence as left side lineage
        shell: bash
        run: |
          cat > /tmp/agent2-solana-left.json <<'JSON'
          {"schemaVersion":1,"applicationChainId":101,"cluster":"devnet","programId":"3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt","campaign":"8tgzr4NHAGKKeLJnR89B9ECVeRJcmqWhM5GwkP6y2Azi","mint":"83sF5fK9zk6rQLwkxN57P4x5YS7og21ooPS5TefNB8rQ","create":{"status":"PASS","signature":"oBueLSP7RWA8kyCbu4h18y3Fp7JRn8XiPT2kBcr6CMnMTPi6TaekZbkGGrrx4wa3A9vtHBNyKPdtEuE85yHrkft"},"buy":{"status":"PASS","signature":"3u8HJ7m4VmygpyZQw86AkvX8xSfna8tT5bzWwiNqfymNHhWVegVYmmrxyDWJksNYScn9rodPfGe2izGZ5J8dGkD7"},"sell":{"status":"PASS","signature":"5g8E1DZmDfoBHnp3tVwPRYM8gk7qp128T9Sh4uMUfkL9dmKEWaJs7GzJtYgAyLwoC7YoMBvLepEJL2M3Xh4c2qzn"},"closeBuy":{"status":"PASS","signature":"XE7dqL64yRAhvxk1dt1wewhY73RFC3GHYqQLjT3atz9iyuzCitZowyUAKqVF1B3QNNXbjB74KUpYnbpj1AyBjZj"}}
          JSON
      - name: Execute one fresh current-head Solana devnet market side
        shell: bash
        env:
          SOLANA_OPERATOR_KEYPAIR: ${{ runner.temp }}/mwz-agent2-solana-operator.json
          SOLANA_NEW_ROUTE_SIGNER_KEYPAIR: ${{ runner.temp }}/mwz-agent2-solana-route.json
          SOLANA_NETWORK_CANARY_REPORT: /tmp/agent2-solana-right.json
        run: node tests/solana/network-canary-101-runner.cjs | tee /tmp/agent2-solana-right.log
      - name: Normalize two real Solana sides and bind chain state
        shell: bash
        env:
          AGENT2_SOLANA_LEFT_REPORT: /tmp/agent2-solana-left.json
          AGENT2_SOLANA_RIGHT_REPORT: /tmp/agent2-solana-right.json
          AGENT2_SOLANA_MARKET_REPORT: /tmp/agent2-solana-normal-battle-market.json
        run: |
          node tests/solana/agent2-normal-battle-market-evidence.cjs | tee /tmp/agent2-solana-normal-battle-market.log
          sleep 15
      - name: Bind Solana chain evidence to one authoritative Battle DB row
        working-directory: frontend
        env:
          AGENT2_CHAIN_KEY: solana-devnet
          AGENT2_MARKET_EVIDENCE: /tmp/agent2-solana-normal-battle-market.json
          AGENT2_BATTLE_DB_REPORT: /tmp/agent2-solana-normal-battle-db.json
        run: node scripts/agent2-normal-battle-db-closeout.mjs | tee /tmp/agent2-solana-normal-battle-db.log
      - name: Upload Solana closeout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent2-solana-normal-battle-current-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/agent2-solana-left.json
            /tmp/agent2-solana-right.json
            /tmp/agent2-solana-right.log
            /tmp/agent2-solana-normal-battle-market.json
            /tmp/agent2-solana-normal-battle-market.log
            /tmp/agent2-solana-normal-battle-db.json
            /tmp/agent2-solana-normal-battle-db.log
          if-no-files-found: warn
          retention-days: 30