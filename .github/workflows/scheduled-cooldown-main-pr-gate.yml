name: Agent 2 Local Quote Acceptance Runner

on:
  push:
    branches:
      - cert/agent2-99d1-local-quotes

permissions:
  contents: read

env:
  CANDIDATE_SHA: 1e7b45802a7e2e39e13e46321209d2eb6c87606f
  HARNESS_SOURCE_SHA: 93b2359db5910fb16552a7a7e574ba078d3df61b
  HARNESS_WRAPPER_SHA: ad1daaf96126558f345482759141229b5dd80bcf
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_TOOLCHAIN: nightly-2024-05-09
  LOCAL_RPC: http://127.0.0.1:8899

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Materialize preserved dedicated harness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HARNESS_SOURCE_SHA" "$HARNESS_WRAPPER_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/workflows/agent2-99d1-local-quotes.yml" > /tmp/agent2-existing-harness.yml
          git show "$HARNESS_WRAPPER_SHA:.github/workflows/agent2-99d1-local-quotes.yml" > /tmp/agent2-wrapper.yml
          python <<'PY'
          from pathlib import Path
          raw = Path('/tmp/agent2-wrapper.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(raw) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(raw)) if raw[i].strip() == 'PY')
          code = [line[10:] if line.startswith('          ') else line for line in raw[start:end]]
          exec(compile('\n'.join(code), '<preserved-agent2-wrapper>', 'exec'), {'__name__': '__main__'})
          p = Path('tests/solana/v4-lifecycle-acceptance.cjs')
          s = p.read_text()
          s = s.replace('join("\n")', 'join("\\n")')
          s = s.replace("join('\n')", "join('\\n')")
          p.write_text(s)
          PY
          node --check tests/solana/v4-lifecycle-acceptance.cjs
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          d="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$d"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error -o /tmp/solana.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$d" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$d" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build exact candidate and pinned Meteora fixture
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          npm install --prefix tests/solana --no-audit --no-fund
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/solana/fetch-pinned-meteora-cp-amm.mjs --with-accounts
      - name: Run native and canonical-stable graduation on fresh disposable validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          for mode in native stable; do
            ledger="/tmp/agent2-${mode}-ledger"
            rm -rf "$ledger"
            solana-test-validator --reset --quiet --ledger "$ledger" --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so --bpf-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG third_party/meteora/cp_amm.so --account-dir third_party/meteora/accounts >"/tmp/agent2-${mode}-validator.log" 2>&1 &
            pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            for i in $(seq 1 60); do
              solana cluster-version --url "$LOCAL_RPC" >/dev/null 2>&1 && break
              if [ "$i" -eq 60 ]; then cat "/tmp/agent2-${mode}-validator.log"; exit 1; fi
              sleep 2
            done
            solana config set --url "$LOCAL_RPC" --keypair "$ANCHOR_WALLET" >/dev/null
            solana airdrop 100 >/dev/null
            (cd tests/solana && BASIC_GRAD_QUOTE_MODE="$mode" ANCHOR_PROVIDER_URL="$LOCAL_RPC" ANCHOR_WALLET="$ANCHOR_WALLET" GATE_K_METEORA=1 npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs)
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            trap - EXIT
          done
