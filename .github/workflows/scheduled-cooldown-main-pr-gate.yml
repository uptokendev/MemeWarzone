name: Agent 2 99d1 Local BASIC Quote Acceptance

on:
  push:
    branches:
      - cert/agent2-99d1-local-quotes

permissions:
  contents: read

env:
  CANDIDATE_SHA: 1e7b45802a7e2e39e13e46321209d2eb6c87606f
  HARNESS_SOURCE_SHA: 93b2359db5910fb16552a7a7e574ba078d3df61b
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_TOOLCHAIN: nightly-2024-05-09
  LOCAL_RPC: http://127.0.0.1:8899

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          d="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$d"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error -o /tmp/solana.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$d" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$d" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"

      - name: Build exact candidate and pinned Meteora fixture
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
          npm install --prefix tests/solana --no-audit --no-fund
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/solana/fetch-pinned-meteora-cp-amm.mjs --with-accounts

      - name: Execute existing dedicated harness adaptation and add pending retry assertion
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HARNESS_SOURCE_SHA"
          git show "$HARNESS_SOURCE_SHA:.github/workflows/agent2-99d1-local-quotes.yml" > /tmp/agent2-existing-harness.yml
          python <<'PY'
          from pathlib import Path
          import os

          raw = Path('/tmp/agent2-existing-harness.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(raw) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(raw)) if raw[i].strip() == 'PY')
          code = []
          for line in raw[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(code), '<existing-agent2-local-harness>', 'exec'), {'__name__': '__main__'})

          p = Path('tests/solana/v4-lifecycle-acceptance.cjs')
          s = p.read_text()
          old = 'let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null;'
          new = 'let quoteMint=NATIVE_MINT,quoteDecimals=9,binding=nativeGraduationBinding(oraclePrice),acquisitionIx=null,quoteRemaining=[],poolQuoteRaw=quote.maxLiquidityLamports,residual=0n,recoveryAccount=null,authorityQuote=null,acquisitionSource=null,acquired=0n;'
          if old not in s:
              raise SystemExit('stable setup declaration not found')
          s = s.replace(old, new, 1)
          s = s.replace('const acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin);', 'acquisitionSource=await createAccount(connection,adminKeypair,quoteMint,admin);', 1)
          s = s.replace('const acquired=poolQuoteRaw+residual;', 'acquired=poolQuoteRaw+residual;', 1)

          marker = 'const latest=await connection.getLatestBlockhash("confirmed"); const versioned=v0Helpers.buildLaunchpadV0Transaction(web3,{payer:admin,recentBlockhash:latest.blockhash,instructions,lookupTableAccounts:[lookupTableAccount]});'
          if marker not in s:
              raise SystemExit('safe graduation V0 marker not found')
          pending = r'''if(stableMode){
      const unsafeBinding={...binding,quoteReferenceUsdMicros:quoteUsd*2n};
      const unsafeDigest=graduationDigest(digestInput(campaign,nativeTarget,oraclePrice,deadline,hash32("graduation:stable-v4-unsafe"),nftMint.publicKey,pool,position,unsafeBinding));
      const unsafeEd25519=Ed25519Program.createInstructionWithPrivateKey({privateKey:routeSigner.secretKey,message:unsafeDigest});
      const unsafeBeginIx=await program.methods.beginGraduation(anchorGraduationArgs(nativeTarget,oraclePrice,deadline,hash32("graduation:stable-v4-unsafe"),nftMint.publicKey,unsafeBinding)).accountsStrict({authority:admin,globalConfig,generationConfig,campaign:campaignAccounts.campaign,mint:campaignAccounts.mint,tokenVault:campaignAccounts.tokenVault,solVault:campaignAccounts.solVault,feeEscrow:campaignAccounts.feeEscrow,authorityTokenAccount:authorityAta,meteoraPool:pool,meteoraPosition:position,positionNftMint:nftMint.publicKey,graduationState,instructions:SYSVAR_INSTRUCTIONS_PUBKEY,tokenProgram:TOKEN_PROGRAM_ID,systemProgram:SystemProgram.programId}).instruction();
      const unsafeInstructions=[ComputeBudgetProgram.setComputeUnitLimit({units:1_400_000}),unsafeEd25519,unsafeBeginIx,acquisitionIx,...meteoraTx.instructions,confirmIx];
      const unsafeLatest=await connection.getLatestBlockhash("confirmed");
      const unsafeV0=v0Helpers.buildLaunchpadV0Transaction(web3,{payer:admin,recentBlockhash:unsafeLatest.blockhash,instructions:unsafeInstructions,lookupTableAccounts:[lookupTableAccount]});
      unsafeV0.sign([adminKeypair,nftMint]);
      const unsafeSig=await connection.sendRawTransaction(unsafeV0.serialize(),{skipPreflight:true,maxRetries:5});
      const unsafeConfirmation=await connection.confirmTransaction({signature:unsafeSig,blockhash:unsafeLatest.blockhash,lastValidBlockHeight:unsafeLatest.lastValidBlockHeight},"confirmed");
      assert.ok(unsafeConfirmation.value.err,"unsafe stable quote must fail closed and remain pending");
      const pendingCampaign=decodeCampaign((await connection.getAccountInfo(campaignAccounts.campaign,"confirmed")).data);
      assert.equal(pendingCampaign.graduated,false,"unsafe stable must leave campaign pending");
      assert.equal(await connection.getAccountInfo(graduationState,"confirmed"),null,"unsafe stable must roll back graduation state");
      assert.equal(await connection.getAccountInfo(pool,"confirmed"),null,"unsafe stable must roll back Meteora pool creation");
      const pendingAuthorityQuote=await getAccount(connection,authorityQuote.address,"confirmed");
      assert.equal(BigInt(pendingAuthorityQuote.amount.toString()),0n,"unsafe stable must roll back quote acquisition");
      const pendingSource=await getAccount(connection,acquisitionSource,"confirmed");
      assert.equal(BigInt(pendingSource.amount.toString()),acquired,"unsafe stable must preserve acquisition source on rollback");
      console.log(`[basic-grad-local] mode=stable GRADUATION_PENDING_QUOTE_UNSAFE signature=${unsafeSig}`);
    }
    const latest=await connection.getLatestBlockhash("confirmed"); const versioned=v0Helpers.buildLaunchpadV0Transaction(web3,{payer:admin,recentBlockhash:latest.blockhash,instructions,lookupTableAccounts:[lookupTableAccount]});'''
          s = s.replace(marker, pending, 1)
          p.write_text(s)
          PY
          node --check tests/solana/v4-lifecycle-acceptance.cjs

      - name: Run native and canonical-stable graduation on fresh disposable validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          for mode in native stable; do
            ledger="/tmp/agent2-${mode}-ledger"
            rm -rf "$ledger"
            solana-test-validator --reset --quiet --ledger "$ledger" --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so --bpf-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG third_party/meteora/cp_amm.so --account-dir third_party/meteora/accounts >"/tmp/agent2-${mode}-validator.log" 2>&1 &
            pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            for i in $(seq 1 60); do
              solana cluster-version --url "$LOCAL_RPC" >/dev/null 2>&1 && break
              if [ "$i" -eq 60 ]; then cat "/tmp/agent2-${mode}-validator.log"; exit 1; fi
              sleep 2
            done
            solana config set --url "$LOCAL_RPC" --keypair "$ANCHOR_WALLET" >/dev/null
            solana airdrop 100 >/dev/null
            (cd tests/solana && BASIC_GRAD_QUOTE_MODE="$mode" ANCHOR_PROVIDER_URL="$LOCAL_RPC" ANCHOR_WALLET="$ANCHOR_WALLET" GATE_K_METEORA=1 npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs)
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            trap - EXIT
          done
