name: Agent 2 99d1 Local BASIC Quote Acceptance

on:
  push:
    branches:
      - cert/agent2-99d1-local-quotes

permissions:
  contents: read

env:
  CANDIDATE_SHA: 99d1d5befc814d60342d553d08eb5a871c5570dd
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_TOOLCHAIN: nightly-2024-05-09
  LOCAL_RPC: http://127.0.0.1:8899

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          d="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$d"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error -o /tmp/solana.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$d" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$d" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build candidate and IDL
        shell: bash
        run: |
          set -euo pipefail
          anchor build --program-name memewarzone_solana --no-idl
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
          npm install --prefix tests/solana --no-audit --no-fund
          npm install --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/solana/fetch-pinned-meteora-cp-amm.mjs --with-accounts
      - name: Adapt lifecycle harness to authorization schema v4 and BASIC quote mode
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/solana/v4-lifecycle-acceptance.cjs')
          s=p.read_text()
          s=s.replace('  createAssociatedTokenAccountInstruction,\n} = require("@solana/spl-token");', '  createAssociatedTokenAccountInstruction,\n  createAccount,\n  createMint,\n  createTransferInstruction,\n  getOrCreateAssociatedTokenAccount,\n  mintTo,\n} = require("@solana/spl-token");')
          s=s.replace('const GRADUATION_AUTH_SCHEMA_VERSION = 2;', 'const GRADUATION_AUTH_SCHEMA_VERSION = 4;')
          old=re.compile(r'  function graduationDigest\(input\) \{.*?\n  \}\n\n\n\n  it\("begin_graduation our-side simulates without stack overflow \(no Meteora LP\)"', re.S)
