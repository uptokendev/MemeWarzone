name: Solana import metadata v2 diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/scripts/diagnose-solana-import-metadata-v2.mjs
      - .github/workflows/solana-import-metadata-v2-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Probe INCOME PISSIN TOEZ metadata
        env:
          SOLANA_RPC_URL: ${{ vars.SOLANA_MAINNET_RPC || vars.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: node frontend/scripts/diagnose-solana-import-metadata-v2.mjs
