name: Solana live binary authority recovery

on:
  push:
    branches:
      - cert/solana-live-binary-authority-recovery
  workflow_dispatch:

permissions:
  contents: read

env:
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  SOLANA_VERSION: 1.18.26
  ANCHOR_VERSION: 0.30.1
  RUST_TOOLCHAIN: 1.79.0
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  room_a:
    name: Candidate clean room A
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      bytes: ${{ steps.hash.outputs.bytes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install frozen toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build candidate in isolated room A
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          test ! -d target
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mwz-room-a"
          rm -rf "$CARGO_TARGET_DIR" "$HOME/.cargo/registry/src" || true
          mkdir -p "$CARGO_TARGET_DIR"
          anchor build --program-name memewarzone_solana --no-idl
          so="$CARGO_TARGET_DIR/deploy/memewarzone_solana.so"
          test -s "$so"
          sha="$(sha256sum "$so" | awk '{print $1}')"
          bytes="$(wc -c < "$so" | tr -d ' ')"
          echo "ROOM_A_SHA=$sha"
          echo "ROOM_A_BYTES=$bytes"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          mkdir -p target/deploy target/idl
          cp "$so" target/deploy/memewarzone_solana.so
          (
            cd programs/memewarzone_solana
            RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json
          )
          test -s target/idl/memewarzone_solana.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-room-a
          path: |
            target/deploy/memewarzone_solana.so
            target/idl/memewarzone_solana.json
          if-no-files-found: error
          retention-days: 3

  room_b:
    name: Candidate clean room B
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
      bytes: ${{ steps.hash.outputs.bytes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install frozen toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
      - name: Build candidate in isolated room B
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          test ! -d target
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mwz-room-b"
          rm -rf "$CARGO_TARGET_DIR" "$HOME/.cargo/registry/src" || true
          mkdir -p "$CARGO_TARGET_DIR"
          anchor build --program-name memewarzone_solana --no-idl
          so="$CARGO_TARGET_DIR/deploy/memewarzone_solana.so"
          test -s "$so"
          sha="$(sha256sum "$so" | awk '{print $1}')"
          bytes="$(wc -c < "$so" | tr -d ' ')"
          echo "ROOM_B_SHA=$sha"
          echo "ROOM_B_BYTES=$bytes"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

  dual_clean_room_match:
    name: Require dual clean-room identity
    runs-on: ubuntu-latest
    needs: [room_a, room_b]
    steps:
      - name: Compare room outputs
        shell: bash
        env:
          A_SHA: ${{ needs.room_a.outputs.sha256 }}
          A_BYTES: ${{ needs.room_a.outputs.bytes }}
          B_SHA: ${{ needs.room_b.outputs.sha256 }}
          B_BYTES: ${{ needs.room_b.outputs.bytes }}
        run: |
          set -euo pipefail
          echo "ROOM_A=$A_SHA/$A_BYTES"
          echo "ROOM_B=$B_SHA/$B_BYTES"
          test -n "$A_SHA" && test -n "$B_SHA"
          test "$A_SHA" = "$B_SHA"
          test "$A_BYTES" = "$B_BYTES"
          echo "DUAL_CLEAN_ROOM_MATCH=YES"

  live_authority:
    name: Re-read and dump live mainnet program
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rpc: ${{ steps.live.outputs.rpc }}
      programdata: ${{ steps.live.outputs.programdata }}
      authority: ${{ steps.live.outputs.authority }}
      sha256: ${{ steps.live.outputs.sha256 }}
      bytes: ${{ steps.live.outputs.bytes }}
      available: ${{ steps.live.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Re-read live ProgramData, authority, binary
        id: live
        shell: bash
        run: |
          set -u
          rm -f /tmp/live-program.json /tmp/live.so
          rpc_used=""
          for rpc in \
            "https://api.mainnet-beta.solana.com" \
            "https://solana-rpc.publicnode.com" \
            "https://rpc.ankr.com/solana"; do
            echo "Trying $rpc"
            if solana program show "$PROGRAM_ID" --url "$rpc" --output json > /tmp/live-program.json 2>/tmp/live-show.err \
              && solana program dump "$PROGRAM_ID" /tmp/live.so --url "$rpc" 2>/tmp/live-dump.err \
              && [ -s /tmp/live.so ]; then
              rpc_used="$rpc"
              break
            fi
            cat /tmp/live-show.err /tmp/live-dump.err 2>/dev/null || true
            rm -f /tmp/live-program.json /tmp/live.so
          done
          if [ -z "$rpc_used" ]; then
            echo "available=NO" >> "$GITHUB_OUTPUT"
            echo "LIVE_AUDIT_AVAILABLE=NO"
            exit 0
          fi
          cat /tmp/live-program.json
          programdata="$(node -e 'const x=require("/tmp/live-program.json"); process.stdout.write(String(x.programdataAddress||x.programDataAddress||""))')"
          authority="$(node -e 'const x=require("/tmp/live-program.json"); process.stdout.write(String(x.authority||x.upgradeAuthority||""))')"
          sha="$(sha256sum /tmp/live.so | awk '{print $1}')"
          bytes="$(wc -c < /tmp/live.so | tr -d ' ')"
          echo "LIVE_PROGRAM=$PROGRAM_ID"
          echo "LIVE_PROGRAMDATA=$programdata"
          echo "LIVE_UPGRADE_AUTHORITY=$authority"
          echo "LIVE_SBF_SHA=$sha"
          echo "LIVE_SIZE=$bytes"
          echo "rpc=$rpc_used" >> "$GITHUB_OUTPUT"
          echo "programdata=$programdata" >> "$GITHUB_OUTPUT"
          echo "authority=$authority" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "available=YES" >> "$GITHUB_OUTPUT"
      - name: Search current repository/history for live provenance markers
        if: steps.live.outputs.available == 'YES'
        shell: bash
        env:
          LIVE_SHA: ${{ steps.live.outputs.sha256 }}
          LIVE_PROGRAMDATA: ${{ steps.live.outputs.programdata }}
          LIVE_AUTHORITY: ${{ steps.live.outputs.authority }}
        run: |
          set +e
          echo "=== current tree exact live SHA references ==="
          git grep -n "$LIVE_SHA" HEAD
          echo "=== history commits adding/removing exact live SHA ==="
          git log --all --oneline -S"$LIVE_SHA" -- .
          echo "=== current tree ProgramData references ==="
          git grep -n "$LIVE_PROGRAMDATA" HEAD
          echo "=== history ProgramData references ==="
          git log --all --oneline -S"$LIVE_PROGRAMDATA" -- .
          echo "=== current tree upgrade-authority references ==="
          git grep -n "$LIVE_AUTHORITY" HEAD
          echo "=== history upgrade-authority references ==="
          git log --all --oneline -S"$LIVE_AUTHORITY" -- .
          exit 0
      - uses: actions/upload-artifact@v4
        if: steps.live.outputs.available == 'YES'
        with:
          name: live-mainnet-sbf
          path: |
            /tmp/live.so
            /tmp/live-program.json
          if-no-files-found: error
          retention-days: 3

  golden_candidate:
    name: Candidate golden CREATE BUY SELL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [room_a, dual_clean_room_match]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: candidate-room-a
          path: target
      - name: Normalize downloaded paths
        shell: bash
        run: |
          set -euo pipefail
          find target -maxdepth 4 -type f -print
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
      - name: Install Solana CLI and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --prefix tests/solana --no-audit --no-fund
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
      - name: Run candidate CREATE
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-create-ledger
          solana-test-validator --reset --quiet --ledger /tmp/mwz-create-ledger \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so >/tmp/create-validator.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do solana cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && { tail -n 200 /tmp/create-validator.log; exit 1; }; sleep 2; done
          solana config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" npx mocha --timeout 1000000 v4-create-acceptance.cjs)
          echo "CREATE=PASS"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Run candidate BUY SELL golden lifecycle only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-trade-ledger
          solana-test-validator --reset --quiet --ledger /tmp/mwz-trade-ledger \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so >/tmp/trade-validator.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do solana cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && { tail -n 200 /tmp/trade-validator.log; exit 1; }; sleep 2; done
          solana config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" \
            npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs \
            --grep 'create → buy → buy → sell → buy → sell → close curve on the compiled SBF')
          echo "BUY=PASS"
          echo "SELL=PASS"

  golden_live:
    name: Live dumped SBF golden CREATE BUY SELL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [room_a, live_authority]
    if: needs.live_authority.outputs.available == 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: candidate-room-a
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: live-mainnet-sbf
          path: live
      - name: Normalize live binary and current IDL
        shell: bash
        run: |
          set -euo pipefail
          find candidate live -maxdepth 4 -type f -print
          mkdir -p target/deploy target/idl
          cp live/live.so target/deploy/memewarzone_solana.so
          cp candidate/idl/memewarzone_solana.json target/idl/memewarzone_solana.json
          test -s target/deploy/memewarzone_solana.so
          test -s target/idl/memewarzone_solana.json
      - name: Install Solana CLI and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$HOME/.local/share/solana/install/releases/v${SOLANA_VERSION}"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output /tmp/solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release_dir" --strip-components=1
          mkdir -p "$HOME/.local/share/solana/install"
          ln -sfn "$release_dir" "$HOME/.local/share/solana/install/active_release"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          npm install --prefix tests/solana --no-audit --no-fund
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"
          echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
      - name: Run live CREATE
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-live-create-ledger
          solana-test-validator --reset --quiet --ledger /tmp/mwz-live-create-ledger \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so >/tmp/live-create-validator.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do solana cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && { tail -n 200 /tmp/live-create-validator.log; exit 1; }; sleep 2; done
          solana config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" npx mocha --timeout 1000000 v4-create-acceptance.cjs)
          echo "LIVE_CREATE=PASS"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Run live BUY SELL golden lifecycle only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mwz-live-trade-ledger
          solana-test-validator --reset --quiet --ledger /tmp/mwz-live-trade-ledger \
            --bpf-program "$PROGRAM_ID" target/deploy/memewarzone_solana.so >/tmp/live-trade-validator.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do solana cluster-version --url "$ANCHOR_PROVIDER_URL" >/dev/null 2>&1 && break; [ "$i" -eq 90 ] && { tail -n 200 /tmp/live-trade-validator.log; exit 1; }; sleep 2; done
          solana config set --url "$ANCHOR_PROVIDER_URL" --keypair "$ANCHOR_WALLET" >/dev/null
          solana airdrop 100 >/dev/null
          (cd tests/solana && ANCHOR_PROVIDER_URL="$ANCHOR_PROVIDER_URL" ANCHOR_WALLET="$ANCHOR_WALLET" \
            npx mocha --timeout 1000000 v4-lifecycle-acceptance.cjs \
            --grep 'create → buy → buy → sell → buy → sell → close curve on the compiled SBF')
          echo "LIVE_BUY=PASS"
          echo "LIVE_SELL=PASS"

  summary:
    name: Authority recovery summary
    runs-on: ubuntu-latest
    if: always()
    needs: [room_a, room_b, dual_clean_room_match, live_authority, golden_candidate, golden_live]
    steps:
      - name: Emit evidence summary
        shell: bash
        env:
          A_RESULT: ${{ needs.room_a.result }}
          B_RESULT: ${{ needs.room_b.result }}
          DUAL_RESULT: ${{ needs.dual_clean_room_match.result }}
          LIVE_RESULT: ${{ needs.live_authority.result }}
          CANDIDATE_GOLDEN: ${{ needs.golden_candidate.result }}
          LIVE_GOLDEN: ${{ needs.golden_live.result }}
          CANDIDATE_SHA: ${{ needs.room_a.outputs.sha256 }}
          CANDIDATE_BYTES: ${{ needs.room_a.outputs.bytes }}
          LIVE_AVAILABLE: ${{ needs.live_authority.outputs.available }}
          LIVE_PROGRAMDATA: ${{ needs.live_authority.outputs.programdata }}
          LIVE_AUTHORITY: ${{ needs.live_authority.outputs.authority }}
          LIVE_SHA: ${{ needs.live_authority.outputs.sha256 }}
          LIVE_BYTES: ${{ needs.live_authority.outputs.bytes }}
        run: |
          echo "ROOM_A_RESULT=$A_RESULT"
          echo "ROOM_B_RESULT=$B_RESULT"
          echo "DUAL_RESULT=$DUAL_RESULT"
          echo "LIVE_AUDIT_RESULT=$LIVE_RESULT"
          echo "CANDIDATE_GOLDEN_RESULT=$CANDIDATE_GOLDEN"
          echo "LIVE_GOLDEN_RESULT=$LIVE_GOLDEN"
          echo "CANDIDATE_SBF_SHA=$CANDIDATE_SHA"
          echo "CANDIDATE_SIZE=$CANDIDATE_BYTES"
          echo "LIVE_AVAILABLE=$LIVE_AVAILABLE"
          echo "LIVE_PROGRAM=$PROGRAM_ID"
          echo "LIVE_PROGRAMDATA=$LIVE_PROGRAMDATA"
          echo "LIVE_UPGRADE_AUTHORITY=$LIVE_AUTHORITY"
          echo "LIVE_SBF_SHA=$LIVE_SHA"
          echo "LIVE_SIZE=$LIVE_BYTES"
