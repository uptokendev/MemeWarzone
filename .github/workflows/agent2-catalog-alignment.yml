name: Agent 2 Catalog Alignment

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align Agent 2 with Agent 1 catalog authority
        shell: python
        run: |
          from pathlib import Path

          catalog = Path('frontend/api/lib/quoteAssetCatalog.js')
          s = catalog.read_text()
          s = s.replace(
              '    policy: {\n      authority: "generic",\n      policyKey: authority.policyKey,\n      version: authority.policyVersion,\n      active: authority.policyActive,\n      basicApproved: authority.basicApproved,\n    },',
              '    policy: {\n      id: row.policy_version_id,\n      authority: "generic",\n      policyKey: authority.policyKey,\n      version: authority.policyVersion,\n      active: authority.policyActive,\n      basicApproved: authority.basicApproved,\n      config: row.policy_config || {},\n    },'
          )
          s = s.replace(
              '  pv.require_market_healthy\nfrom public.quote_asset_deployments d',
              '  pv.require_market_healthy,\n  pv.policy_config\nfrom public.quote_asset_deployments d'
          )
          if 'config: row.policy_config || {}' not in s or 'pv.policy_config' not in s:
              raise SystemExit('quoteAssetCatalog alignment patch did not apply')
          catalog.write_text(s)

          auth = Path('frontend/api/dev-fix/solana-graduation-authorization-v2.js')
          s = auth.read_text()
          s = s.replace(
              'import { getSolanaChainUnixTime } from "./solana-chain-unix-time.js";\n',
              'import { getSolanaChainUnixTime } from "./solana-chain-unix-time.js";\nimport { getGraduationQuoteAssetDetail } from "../lib/quoteAssetCatalog.js";\n'
          )
          marker = '''function configHash(configId) {\n  return crypto.createHash("sha256").update(String(configId), "utf8").digest();\n}\n'''
          helper = r'''function configHash(configId) {
  return crypto.createHash("sha256").update(String(configId), "utf8").digest();
}

const PROVIDER_CLASS = Object.freeze({
  NATIVE: 0,
  BASIC: 1,
  PROVIDER_RWA: 2,
  MWZ_NATIVE: 3,
  COMMUNITY: 4,
});

function profileForAssetClass(assetClass) {
  const value = QUOTE_PROFILE[String(assetClass || "").trim().toUpperCase()];
  if (!Number.isInteger(value)) {
    throw new SolanaGraduationAuthorizationError(`Unsupported quote asset class ${assetClass}.`, {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  return value;
}

function providerClassCode(providerClass) {
  const value = PROVIDER_CLASS[String(providerClass || "").trim().toUpperCase()];
  if (!Number.isInteger(value)) {
    throw new SolanaGraduationAuthorizationError(`Unsupported quote provider class ${providerClass}.`, {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  return value;
}

function catalogBindingHash(item) {
  const policy = item.policy || {};
  const provider = item.provider || {};
  const fields = [
    item.id,
    item.assetId,
    provider.id,
    provider.key,
    provider.providerClass,
    item.chainId,
    item.identityKind,
    item.contractAddressOrMint,
    item.stateVersion,
    policy.id,
    policy.policyKey,
    policy.version,
  ];
  return crypto.createHash("sha256").update(fields.map((v) => String(v ?? "")).join("\u0000"), "utf8").digest();
}

async function resolveCatalogQuoteConfig({ chainId, quoteConfigId }) {
  let detail;
  try {
    detail = await getGraduationQuoteAssetDetail(quoteConfigId);
  } catch (error) {
    throw new SolanaGraduationAuthorizationError("Quote Asset Catalog is unavailable.", {
      code: "SOLANA_GRADUATION_QUOTE_CATALOG_UNAVAILABLE",
      httpStatus: 503,
      cause: error,
    });
  }
  const item = detail?.item;
  if (!item || String(item.id) !== String(quoteConfigId)) {
    throw new SolanaGraduationAuthorizationError("Requested quote configuration is not present in the authoritative catalog.", {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  if (String(item.chainId) !== String(chainId) || item.newGraduationEligible !== true) {
    throw new SolanaGraduationAuthorizationError("Requested quote configuration is not approved for new graduation.", {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  if (item.policy?.authority !== "generic" || item.policy?.active !== true || item.policy?.basicApproved !== true) {
    throw new SolanaGraduationAuthorizationError("Requested quote policy is not an active BASIC generic policy.", {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  const profile = profileForAssetClass(item.assetClass);
  if (isTruthy(process.env.SOLANA_GRADUATION_BASIC_RELEASE_ONLY, true) && ![QUOTE_PROFILE.NATIVE, QUOTE_PROFILE.STABLECOIN].includes(profile)) {
    throw new SolanaGraduationAuthorizationError("BASIC release permits only native SOL and one approved canonical stablecoin.", {
      code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED",
      httpStatus: 409,
    });
  }
  const route = item.policy?.config?.solanaGraduation || {};
  const quoteMint = publicKeyString(route.quoteMint || (item.identityKind === "SOLANA_MINT" ? item.contractAddressOrMint : NATIVE_MINT), "authoritative quote mint");
  if (profile === QUOTE_PROFILE.NATIVE) {
    if (item.identityKind !== "NATIVE" || !samePublicKey(quoteMint, NATIVE_MINT)) {
      throw new SolanaGraduationAuthorizationError("Native catalog identity must resolve exactly to WSOL for graduation.", { code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED", httpStatus: 409 });
    }
  } else if (item.identityKind !== "SOLANA_MINT" || !samePublicKey(item.contractAddressOrMint, quoteMint)) {
    throw new SolanaGraduationAuthorizationError("Catalog deployment mint does not match its configured graduation quote mint.", { code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED", httpStatus: 409 });
  }
  const maxSlippageBps = Number(route.maxSlippageBps ?? DEFAULT_SLIPPAGE_BPS);
  const maxImpactBps = Number(route.maxImpactBps ?? 100);
  const maxDeviationBps = Number(route.maxDeviationBps ?? 100);
  if (maxSlippageBps < 0 || maxSlippageBps > ABSOLUTE_MAX_SLIPPAGE_BPS) failUnsafe("Catalog slippage policy exceeds the absolute Solana limit.");
  if (maxImpactBps < 0 || maxImpactBps > ABSOLUTE_MAX_IMPACT_BPS) failUnsafe("Catalog impact policy exceeds the absolute Solana limit.");
  if (maxDeviationBps < 0 || maxDeviationBps > ABSOLUTE_MAX_DEVIATION_BPS) failUnsafe("Catalog deviation policy exceeds the absolute Solana limit.");
  return {
    id: String(item.id),
    bindingHash: catalogBindingHash(item),
    assetId: item.assetId,
    providerId: item.provider?.id,
    providerKey: item.provider?.key,
    providerClassName: item.provider?.providerClass,
    policyId: item.policy?.id,
    policyKey: item.policy?.policyKey,
    stateVersion: Number(item.stateVersion || 0),
    mint: quoteMint,
    policyVersion: parsePositiveInteger(item.policy?.version, 1, 65_535),
    profile,
    providerClass: providerClassCode(item.provider?.providerClass),
    decimals: Number(route.decimals ?? (profile === QUOTE_PROFILE.NATIVE ? 9 : 0)),
    acquisitionProgram: publicKeyString(route.acquisitionProgram || SYSTEM_PROGRAM_ID, "acquisitionProgram"),
    recoveryAccount: SYSTEM_PROGRAM_ID,
    activeInBasicRelease: true,
    maxSlippageBps,
    maxImpactBps,
    maxDeviationBps,
    quoteUsdMicros: route.referenceUsdMicros == null ? null : BigInt(route.referenceUsdMicros),
    binanceSymbol: String(route.binanceSymbol || "").trim(),
    coinGeckoId: String(route.coinGeckoId || "").trim(),
    jupiterApiBase: String(route.jupiterApiBase || process.env.SOLANA_GRADUATION_JUPITER_API_BASE || "https://lite-api.jup.ag/swap/v1").replace(/\/$/, ""),
  };
}
'''
          if marker not in s:
              raise SystemExit('configHash marker not found')
          s = s.replace(marker, helper, 1)
          old = '''    const catalog = parseQuoteCatalog();\n    const requestedConfigId = String(body.quoteConfigId || "SOL_NATIVE_V1").trim();\n    const quoteConfig = catalog.find((entry) => entry.id === requestedConfigId && entry.activeInBasicRelease);\n    if (!quoteConfig) throw new SolanaGraduationAuthorizationError("Requested quote configuration is not approved for new graduation.", { code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED", httpStatus: 409 });\n'''
          new = '''    const requestedConfigId = String(body.quoteConfigId || process.env.SOLANA_GRADUATION_NATIVE_QUOTE_CONFIG_ID || "").trim();\n    if (!requestedConfigId) throw new SolanaGraduationAuthorizationError("quoteConfigId is required and must be an authoritative Quote Asset Catalog deployment id.", { code: "SOLANA_GRADUATION_QUOTE_NOT_APPROVED", httpStatus: 400 });\n    const quoteConfig = await resolveCatalogQuoteConfig({ chainId, quoteConfigId: requestedConfigId });\n'''
          if old not in s:
              raise SystemExit('legacy catalog selection block not found')
          s = s.replace(old, new, 1)
          s = s.replace('    const quoteConfigHash = configHash(quoteConfig.id);', '    const quoteConfigHash = quoteConfig.bindingHash || configHash(quoteConfig.id);')
          s = s.replace(
              '    const [oraclePriceUsdMicros, quoteReferenceUsdMicros] = await Promise.all([fetchSolUsdMicros(), fetchQuoteUsdMicros(quoteConfig)]);',
              '    if (quoteConfig.profile !== QUOTE_PROFILE.NATIVE) {\n      quoteConfig.recoveryAccount = deriveAta(authorityAddress, quoteConfig.mint);\n      const mintData = await getAccountData(rpcUrl, quoteConfig.mint, TOKEN_PROGRAM_ID, "Quote mint");\n      if (mintData.length < 45) failUnsafe("Quote mint account is too short.");\n      const chainDecimals = mintData.readUInt8(44);\n      if (quoteConfig.decimals && quoteConfig.decimals !== chainDecimals) failUnsafe("Catalog quote decimals do not match the mint account.");\n      quoteConfig.decimals = chainDecimals;\n    }\n    const [oraclePriceUsdMicros, quoteReferenceUsdMicros] = await Promise.all([fetchSolUsdMicros(), fetchQuoteUsdMicros(quoteConfig)]);'
          )
          s = s.replace(
              'quote: { configId: quoteConfig.id, configHashHex:',
              'quote: { configId: quoteConfig.id, assetId: quoteConfig.assetId, providerId: quoteConfig.providerId, providerKey: quoteConfig.providerKey, providerClassName: quoteConfig.providerClassName, policyId: quoteConfig.policyId, policyKey: quoteConfig.policyKey, stateVersion: quoteConfig.stateVersion, configHashHex:'
          )
          if 'getGraduationQuoteAssetDetail' not in s or 'catalogBindingHash' not in s or 'providerKey: quoteConfig.providerKey' not in s:
              raise SystemExit('authorization catalog alignment patch incomplete')
          auth.write_text(s)

          workflow = Path('.github/workflows/agent2-certify.yml')
          s = workflow.read_text()
          s = s.replace('BASE_SHA: e0a3107a77fb2b3ce066de6b3bd305a6018bdc14', 'BASE_SHA: 0204c4a47555a747b95e7c80deb113d36f91e491')
          s = s.replace('          cargo fmt --all -- --check\n          cargo test -p memewarzone_solana --lib', '          cargo fmt --manifest-path programs/memewarzone_solana/Cargo.toml -- --check\n          cargo test -p memewarzone_solana --lib')
          s = s.replace('          anchor build --program-name memewarzone_solana --no-idl\n          test -s target/deploy/memewarzone_solana.so', '          anchor build --program-name memewarzone_solana\n          test -s target/deploy/memewarzone_solana.so\n          test -s target/idl/memewarzone_solana.json\n          node -e "const i=require(\'./target/idl/memewarzone_solana.json\'); const n=new Set((i.instructions||[]).map(x=>x.name)); if(!n.has(\'beginGraduation\')||!n.has(\'confirmGraduation\')) process.exit(1)"', 1)
          workflow.write_text(s)
      - name: Syntax check aligned files
        run: |
          node --check frontend/api/lib/quoteAssetCatalog.js
          node --check frontend/api/dev-fix/solana-graduation-authorization-v2.js
      - name: Commit alignment and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent2-catalog-alignment.yml
          git add frontend/api/lib/quoteAssetCatalog.js frontend/api/dev-fix/solana-graduation-authorization-v2.js .github/workflows/agent2-certify.yml
          git commit -m 'fix(solana): bind graduation authorization to quote catalog authority'
          git push origin HEAD:agent2/solana-basic-graduation-market
