name: Agent 2 Runner Quote Config Fix

on:
  push:
    branches:
      - agent2/solana-basic-graduation-market

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent2/solana-basic-graduation-market
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove legacy quoteConfigId fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/solana-meteora-graduation/graduate-basic-quote.mjs')
          s=p.read_text()
          old='  const quoteConfigId = String(process.env.SOLANA_GRADUATION_QUOTE_CONFIG_ID || "SOL_NATIVE_V1").trim();'
          new='  const quoteConfigId = String(process.env.SOLANA_GRADUATION_QUOTE_CONFIG_ID || "").trim(); if (!quoteConfigId) fail("SOLANA_GRADUATION_QUOTE_CONFIG_ID is required and must be an authoritative Quote Asset Catalog deployment id");'
          if old not in s:
              raise SystemExit('legacy quote config fallback not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tools/solana-meteora-graduation/graduate-basic-quote.mjs
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/solana-meteora-graduation/graduate-basic-quote.mjs
          git commit -m 'fix(solana): require catalog deployment id for graduation runner'
          git push origin HEAD:agent2/solana-basic-graduation-market
