name: Agent 2 PR289 final funded golden

on:
  push:
    branches:
      - cert/agent2-pr289-final-exact-head-20260911
    paths:
      - .github/workflows/agent2-pr289-final-funded-golden.yml

permissions:
  contents: read

env:
  BASE_SHA: 120401fd1fde0dce6e2439fc4156840e029f1ae6
  PR_HEAD: f18505e39186a5fa73fd89f00b242b94782f2f2c
  PROGRAM_ID: 3JSGNiFstsSQEd98GUJduBnceXNg8kh2qWg7zEeZfmBt
  APPROVED_OPERATOR: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  APPROVED_ROUTE_SIGNER: 7hKQd798Z1ERmRUhm7shmstB1V13FQNnDLqtYjZBuJUz
  REUSABLE_ALT: ALA7wQRuPdHWzLLpyDwbw7kPbJB7pCp1zNyzrNZApoiA
  RECLAIMABLE_ALT: EdNwQtwKnVHPBe7rSBuUnGxD9StmWcUDK2AHNbDauMoL
  IDL_RUST_TOOLCHAIN: nightly-2024-05-09
  ANCHOR_VERSION: 0.30.1

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
      SOLANA_DEVNET_PAYER: ${{ secrets.SOLANA_DEVNET_PAYER }}
      SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY: ${{ secrets.SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freeze exact clean production head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | tr '\n' ' ')" = "tools/solana-meteora-graduation/graduate-basic-quote.mjs "
          test "$(git diff --numstat "$BASE_SHA"..HEAD -- tools/solana-meteora-graduation/graduate-basic-quote.mjs)" = $'5\t1\ttools/solana-meteora-graduation/graduate-basic-quote.mjs'
          test -z "$(git diff --name-only "$BASE_SHA"..HEAD -- programs/memewarzone_solana programs/mwz_rewards_treasury)"
          echo "EXACT_CLEAN_HEAD=YES"
          echo "PROGRAMS_UNCHANGED=YES"
      - name: Install exact-head runtime dependencies and IDL toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/solana --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm install --global --silent "@coral-xyz/anchor-cli@${ANCHOR_VERSION}"
          rustup toolchain install "$IDL_RUST_TOOLCHAIN" --profile minimal
          mkdir -p target/idl
          (cd programs/memewarzone_solana && RUSTUP_TOOLCHAIN="$IDL_RUST_TOOLCHAIN" anchor idl build --out ../../target/idl/memewarzone_solana.json)
          test -s target/idl/memewarzone_solana.json
          test ! -e target/deploy/memewarzone_solana.so
      - name: Materialize only approved devnet authority paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOLANA_DEVNET_PAYER:-}"
          test -n "${SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY:-}"
          operator_file="$RUNNER_TEMP/operator.json"
          route_file="$RUNNER_TEMP/route.json"
          SOLANA_GRADUATION_OPERATOR_KEYPAIR="$operator_file" node scripts/solana/materialize-devnet-payer.mjs >/dev/null
          ROUTE_FILE="$route_file" python3 - <<'PY'
          import json, os
          value=json.loads(os.environ['SOLANA_DEVNET_ROUTE_SIGNER_SECRET_KEY'])
          if not isinstance(value,list) or len(value)!=64: raise SystemExit('route signer must be 64-byte array')
          with open(os.environ['ROUTE_FILE'],'w',encoding='utf-8') as h: json.dump(value,h)
          os.chmod(os.environ['ROUTE_FILE'],0o600)
          PY
          echo "SOLANA_OPERATOR_KEYPAIR=$operator_file" >> "$GITHUB_ENV"
          echo "SOLANA_NEW_ROUTE_SIGNER_KEYPAIR=$route_file" >> "$GITHUB_ENV"
      - name: Verify identities, devnet, reusable ALT, creator capacity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const anchor=require('./tests/solana/node_modules/@coral-xyz/anchor');
          const {Connection,Keypair,PublicKey}=require('./tests/solana/node_modules/@solana/web3.js');
          const operator=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_OPERATOR_KEYPAIR,'utf8'))));
          const route=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_NEW_ROUTE_SIGNER_KEYPAIR,'utf8'))));
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          const pid=new PublicKey(process.env.PROGRAM_ID);
          const pda=(...seeds)=>PublicKey.findProgramAddressSync(seeds.map(x=>Buffer.isBuffer(x)?x:Buffer.from(x)),pid)[0];
          (async()=>{
            if((await c.getGenesisHash())!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error('not devnet');
            if(operator.publicKey.toBase58()!==process.env.APPROVED_OPERATOR) throw new Error('operator not approved');
            if(route.publicKey.toBase58()!==process.env.APPROVED_ROUTE_SIGNER) throw new Error('route signer mismatch');
            const idl=JSON.parse(fs.readFileSync('target/idl/memewarzone_solana.json','utf8'));
            const provider=new anchor.AnchorProvider(c,new anchor.Wallet(operator),{commitment:'confirmed',preflightCommitment:'confirmed'}); anchor.setProvider(provider);
            const program=new anchor.Program(idl,provider);
            if(!program.programId.equals(pid)) throw new Error('IDL program mismatch');
            const global=await program.account.globalConfig.fetch(pda(Buffer.from('global')));
            if(!new PublicKey(global.admin).equals(operator.publicKey)) throw new Error('operator not GlobalConfig admin');
            if(!new PublicKey(global.routeSigner).equals(route.publicKey)) throw new Error('route signer not current GlobalConfig signer');
            const profileKey=pda(Buffer.from('creator'),operator.publicKey.toBuffer());
            const riskKey=pda(Buffer.from('risk'),operator.publicKey.toBuffer());
            const profile=await program.account.creatorProfile.fetch(profileKey);
            const risk=await program.account.riskProfile.fetch(riskKey);
            const manifest=JSON.parse(fs.readFileSync('config/solana/devnet-generation-v3.json','utf8'));
            const crypto=require('crypto'); const clusterId=crypto.createHash('sha256').update(manifest.riskClusterIdSeed).digest();
            if(!Buffer.from(risk.clusterId).equals(clusterId)) throw new Error('operator risk cluster != active manifest cluster');
            if(profile.restricted||profile.manualReviewRequired) throw new Error('operator creator profile restricted/review');
            if(Number(profile.liveBondingCount)>=Number(profile.maxLiveCampaigns)) throw new Error(`operator at live campaign cap ${profile.liveBondingCount}/${profile.maxLiveCampaigns}`);
            const alt=(await c.getAddressLookupTable(new PublicKey(process.env.REUSABLE_ALT))).value;
            if(!alt) throw new Error('reusable ALT missing');
            const required=[pid,pda(Buffer.from('global')),new PublicKey('Ed25519SigVerify111111111111111111111111111'),new PublicKey('ComputeBudget111111111111111111111111111111'),new PublicKey('Sysvar1nstructions1111111111111111111111111'),new PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA'),new PublicKey('ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL'),new PublicKey('11111111111111111111111111111111'),new PublicKey('2NzthKEZHtbnqXxT4eeEnEQRHkQsdqgqVsfzcCCoZBKX')];
            const missing=required.filter(k=>!alt.state.addresses.some(x=>x.equals(k)));
            if(missing.length) throw new Error(`reusable ALT missing required addresses ${missing.map(x=>x.toBase58())}`);
            const balance=await c.getBalance(operator.publicKey,'confirmed');
            console.log('APPROVED_OPERATOR',operator.publicKey.toBase58());
            console.log('OPERATOR_BALANCE_PRE_RECLAIM',balance);
            console.log('CREATOR_PROFILE_LIVE',Number(profile.liveBondingCount),'MAX',Number(profile.maxLiveCampaigns),'TOTAL',profile.totalLaunches.toString());
            console.log('REUSABLE_ALT',alt.key.toBase58(),'ADDRESSES',alt.state.addresses.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Reclaim only the previously verified Agent-2 disposable ALT
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const {Connection,Keypair,PublicKey,Transaction,AddressLookupTableProgram}=require('./tests/solana/node_modules/@solana/web3.js');
          const operator=Keypair.fromSecretKey(Uint8Array.from(JSON.parse(fs.readFileSync(process.env.SOLANA_OPERATOR_KEYPAIR,'utf8'))));
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed'); const altKey=new PublicKey(process.env.RECLAIMABLE_ALT);
          const send=async(ix,label)=>{const latest=await c.getLatestBlockhash('confirmed');const tx=new Transaction({feePayer:operator.publicKey,recentBlockhash:latest.blockhash}).add(ix);tx.sign(operator);const sig=await c.sendRawTransaction(tx.serialize(),{skipPreflight:false,maxRetries:3});const conf=await c.confirmTransaction({signature:sig,...latest},'confirmed');if(conf.value.err)throw new Error(`${label} ${JSON.stringify(conf.value.err)}`);console.log(label+'_TX',sig);return sig;};
          (async()=>{
            const before=await c.getBalance(operator.publicKey,'confirmed');
            let info=await c.getAccountInfo(altKey,'confirmed'); let table=(await c.getAddressLookupTable(altKey)).value;
            if(!info&&!table){console.log('RECLAIMABLE_ALT_ALREADY_CLOSED');console.log('OPERATOR_BALANCE_POST_RECLAIM',before);return;}
            if(!info||!table) throw new Error('reclaimable ALT malformed');
            if(info.owner.toBase58()!=='AddressLookupTab1e1111111111111111111111111') throw new Error('reclaimable ALT wrong owner');
            if(!table.state.authority?.equals(operator.publicKey)) throw new Error('reclaimable ALT wrong authority');
            if(table.state.addresses.length!==15) throw new Error(`reclaimable ALT unexpected address count ${table.state.addresses.length}`);
            if(info.lamports!==3373120) throw new Error(`reclaimable ALT unexpected rent ${info.lamports}`);
            console.log('RECLAIMABLE_ALT_VERIFIED',altKey.toBase58(),'LAMPORTS',info.lamports,'ADDRESSES',table.state.addresses.length);
            const MAX=BigInt('18446744073709551615');
            let deactivation=BigInt(table.state.deactivationSlot.toString());
            if(deactivation===MAX){await send(AddressLookupTableProgram.deactivateLookupTable({lookupTable:altKey,authority:operator.publicKey}),'ALT_DEACTIVATE'); table=(await c.getAddressLookupTable(altKey)).value; if(!table)throw new Error('ALT vanished after deactivate'); deactivation=BigInt(table.state.deactivationSlot.toString());}
            for(let i=0;i<180;i++){const slot=BigInt(await c.getSlot('confirmed')); const age=slot-deactivation; if(i%10===0)console.log('ALT_COOLDOWN',slot.toString(),'AGE',age.toString()); if(age>=520n)break; await new Promise(r=>setTimeout(r,2500));}
            const current=BigInt(await c.getSlot('confirmed')); if(current-deactivation<520n)throw new Error(`ALT cooldown incomplete ${current-deactivation}`);
            await send(AddressLookupTableProgram.closeLookupTable({lookupTable:altKey,authority:operator.publicKey,recipient:operator.publicKey}),'ALT_CLOSE');
            if(await c.getAccountInfo(altKey,'confirmed')) throw new Error('ALT still exists after close');
            const after=await c.getBalance(operator.publicKey,'confirmed'); console.log('OPERATOR_BALANCE_POST_RECLAIM',after,'NET',after-before); if(after<=before)throw new Error('ALT rent not reclaimed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Materialize disposable golden harness outside PR history
        shell: bash
        run: |
          set -euo pipefail
          source_sha=ad4133dddf9f6033a7ef3af36b196ba080863918
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/${source_sha}/tests/solana/candidate-wallet-golden-devnet.cjs" -o tests/solana/candidate-wallet-golden-devnet.cjs
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/${source_sha}/tests/solana/patch-candidate-wallet-p1.py" -o /tmp/patch-candidate-wallet-p1.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patch-candidate-wallet-p1.py'); s=p.read_text()
          for call in ['patch_middle()\n','patch_fixture()\n','patch_graduation()\n']:
              s=s.replace(call,'')
          p.write_text(s)
          PY
          python3 /tmp/patch-candidate-wallet-p1.py
          curl -fsSL "https://raw.githubusercontent.com/uptokendev/MemeWarzone/b88752f4b82f17390cc3b53ff43e5bfea4bbe1e4/tests/solana/agent2-final-golden-expiry-patch.py" -o /tmp/expiry.py
          python3 /tmp/expiry.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/solana/candidate-wallet-golden-devnet.cjs'); s=p.read_text()
          s=s.replace('const BUY_LAMPORTS = 1_000_000n;','const BUY_LAMPORTS = 100_000n;')
          old='''  const creator=await setupWallet(program,connection,operator,globalConfig,clusterId,"creator");
  const buyer=await setupWallet(program,connection,operator,globalConfig,clusterId,"buyer");'''
          new='''  const creator={keypair:operator,creatorProfile:derivePda(PROGRAM_ID,"creator",operator.publicKey.toBuffer()),riskProfile:derivePda(PROGRAM_ID,"risk",operator.publicKey.toBuffer())};
  const buyerKeypair=Keypair.generate();
  await sendControl(connection,operator,[SystemProgram.transfer({fromPubkey:operator.publicKey,toPubkey:buyerKeypair.publicKey,lamports:5_000_000})]);
  const buyer={keypair:buyerKeypair,creatorProfile:derivePda(PROGRAM_ID,"creator",buyerKeypair.publicKey.toBuffer()),riskProfile:derivePda(PROGRAM_ID,"risk",buyerKeypair.publicKey.toBuffer())};'''
          if old not in s: raise SystemExit('setup replacement target missing')
          s=s.replace(old,new,1)
          old='  const alt=await createTempAlt(connection,operator,globalConfig);'
          new='''  const alt=(await connection.getAddressLookupTable(new PublicKey(process.env.SOLANA_GOLDEN_EXISTING_ALT))).value;
  if(!alt) fail(`reusable ALT missing ${process.env.SOLANA_GOLDEN_EXISTING_ALT}`);
  const missingAlt=altPlan(globalConfig).filter((key)=>!alt.state.addresses.some((x)=>x.equals(key)));
  if(missingAlt.length) fail(`reusable ALT missing ${missingAlt.map((x)=>x.toBase58()).join(",")}`);'''
          if old not in s: raise SystemExit('ALT replacement target missing')
          s=s.replace(old,new,1)
          old='  const profile=await program.account.creatorProfile.fetch(creator.creatorProfile);'
          new='''  const profile=await program.account.creatorProfile.fetch(creator.creatorProfile);
  const liveBefore=Number(profile.liveBondingCount);
  const totalBefore=BigInt(profile.totalLaunches.toString());'''
          s=s.replace(old,new,1)
          old='  await program.methods.initializeFeeEscrow().accountsStrict({payer:operator.publicKey,campaign,feeEscrow,systemProgram:SystemProgram.programId}).rpc({commitment:"confirmed"});'
          new='''  const afterCreateProfile=await program.account.creatorProfile.fetch(creator.creatorProfile);
  const liveAfterCreate=Number(afterCreateProfile.liveBondingCount);
  const totalAfterCreate=BigInt(afterCreateProfile.totalLaunches.toString());
  if(liveAfterCreate!==liveBefore+1) fail(`CREATE liveBondingCount delta != 1 (${liveBefore}->${liveAfterCreate})`);
  if(totalAfterCreate!==totalBefore+1n) fail(`CREATE totalLaunches delta != 1 (${totalBefore}->${totalAfterCreate})`);
  await program.methods.initializeFeeEscrow().accountsStrict({payer:operator.publicKey,campaign,feeEscrow,systemProgram:SystemProgram.programId}).rpc({commitment:"confirmed"});'''
          s=s.replace(old,new,1)
          old='return {create,buy,sell,campaign:campaign.toBase58(),mint:mint.toBase58(),alt:alt.key.toBase58(),creatorDiagnostics:{payer:creator.keypair.publicKey.toBase58(),balanceBeforeCreate:creatorBalanceBeforeCreate,rentMinima}};'
          new='return {create,buy,sell,campaign:campaign.toBase58(),mint:mint.toBase58(),alt:alt.key.toBase58(),creatorDiagnostics:{payer:creator.keypair.publicKey.toBase58(),balanceBeforeCreate:creatorBalanceBeforeCreate,rentMinima,liveBefore,liveAfterCreate,totalBefore:totalBefore.toString(),totalAfterCreate:totalAfterCreate.toString()}};'
          if old not in s: raise SystemExit('diagnostics replacement target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q 'expiry-safe rebuild only after null signature status' tests/solana/candidate-wallet-golden-devnet.cjs
          grep -q 'getSignatureStatuses' tests/solana/candidate-wallet-golden-devnet.cjs
          grep -q 'SOLANA_GOLDEN_EXISTING_ALT' tests/solana/candidate-wallet-golden-devnet.cjs
          echo "DISPOSABLE_CERT_HARNESS=READY"
      - name: Execute fresh exact-head CREATE BUY SELL
        shell: bash
        env:
          SOLANA_GOLDEN_EXISTING_ALT: ${{ env.REUSABLE_ALT }}
        run: |
          set -euo pipefail
          SOLANA_GOLDEN_ONLY_FINAL=1 SOLANA_GOLDEN_REPORT=/tmp/pr289-final-golden.json node tests/solana/candidate-wallet-golden-devnet.cjs | tee /tmp/pr289-final-golden.log
          node - <<'NODE'
          const r=require('/tmp/pr289-final-golden.json');
          for(const key of ['create','buy','sell']){
            const x=r.final?.[key]; if(!x||x.status!=='PASS'||x.version!=='V0')throw new Error(`${key} not PASS/V0`);
            if(x.altUsage!==`YES:${process.env.REUSABLE_ALT}`)throw new Error(`${key} wrong ALT ${x.altUsage}`);
            if(!x.blockhash||!x.lastValidBlockHeight)throw new Error(`${key} blockhash/LVH missing`);
            if(!String(x.simulation).startsWith('PASS'))throw new Error(`${key} simulation failed`);
            if(!(Number(x.serializedPacketBytes)>0))throw new Error(`${key} packet bytes missing`);
            if(!x.signature)throw new Error(`${key} signature missing`);
            if(!String(x.retryBehavior).includes('deduped'))throw new Error(`${key} identical retry not deduped`);
            if(!String(x.expiryBehavior).includes('rejected'))throw new Error(`${key} expired/unknown blockhash not rejected`);
            if(!String(x.duplicateReplayBehavior).includes('fresh-blockhash same intent rejected'))throw new Error(`${key} duplicate intent not rejected`);
            if(!String(x.confirmationMethod).includes('expiry-safe rebuild only after null signature status'))throw new Error(`${key} expiry rebuild safety missing`);
            console.log('FINAL_'+key.toUpperCase(),JSON.stringify(x));
          }
          const d=r.final.creatorDiagnostics;
          if(Number(d.liveAfterCreate)!==Number(d.liveBefore)+1)throw new Error('duplicate CREATE live count evidence failed');
          if(BigInt(d.totalAfterCreate)!==BigInt(d.totalBefore)+1n)throw new Error('duplicate CREATE total count evidence failed');
          console.log('FINAL_CREATE_DIAGNOSTICS',JSON.stringify(d));
          console.log('FINAL_CAMPAIGN',r.final.campaign);
          console.log('FINAL_MINT',r.final.mint);
          console.log('RETRY_SAFETY=PASS');
          console.log('DUPLICATE_INTENT_SAFETY=PASS');
          console.log('NO_DUPLICATE_CREATE=YES');
          NODE
      - name: Prove retry/re-sign decision gate is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tests/solana/candidate-wallet-golden-devnet.cjs').read_text()
          a=s.index('const status=(await connection.getSignatureStatuses')
          b=s.index('if(status){',a)
          c=s.index('expiredAttempts.push',b)
          d=s.index('for(let attempt=1;attempt<=3;attempt++)')
          if not (d<a<b<c): raise SystemExit('expiry safety ordering invalid')
          if 'if(status.err)' not in s[b:c]: raise SystemExit('status error refusal missing')
          if 'confirmationStatus==="confirmed"||status.confirmationStatus==="finalized"' not in s[b:c]: raise SystemExit('landed-status acceptance missing')
          if 'expiry retry refused because prior signature exists with status' not in s[b:c]: raise SystemExit('unresolved-status refusal missing')
          print('REBUILD_RESIGN_AFTER_EXPIRY_ONLY_AFTER_NULL_STATUS=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent2-pr289-final-golden-${{ env.PR_HEAD }}
          path: |
            /tmp/pr289-final-golden.json
            /tmp/pr289-final-golden.log
          if-no-files-found: warn
          retention-days: 14
