name: Agent 2 PR289 final funded golden
on:
  push:
    branches: [cert/agent2-pr289-final-exact-head-20260911]
    paths: [.github/workflows/agent2-pr289-final-funded-golden.yml]
permissions:
  contents: read
env:
  PR_HEAD: f18505e39186a5fa73fd89f00b242b94782f2f2c
  CREATE_SIG: 5F7QHoM1tBAhUNRFfHhtFR4FJ8dM7CBCMLEjv7HFW6f3d8p4jwB8EgvbBFs2dUJLKdjr9v6erQ81QhS8yWrTYDJi
  OPERATOR: HuKfoFUuWxC5qFZXzr5dbaX4S7w4vJUW8AHV9LD4C2J9
  ALT: ALA7wQRuPdHWzLLpyDwbw7kPbJB7pCp1zNyzrNZApoiA
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testnet-certification
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_DEVNET_RPC || vars.SOLANA_DEVNET_RPC || 'https://api.devnet.solana.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests/solana --no-audit --no-fund
      - name: Read-only reconstruction
        shell: bash
        run: |
          node - <<'NODE'
          const {Connection,PublicKey,VersionedTransaction}=require('./tests/solana/node_modules/@solana/web3.js');
          const bs58mod=require('./tests/solana/node_modules/bs58'); const bs58=bs58mod.default||bs58mod;
          const c=new Connection(process.env.SOLANA_RPC_URL,'confirmed');
          (async()=>{
            if((await c.getGenesisHash())!=='EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG') throw new Error('not devnet');
            const tx=await c.getTransaction(process.env.CREATE_SIG,{commitment:'confirmed',maxSupportedTransactionVersion:0});
            if(!tx||tx.meta?.err) throw new Error('CREATE absent/failed');
            const vt=new VersionedTransaction(tx.transaction.message);
            vt.signatures=tx.transaction.signatures.map(s=>Uint8Array.from(bs58.decode(String(s))));
            const op=new PublicKey(process.env.OPERATOR);
            console.log('CURRENT_BALANCE',await c.getBalance(op,'confirmed'));
            console.log('CREATE_RECONSTRUCTED_PACKET_BYTES',vt.serialize().length);
            console.log('CREATE_BLOCKHASH',tx.transaction.message.recentBlockhash);
            console.log('CREATE_VERSION',String(tx.version));
            console.log('CREATE_ALTS',(tx.transaction.message.addressTableLookups||[]).map(x=>x.accountKey.toBase58()).join(',')||'NONE');
            console.log('CREATE_STATUS',JSON.stringify(tx.meta.err));
            console.log('ATA_RENT_165',await c.getMinimumBalanceForRentExemption(165,'confirmed'));
            console.log('TRADE_AUTH_RENT_188',await c.getMinimumBalanceForRentExemption(188,'confirmed'));
            console.log('BROADCAST_PERFORMED','NO');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
