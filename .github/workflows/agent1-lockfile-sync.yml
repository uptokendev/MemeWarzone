name: Agent 1 lockfile sync

on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/agent1-lockfile-sync.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent 1 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized package lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(wallet): synchronize WalletConnect package lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
