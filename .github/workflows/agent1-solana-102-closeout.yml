name: Agent 1 Solana 102 Closeout

on:
  push:
    branches:
      - agent1/solana-102-escape-fix-3512139
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closeout:
    name: Solana 102 + cross-chain closeout
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend/API dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Permanent Solana 102 financial negatives
        run: node --test frontend/shared/solana102FinancialEscapeNegative.test.mjs
      - name: BASIC runtime resolver + database authority
        run: node --test frontend/api/lib/solana102BasicRuntimeResolver.test.mjs
      - name: Arena caller identity matrix
        run: node --test frontend/shared/solanaCurrentAuthority.test.mjs frontend/shared/solanaCurrentArenaAuthority.test.mjs
      - name: API import integrity
        run: npm --prefix frontend run check:api-imports
      - name: BNB and Robinhood shared post-grad routing regression
        run: npm --prefix frontend run check:postgrad-routing
      - name: BNB and Robinhood shared economics regression
        run: npm --prefix frontend run check:postgrad-economics
      - name: Graduation market regression
        run: npm --prefix frontend run test:graduation-market
      - name: Wallet and EVM chain regression
        run: npm --prefix frontend run test:wallet-discovery
      - name: Arena runtime regression
        run: npm --prefix frontend run test:arena-runtime-acceptance
      - name: Arena tournament regression
        run: npm --prefix frontend run test:arena-tournament
      - name: Frontend build
        run: npm --prefix frontend run build

  indexer:
    name: Realtime indexer build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: realtime-indexer/package-lock.json
      - run: npm ci --prefix realtime-indexer --no-audit --no-fund
      - run: npm --prefix realtime-indexer run build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked environment files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.example$' || true)"
          test -z "$tracked" || { echo "$tracked"; exit 1; }
      - name: Reject server secrets in browser source
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=dist '(import\.meta\.env\.(SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PRIVATE_KEY|MNEMONIC|ABLY_API_KEY|DISCORD_BOT_TOKEN|TELEGRAM_BOT_TOKEN)|process\.env\.(SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|PRIVATE_KEY|MNEMONIC|ABLY_API_KEY|DISCORD_BOT_TOKEN|TELEGRAM_BOT_TOKEN))' frontend/src
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
