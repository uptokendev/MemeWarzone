name: BSC97 Live Claims Acceptance

# Live destructive claim acceptance on actual BSC testnet 97.
# Ported from agent5/bsc97-live-claims, which pinned a frozen parent commit and
# so could never certify current code: its last run died on that assertion
# before touching a chain.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  destructive-chain97:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: testnet-certification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memewarzone_claim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memewarzone_claim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BSC_TESTNET_PRIVATE_KEY: ${{ secrets.BSC_TESTNET_PRIVATE_KEY }}
      BSC_RPC_HTTP_97: ${{ vars.BSC_TESTNET_RPC || secrets.BSC_TESTNET_RPC }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memewarzone_claim_test
      PG_DISABLE_SSL: "1"
      API_AUTH_ENFORCE_USER_WRITES: "1"
      REWARD_CLAIM_MIN_CONFIRMATIONS_97: "1"
      LEAGUE_ADMIN_TOKEN: agent5-live-test
    steps:
      - name: Checkout isolated exact-authority branch
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Exact authority and operator boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "certifying $(git rev-parse HEAD)"
          test -n "${BSC_TESTNET_PRIVATE_KEY:-}"
          test -n "${BSC_RPC_HTTP_97:-}"
          npm ci
          npm ci --prefix frontend
          node --input-type=module <<'NODE'
          import { JsonRpcProvider, Wallet, formatEther } from 'ethers';
          const p = new JsonRpcProvider(process.env.BSC_RPC_HTTP_97, 97, { staticNetwork: true });
          const n = await p.getNetwork();
          if (Number(n.chainId) !== 97) throw new Error(`wrong chain ${n.chainId}`);
          const w = new Wallet(process.env.BSC_TESTNET_PRIVATE_KEY, p);
          const expected = '0xEE2c6A7605ED378CF1D26D1d828446d63A3fdeDa'.toLowerCase();
          if (w.address.toLowerCase() !== expected) throw new Error(`unauthorized operator ${w.address}`);
          const bal = await p.getBalance(w.address);
          console.log(JSON.stringify({chainId:97, operator:w.address, balanceBNB:formatEther(bal)}));
          if (bal < 30000000000000000n) throw new Error('BLOCKED: operator needs at least 0.03 test BNB for claim-rail deployment/acceptance');
          await p.destroy();
          NODE

      - name: Prove the RPC serves eth_getLogs
        shell: bash
        run: |
          set -euo pipefail
          # Claim recovery is a log scan. An RPC that answers eth_getBlockNumber
          # but refuses eth_getLogs passes every other check here and then makes
          # real, paid entitlements look unrecoverable. Find that out in ten
          # seconds instead of after a contract deployment and six minutes of
          # acceptance, and say which endpoint did it.
          node --input-type=module <<'NODE'
          const url = process.env.BSC_RPC_HTTP_97;
          const host = (() => { try { return new URL(url).host; } catch { return '<unparseable>'; } })();
          async function call(method, params) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
            });
            const body = await response.json().catch(() => null);
            return { httpStatus: response.status, error: body?.error ?? null, result: body?.result ?? null };
          }
          const head = await call('eth_blockNumber', []);
          if (head.error || head.result == null) {
            throw new Error(`BLOCKED: ${host} cannot answer eth_blockNumber: ${JSON.stringify(head)}`);
          }
          const latest = Number(head.result);
          // Widest span claim recovery asks for, then the narrowest, so the log
          // says whether this is a range limit or a flat refusal.
          const spans = [5000, 1000, 100, 10, 1];
          const attempts = [];
          let served = null;
          for (const span of spans) {
            const probe = await call('eth_getLogs', [{
              fromBlock: '0x' + Math.max(0, latest - span + 1).toString(16),
              toBlock: '0x' + latest.toString(16),
              topics: ['0x04672052dcb6b5b19a9cc2ec1b8f447f1f5e47b5e24cfa5e4ffb640d63ca2be7'],
            }]);
            const ok = !probe.error && Array.isArray(probe.result);
            attempts.push({ span, ok, httpStatus: probe.httpStatus, error: probe.error });
            if (ok && served == null) served = span;
          }
          console.log(JSON.stringify({ host, latest, largestServedSpan: served, attempts }, null, 2));
          if (served == null) {
            throw new Error(
              `BLOCKED: ${host} refuses eth_getLogs at every span down to a single block, so claim recovery cannot run. ` +
              `Point BSC_TESTNET_RPC at a BSC testnet endpoint that serves eth_getLogs.`,
            );
          }
          if (served < 5000) {
            console.log(`::warning::${host} serves eth_getLogs only up to ${served} blocks; set EVM_CLAIM_RECONCILE_CHUNK_BLOCKS and REWARD_CLAIM_RECOVERY_BLOCK_CHUNK at or below that.`);
          }
          NODE

      - name: Compile frozen claim contracts
        run: npx hardhat compile --config hardhat.agent5-claim-recovery.config.cjs

      - name: Deploy minimum actual BSC97 claim rails
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ContractFactory, JsonRpcProvider, Wallet, formatEther } from 'ethers';
          const p = new JsonRpcProvider(process.env.BSC_RPC_HTTP_97, 97, { staticNetwork: true });
          const owner = new Wallet(process.env.BSC_TESTNET_PRIVATE_KEY, p);
          const reward = JSON.parse(fs.readFileSync('.agent5-artifacts/contracts/RewardDistributor.sol/RewardDistributor.json','utf8'));
          const vaultA = JSON.parse(fs.readFileSync('.agent5-artifacts/contracts/TreasuryVaultV2.sol/TreasuryVaultV2.json','utf8'));
          const before = await p.getBalance(owner.address);
          const distributor = await new ContractFactory(reward.abi, reward.bytecode, owner).deploy(owner.address);
          const dReceipt = await distributor.deploymentTransaction().wait();
          const distributorAddress = await distributor.getAddress();
          const vault = await new ContractFactory(vaultA.abi, vaultA.bytecode, owner).deploy(owner.address, owner.address, owner.address);
          const vReceipt = await vault.deploymentTransaction().wait();
          const vaultAddress = await vault.getAddress();
          await (await owner.sendTransaction({to:vaultAddress,value:10000000000000000n})).wait();
          await (await vault.setClaimCaps(10000000000000000n,100000000000000000n)).wait();
          await (await vault.setClaimsPaused(false)).wait();
          const dCode = await p.getCode(distributorAddress);
          const vCode = await p.getCode(vaultAddress);
          if (dCode === '0x' || vCode === '0x') throw new Error('missing runtime bytecode');
          const out = {
            sourceAuthority:process.env.GITHUB_SHA, chainId:97,
            operator:owner.address,
            rewardDistributor:{address:distributorAddress,deploymentTx:dReceipt.hash,deploymentBlock:dReceipt.blockNumber,runtimeBytes:(dCode.length-2)/2},
            treasuryVaultV2:{address:vaultAddress,deploymentTx:vReceipt.hash,deploymentBlock:vReceipt.blockNumber,runtimeBytes:(vCode.length-2)/2,owner:owner.address,emergencyAdmin:owner.address,rootPoster:owner.address,initialFundingWei:'10000000000000000'},
            operatorBalanceBeforeBNB:formatEther(before)
          };
          fs.mkdirSync('reports',{recursive:true});
          fs.writeFileSync('reports/agent5-bsc97-claim-rails.json',JSON.stringify(out,null,2));
          fs.appendFileSync(process.env.GITHUB_ENV,`REWARD_DISTRIBUTOR_ADDRESS_97=${distributorAddress}\nTREASURY_VAULT_V2_ADDRESS_97=${vaultAddress}\nREWARD_CLAIM_RECOVERY_FROM_BLOCK_97=${Math.min(dReceipt.blockNumber,vReceipt.blockNumber)}\nEVM_LEAGUE_RECOVERY_FROM_BLOCK_97=${vReceipt.blockNumber}\n`);
          console.log(JSON.stringify(out,null,2));
          await p.destroy();
          NODE

      - name: Prepare live-network copies of frozen tests
        shell: bash
        run: |
          set -euo pipefail
          cp frontend/api/lib/agent5ClaimsCloseout.integration.test.mjs /tmp/claims-live.test.mjs
          cp frontend/api/lib/bnbBattleClaimRecovery.integration.test.mjs /tmp/battle-live.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          // Every replacement below must apply. If a test file drifts and one
          // silently no-ops, the patched test keeps calling getSigner(0), which
          // does not exist on BSC97, and the failure looks like a claims bug
          // rather than a stale patch.
          function sub(s, from, to, label) {
            const next = s.replace(from, to);
            if (next === s) throw new Error(`live-patch anchor no longer matches: ${label}`);
            return next;
          }
          function patchClaims(path) {
            let s=fs.readFileSync(path,'utf8');
            s=sub(s,'JsonRpcProvider, hexlify, keccak256, randomBytes','JsonRpcProvider, Wallet, Contract, hexlify, keccak256, randomBytes','claims imports');
            s=sub(s,'owner = await provider.getSigner(0);\n  user = await provider.getSigner(1);\n  other = await provider.getSigner(2);\n  rootPoster = await provider.getSigner(3);','owner = new Wallet(process.env.BSC_TESTNET_PRIVATE_KEY, provider);\n  user = owner;\n  other = Wallet.createRandom().connect(provider);\n  rootPoster = owner;','claims signers');
            s=sub(s,/distributor = await new ContractFactory\(rewardArtifact\.abi, rewardArtifact\.bytecode, owner\)\.deploy\(await owner\.getAddress\(\)\);\n  await distributor\.waitForDeployment\(\);\n  distributorAddress = await distributor\.getAddress\(\);/,'distributorAddress = process.env.REWARD_DISTRIBUTOR_ADDRESS_97;\n  distributor = new Contract(distributorAddress, rewardArtifact.abi, owner);','claims distributor');
            s=sub(s,/vault = await new ContractFactory\(vaultArtifact\.abi, vaultArtifact\.bytecode, owner\)\.deploy\(await owner\.getAddress\(\), await other\.getAddress\(\), await rootPoster\.getAddress\(\)\);\n  await vault\.waitForDeployment\(\);\n  vaultAddress = await vault\.getAddress\(\);/,'vaultAddress = process.env.TREASURY_VAULT_V2_ADDRESS_97;\n  vault = new Contract(vaultAddress, vaultArtifact.abi, owner);','claims vault');
            s=sub(s,'  await (await owner.sendTransaction({ to: vaultAddress, value: 100000000000000000n })).wait();\n','','claims vault prefund');
            fs.writeFileSync(path,s);
          }
          function patchBattle(path) {
            let s=fs.readFileSync(path,'utf8');
            s=sub(s,'JsonRpcProvider,\n  keccak256','JsonRpcProvider,\n  Wallet,\n  keccak256','battle imports');
            s=sub(s,'owner = await provider.getSigner(0);\n  user = await provider.getSigner(1);\n  other = await provider.getSigner(2);','owner = new Wallet(process.env.BSC_TESTNET_PRIVATE_KEY, provider);\n  user = owner;\n  other = Wallet.createRandom().connect(provider);','battle signers');
            s=sub(s,/const factory = new ContractFactory\(artifact\.abi, artifact\.bytecode, owner\);\n  distributor = await factory\.deploy\(await owner\.getAddress\(\)\);\n  await distributor\.waitForDeployment\(\);\n  distributorAddress = await distributor\.getAddress\(\);/,'distributorAddress = process.env.REWARD_DISTRIBUTOR_ADDRESS_97;\n  distributor = new Contract(distributorAddress, artifact.abi, owner);','battle distributor');
            fs.writeFileSync(path,s);
          }
          patchClaims('/tmp/claims-live.test.mjs');
          patchBattle('/tmp/battle-live.test.mjs');
          NODE
          cp /tmp/claims-live.test.mjs frontend/api/lib/agent5ClaimsLive97.integration.test.mjs
          cp /tmp/battle-live.test.mjs frontend/api/lib/agent5BattleLive97.integration.test.mjs

      - name: Generic reward plus League destructive acceptance on actual BSC97
        working-directory: frontend
        run: |
          set -o pipefail
          node --test api/lib/agent5ClaimsLive97.integration.test.mjs 2>&1 | tee ../reports/agent5-bsc97-generic-league.log
          psql "$DATABASE_URL" -Atc "select json_agg(x) from (select reward_type,status,claim_tx_hash,wallet_address,amount::text from reward_ledger order by created_at) x" > ../reports/agent5-bsc97-generic-db.json
          psql "$DATABASE_URL" -Atc "select json_agg(x) from (select chain_id,period,category,rank,recipient_address,amount_raw::text,tx_hash from league_epoch_payouts order by epoch_start,category,rank) x" > ../reports/agent5-bsc97-league-db.json

      - name: Normal Battle destructive acceptance on actual BSC97
        working-directory: frontend
        run: |
          set -o pipefail
          node --test api/lib/agent5BattleLive97.integration.test.mjs 2>&1 | tee ../reports/agent5-bsc97-battle.log
          psql "$DATABASE_URL" -Atc "select json_agg(x) from (select reward_type,status,claim_tx_hash,wallet_address,amount::text,metadata from reward_ledger order by created_at) x" > ../reports/agent5-bsc97-battle-db.json

      - name: Bind chain evidence and balances
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { Contract, JsonRpcProvider, Wallet, formatEther } from 'ethers';
          if (!fs.existsSync('reports/agent5-bsc97-claim-rails.json')) process.exit(0);
          const r=JSON.parse(fs.readFileSync('reports/agent5-bsc97-claim-rails.json','utf8'));
          const p=new JsonRpcProvider(process.env.BSC_RPC_HTTP_97,97,{staticNetwork:true});
          const w=new Wallet(process.env.BSC_TESTNET_PRIVATE_KEY,p);
          const rewardA=JSON.parse(fs.readFileSync('.agent5-artifacts/contracts/RewardDistributor.sol/RewardDistributor.json','utf8'));
          const vaultA=JSON.parse(fs.readFileSync('.agent5-artifacts/contracts/TreasuryVaultV2.sol/TreasuryVaultV2.json','utf8'));
          const d=new Contract(r.rewardDistributor.address,rewardA.abi,p);
          const v=new Contract(r.treasuryVaultV2.address,vaultA.abi,p);
          const from=Math.min(r.rewardDistributor.deploymentBlock,r.treasuryVaultV2.deploymentBlock);
          const latest=await p.getBlockNumber();
          // Providers cap eth_getLogs spans (BlockPI answers -32602 above 1024
          // blocks), and queryFilter issues one request for the whole range.
          // Chunk it, and record a scan failure in the evidence instead of
          // swallowing it: an empty event list must mean no claims happened,
          // never that the scan quietly gave up.
          const CHUNK=Number(process.env.EVIDENCE_LOG_CHUNK_BLOCKS||900);
          async function collect(contract,eventName){
            if(typeof contract.filters[eventName]!=='function') return {error:`${eventName} is not an event on this contract`,events:[]};
            const filter=contract.filters[eventName]();
            const events=[];
            for(let start=from;start<=latest;start+=CHUNK){
              const end=Math.min(latest,start+CHUNK-1);
              try{ events.push(...await contract.queryFilter(filter,start,end)); }
              catch(error){ return {error:`scan failed for blocks ${start}-${end}: ${error?.message||error}`,events}; }
            }
            return {error:null,events};
          }
          // RewardDistributor emits RewardClaimed; Claimed belongs to TreasuryVaultV2.
          const dScan=await collect(d,'RewardClaimed');
          const vScan=await collect(v,'Claimed');
          const dEvents=dScan.events;
          const vEvents=vScan.events;
          const evidence={...r,final:{operatorBalanceBNB:formatEther(await p.getBalance(w.address)),rewardDistributorBalanceWei:String(await p.getBalance(r.rewardDistributor.address)),treasuryVaultBalanceWei:String(await p.getBalance(r.treasuryVaultV2.address)),rewardClaimEvents:dEvents.map(e=>({txHash:e.transactionHash,blockNumber:e.blockNumber,args:e.args?.map?.(String)})),rewardClaimScanError:dScan.error,leagueClaimEvents:vEvents.map(e=>({txHash:e.transactionHash,blockNumber:e.blockNumber,args:e.args?.map?.(String)})),leagueClaimScanError:vScan.error,scannedBlocks:{from,latest}}};
          fs.writeFileSync('reports/agent5-bsc97-live-chain-evidence.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence,null,2));
          await p.destroy();
          if(dScan.error||vScan.error) throw new Error(`claim evidence is incomplete: ${dScan.error||''} ${vScan.error||''}`.trim());
          NODE

      - name: Upload destructive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent5-bsc97-live-claims-${{ github.sha }}
          path: reports/agent5-bsc97-*
          if-no-files-found: warn
          retention-days: 30
