name: Agent3 Tournament Destructive Retry Runner

on:
  pull_request:
    branches:
      - build/cross-chain-stabilization-rh-base
    paths:
      - '.github/workflows/agent3-arena-money-v2-devnet-reread.yml'
      - 'frontend/scripts/agent3-tournament-only-solana-devnet.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_AUTHORITY: 8eefcc4b49d30f70bda64f4e6f3e647c26de24eb

jobs:
  tournament-runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove source authority and acceptance-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_AUTHORITY" HEAD
          git diff --name-only "$SOURCE_AUTHORITY"...HEAD | tee /tmp/agent3-delta.txt
          test "$(grep -Ev '^(\.github/workflows/agent3-tournament-destructive-retry\.yml|\.github/workflows/agent3-arena-money-v2-devnet-reread\.yml|frontend/scripts/agent3-tournament-only-solana-devnet\.mjs)$' /tmp/agent3-delta.txt | wc -l)" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Certify Normal Tournament, Vote Tournament, Final Salvo only
        working-directory: frontend
        run: |
          set -euo pipefail
          node --test api/lib/arenaTournamentV2Certification.test.mjs
          node --test api/lib/arenaFinalSalvoRuntime.test.mjs
      - name: Certify Tournament-facing sponsorship authority
        working-directory: frontend
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const api=fs.readFileSync('api/arenaSponsorships.js','utf8');
          assert.match(api,/eventType === "normal_tournament" \|\| eventType === "vote_tournament"/);
          assert.match(api,/prizeBps:\s*7000, marketingOpsBps:\s*2000, protocolBps:\s*1000/);
          assert.doesNotMatch(api,/eventType === "normal_battle"|eventType === "battle"/);
          console.log('Tournament sponsorship event types and 70/20/10 split preserved; Battle sponsorship absent.');
          NODE
      - name: Write runtime artifact
        shell: bash
        run: |
          mkdir -p reports
          printf '{"sourceAuthority":"%s","head":"%s","normalTournament":true,"voteTournament":true,"finalSalvo":true,"battleLaneTouched":false}\n' "$SOURCE_AUTHORITY" "$(git rev-parse HEAD)" > reports/agent3-tournament-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-runtime-certification
          path: reports/agent3-tournament-runtime.json
          if-no-files-found: error

  solana-devnet-tournament-money:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: airdrop-solana-devnet
    env:
      SOLANA_REWARDS_RPC_URL: ${{ secrets.SOLANA_REWARDS_RPC_URL }}
      SOLANA_REWARDS_AUTHORITY_SECRET_KEY: ${{ secrets.SOLANA_REWARDS_AUTHORITY_SECRET_KEY }}
      AGENT3_TOURNAMENT_SOLANA_OUT: reports/agent3-tournament-solana-devnet.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove source authority and acceptance-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_AUTHORITY" HEAD
          git diff --name-only "$SOURCE_AUTHORITY"...HEAD | tee /tmp/agent3-delta.txt
          test "$(grep -Ev '^(\.github/workflows/agent3-tournament-destructive-retry\.yml|\.github/workflows/agent3-arena-money-v2-devnet-reread\.yml|frontend/scripts/agent3-tournament-only-solana-devnet\.mjs)$' /tmp/agent3-delta.txt | wc -l)" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Execute Tournament-only Solana devnet destructive money acceptance
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/agent3-tournament-only-solana-devnet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agent3-tournament-solana-devnet
          path: frontend/reports/agent3-tournament-solana-devnet.json
          if-no-files-found: error
