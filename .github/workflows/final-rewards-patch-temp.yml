name: TEMP Apply Final Rewards Corrections

on:
  push:
    branches:
      - prep/solana-v0-arena-upgrade
    paths:
      - .github/workflows/final-rewards-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prep/solana-v0-arena-upgrade
          fetch-depth: 0
      - name: Apply final corrections
        run: python3 scripts/solana/patch-final-rewards-candidate.py
      - name: Commit final corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/mwz_rewards_treasury/src/lib.rs programs/mwz_rewards_treasury/src/arena_final.rs scripts/solana/init-rewards-lanes.mjs scripts/solana/arena-operator-v0.mjs
          git diff --cached --check
          git commit -m "fix(solana): finalize stack-safe rewards and Arena edge cases"
          git push origin HEAD:prep/solana-v0-arena-upgrade

# one-shot workflow; delete after the correction commit lands
# trigger 2: free tournament activation
