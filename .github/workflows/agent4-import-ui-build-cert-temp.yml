name: Agent 4 Import UI Build Cert Temp

on:
  push:
    branches:
      - agent4/import-ui-build-cert

permissions:
  contents: read

jobs:
  import-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ENABLE_PROJECT_IMPORTS: "true"
      VITE_ENABLE_POSTGRAD_ARENA: "false"
      VITE_ENABLE_POSTGRAD_BATTLE: "false"
      VITE_ENABLE_POSTGRAD_TOURNAMENT: "false"
      VITE_ENABLE_POSTGRAD_LEAGUE: "false"
      VITE_ENABLE_POSTGRAD_CLAIMS: "false"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund
      - name: Focused project import UI tests
        run: node --test frontend/src/project-imports-ui.test.mjs
      - name: Imports ON / Arena OFF production build
        run: npm run --prefix frontend build
