# App service (app.memewar.zone): custom nginx configuration for Coolify.
# Paste this whole file as the custom nginx configuration. TLS ends at Coolify's proxy, so this listens on 80.
# Source of truth for the route lists: frontend/shared/seoRoutes.mjs (aliases, noindex) and frontend/src/App.tsx
# (every <Route path>). frontend/shared/seoNginx.test.mjs checks this file against both.

# Noindex by request path (query ignored). $uri is /index.html after a fallback, so $request_uri is used.
# An empty value sends no X-Robots-Tag header.
map $request_uri $robots_tag {
    default "";
    "~^/(?:(?:command|drafts|story|embed|r)(?:[/?]|$)|(?:live|import|status|recruiter|recruiter-dashboard|squad-dashboard|profile|warzone/verify-email|recruiter/signup)(?:\?|$)|profile/[^/?]+/[^?]+|profile/@[^/?]*(?:\?|$)|token/[^/?]+/edit(?:\?|$))" "noindex";
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the Coolify proxy: an absolute redirect would point at http://. Relative Location is valid.
    absolute_redirect off;

    resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;

    # Trailing slash: /coins/ -> /coins (keeps the query string).
    location ~ ^/(.+)/$ {
        rewrite ^/(.+)/$ /$1 permanent;
    }

    # 301 aliases (frontend/shared/seoRoutes.mjs, kind "alias").
    location = /index { return 301 /; }
    location = /leagues { rewrite ^/leagues$ /league permanent; }
    location = /feed { rewrite ^/feed$ / permanent; }
    location = /docs { rewrite ^/docs$ /playbook permanent; }
    location = /arena { rewrite ^/arena$ /warzone permanent; }
    location = /warzone/leagues { rewrite ^/warzone/leagues$ /warzone/major-war-league permanent; }
    location = /events { rewrite ^/events$ /warzone/tournaments permanent; }
    location = /warzone/events { rewrite ^/warzone/events$ /warzone/tournaments permanent; }
    location = /command/feed { rewrite ^/command/feed$ / permanent; }
    location ~ ^/arena/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$ {
        rewrite ^/arena/([A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*)$ /warzone/$1 permanent;
    }
    location ~ ^/tournament/[A-Za-z0-9_.-]+$ {
        rewrite ^/tournament/([A-Za-z0-9_.-]+)$ /warzone/tournaments/$1 permanent;
    }
    location ~ ^/warzone/tournament/[A-Za-z0-9_.-]+$ {
        rewrite ^/warzone/tournament/([A-Za-z0-9_.-]+)$ /warzone/tournaments/$1 permanent;
    }
    location ~ ^/battle/[A-Za-z0-9_.-]+$ {
        rewrite ^/battle/([A-Za-z0-9_.-]+)$ /warzone/battles/$1 permanent;
    }

    # Index routes (kind "index" in seoRoutes.mjs) are rendered by the API: the app shell with the page's head tags.
    # /profile/@handle and everything noindex or client-only stay on the plain-shell allowlist below.
    # Loop guard: /index.html, /assets/, /api/, /sitemap*, /__render/ and real files never match these.
    location ~ ^/(?:coins|warzone|league|war-room|airdrops|airdrops/winners|recruiters|squads|playbook|sponsorships/apply|create|warzone/(?:battles|major-war-league|tournaments)|(?:token|prepare|post|recruiters)/[A-Za-z0-9_.-]+|warzone/(?:battles|tournaments)/[A-Za-z0-9_.-]+|profile/[A-Za-z0-9]+)$ {
        set $api https://api.memewar.zone;
        proxy_pass $api/__render$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host api.memewar.zone;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        # Express answers an unknown route with 404 JSON, so any upstream 404 means the renderer is not there
        # (deploy order, rollback): serve the plain shell as before. The renderer's own "not found" is 410 and passes through.
        error_page 401 403 404 408 429 500 502 503 504 = @spa;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Plain shell with 200 when the renderer is missing, down or errors (the renderer's 410 is not intercepted).
    location @spa {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files /index.html =404;
    }

    location ^~ /__render/ { return 404; }

    # Sitemaps come from the API. Variable proxy_pass: nginx still starts if the API is down.
    location = /sitemap.xml {
        set $api https://api.memewar.zone;
        proxy_pass $api$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host api.memewar.zone;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
    }

    location ^~ /sitemaps/ {
        set $api https://api.memewar.zone;
        proxy_pass $api$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host api.memewar.zone;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_http_version 1.1;
    }

    location ^~ /embed/chart/ {
        add_header Content-Security-Policy "frame-ancestors 'self' https://crypticpump.com https://www.crypticpump.com" always;
        add_header X-Robots-Tag "noindex" always;
        rewrite ^ /index.html break;
    }

    location ^~ /embed/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # Before this config, /api/* on the app host returned the app shell with 200 and no X-Robots-Tag.
    # This block keeps the 200 shell and adds noindex.
    location ^~ /api/ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = / {
        set $api https://api.memewar.zone;
        proxy_pass $api/__render$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host api.memewar.zone;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        # Express answers an unknown route with 404 JSON, so any upstream 404 means the renderer is not there
        # (deploy order, rollback): serve the plain shell as before. The renderer's own "not found" is 410 and passes through.
        error_page 401 403 404 408 429 500 502 503 504 = @spa;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Every route in frontend/src/App.tsx (index, noindex and client-only): 200 with the app shell.
    # A segment is [A-Za-z0-9_.@-]+ (@ for @handle profiles).
    location ~ ^/(?:coins|warzone|war-room|sponsorships/apply|league|create|import|live|post/[A-Za-z0-9_.@-]+|prepare/[A-Za-z0-9_.@-]+|airdrops|airdrops/winners|recruiter|recruiter/signup|recruiters|recruiters/[A-Za-z0-9_.@-]+|recruiter-dashboard|squads|squad-dashboard|r/[A-Za-z0-9_.@-]+|token/[A-Za-z0-9_.@-]+|token/[A-Za-z0-9_.@-]+/edit|story/[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+|playbook|status|warzone/(?:verify-email|battles|major-war-league|tournaments)|warzone/(?:battles|tournaments)/[A-Za-z0-9_.@-]+|drafts/[A-Za-z0-9_.@-]+/(?:promotion|push-live)|profile|command|command/[A-Za-z0-9_.@/-]+|profile/[A-Za-z0-9_.@-]+(?:/[A-Za-z0-9_.@-]+)*)$ {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri.html /index.html;
    }

    # Everything else: a real file, or a 404 whose body is the app shell (it shows its own 404 screen).
    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri.html =404;
        error_page 404 /index.html;
    }
}
