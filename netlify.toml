[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/no-functions"

[build.environment]
  NODE_VERSION = "20"
  VITE_ENABLE_WAR_ROOM = "true"
  VITE_ENABLE_POSTGRAD = "false"
  VITE_ENABLE_POSTGRAD_ARENA = "false"
  VITE_ENABLE_POSTGRAD_BATTLE = "false"
  VITE_ENABLE_POSTGRAD_EVENTS = "false"
  VITE_ENABLE_POSTGRAD_LEAGUE = "false"
  VITE_ENABLE_POSTGRAD_MOCKS = "false"
  VITE_ENABLE_POSTGRAD_TOURNAMENT = "false"
  VITE_ENABLE_DIRECT_BNB_DEPLOY = "true"
  VITE_LAUNCHPAD_WRITES_ENABLED = "true"
  # Product REST + Ably auth on frontend-api (not the indexer). Set in the Netlify UI.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https: wss: https://www.google-analytics.com https://region1.google-analytics.com; media-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/api/campaigns"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/featured"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/token/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/api/war-room*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Social platforms fetch OG images cross-origin. Site-wide CORP:same-origin
# blocks many unfurls — open the dedicated OG asset (and prepare PNGs).
[[headers]]
  for = "/assets/og.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"
    Content-Type = "image/png"

[[headers]]
  for = "/assets/memewarzone.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"

# Social crawlers need to fetch prepare share-card PNGs (override site-wide CORP).
[[headers]]
  for = "/api/prepare-share-card"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=120, s-maxage=300"

[[headers]]
  for = "/api/prepare-og/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=60, s-maxage=120"

# Proxy /api/* to the Coolify frontend API. Must come before the SPA fallback so
# relative API URLs in rendered HTML (e.g. share-card <img> src) don't fall
# through to /index.html.
[[redirects]]
  from = "/api/*"
  to = "http://bkhii7mo239putkb3h8xert9.178.104.232.231.sslip.io/api/:splat"
  status = 200
  force = true

# Social crawlers for Prepare Mode: edge function serves dynamic OG HTML
# (twitter:image → /api/prepare-share-card?slug=…). Humans still get the SPA.
[[edge_functions]]
  function = "prepare-og"
  path = "/prepare/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
