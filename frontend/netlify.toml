[build]
  # Netlify is a static frontend deploy. Contract compilation and ABI generation
  # run in the repository CI and the resulting frontend ABIs are committed.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/no-functions"

[build.environment]
  # Vite, React SWC, PostCSS and Tailwind CSS are direct build-only
  # devDependencies. Include them even when the Netlify UI sets NODE_ENV=production.
  # frontend/.nvmrc is kept on the same Node 20 major used by repository CI.
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  VITE_ENABLE_WAR_ROOM = "true"
  VITE_ENABLE_POSTGRAD = "false"
  VITE_ENABLE_POSTGRAD_ARENA = "false"
  VITE_ENABLE_POSTGRAD_BATTLE = "false"
  VITE_ENABLE_POSTGRAD_EVENTS = "false"
  VITE_ENABLE_POSTGRAD_LEAGUE = "false"
  VITE_ENABLE_POSTGRAD_MOCKS = "false"
  VITE_ENABLE_POSTGRAD_TOURNAMENT = "false"
  VITE_ENABLE_DIRECT_BNB_DEPLOY = "true"
  VITE_LAUNCHPAD_WRITES_ENABLED = "true"
  # League/summary, featured, upload, ably auth live on frontend-api — NOT the indexer.
  # Set VITE_FRONTEND_API_BASE / VITE_ABLY_AUTH_BASE in the host UI.

[[headers]]
  for = "/*"
  [headers.values]
    # frame-src explicitly allows CrypticPump partner embed (+ any https partner forms).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' https://crypticpump.com https://www.crypticpump.com https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self'; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Social platforms fetch OG images cross-origin. Site-wide CORP:same-origin
# blocks many unfurls — open the dedicated OG asset (and prepare PNGs).
[[headers]]
  for = "/assets/og.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"
    Content-Type = "image/png"

[[headers]]
  for = "/assets/memewarzone.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=86400, s-maxage=604800"

# Social crawlers need to fetch prepare share-card PNGs (override site-wide CORP).
[[headers]]
  for = "/api/prepare-share-card"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=120, s-maxage=300"

[[headers]]
  for = "/api/prepare-og/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=60, s-maxage=120"

[[headers]]
  for = "/api/battle-share-card"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=60, s-maxage=120"

[[headers]]
  for = "/api/battle-og/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=60, s-maxage=120"

# Proxy /api/* to the Coolify frontend API. Netlify stays static-only.
[[redirects]]
  from = "/api/*"
  to = "http://bkhii7mo239putkb3h8xert9.178.104.232.231.sslip.io/api/:splat"
  status = 200
  force = true

# Social crawlers for Prepare Mode: edge function serves dynamic OG HTML
# (twitter:image → /api/prepare-share-card?slug=…). Humans still get the SPA.
[[edge_functions]]
  function = "prepare-og"
  path = "/prepare/*"

[[edge_functions]]
  function = "battle-og"
  path = "/warzone/battles/*"

# Never SPA-fallback hashed Vite assets. After a redeploy, old tabs request
# deleted chunk names; returning index.html as text/html breaks dynamic import
# with "Expected a JavaScript module but got text/html".
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# index.html must revalidate so clients pick up new asset hashes after deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
