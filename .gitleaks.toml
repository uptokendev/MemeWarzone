title = "MemeWarzone gitleaks configuration"

[extend]
useDefault = true

# Gitleaks 8.24.3's generic-api-key rule can span adjacent empty assignments in
# this historical env-example patch and extract the next variable name as the
# "secret". The referenced commit was inspected: the private-key assignment is
# empty. Scope the exception to this one rule + one commit + one file only.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known false positive: empty BNB 6C test buyer key placeholder"
  condition = "AND"
  commits = [ "da4ea528bc60ffdfc7f9e8824ec564c2183dab00" ]
  paths = [ '''^config/bnb-testnet\.env\.example$''' ]

  # These historical Arena test commits contain deterministic public token
  # address fixtures. They are not credentials, but the default generic-api-key
  # heuristic classifies the high-entropy token_address values as secrets.
  # Keep the exception scoped to this rule, these exact commits, and this test
  # file so real generic API keys remain fully covered everywhere else.
  [[rules.allowlists]]
  description = "Known false positive: Arena token-address test fixtures"
  condition = "AND"
  commits = [
    "5c6fc05a277f811a8ee8f4de7b52c2ee94d2537e",
    "3dd137936d8d12f0a7275fd2500a90c6573fc2eb",
  ]
  paths = [ '''^frontend/api/lib/arenaTokenProfile\.test\.mjs$''' ]

  # Everglen is a public Solana mint used by the Project Import retention guard
  # and its regression test. It is not a credential. Scope this exception to the
  # exact public mint and the two assessment files only.
  [[rules.allowlists]]
  description = "Known false positive: Everglen public Solana mint"
  condition = "AND"
  regexes = [ '''FcBb7avR9LgmgwFxRcVJDiroZxZfgvtnUJrRKQ7kpump''' ]
  paths = [
    '''^frontend/api/lib/projectImportAssessment\.js$''',
    '''^frontend/api/lib/projectImportAssessment\.test\.mjs$''',
  ]

  # BONK's public Solana mint in the import fee runbook's example quote request
  # ("token":"<mint>"). It is not a credential. Scoped to the exact mint and the
  # one runbook.
  [[rules.allowlists]]
  description = "Known false positive: BONK public Solana mint in the import fee runbook"
  condition = "AND"
  regexes = [ '''DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263''' ]
  paths = [ '''^docs/release/IMPORT_CREATOR_FEES_GO_LIVE\.md$''' ]

  # STASH's public Robinhood token contract, used as the fixture in the import DEX probe tests
  # (const TOKEN = "0x..."). It is not a credential. Scoped to the exact address and the one test.
  [[rules.allowlists]]
  description = "Known false positive: STASH public Robinhood token address in the DEX probe tests"
  condition = "AND"
  regexes = [ '''(?i)0xe7dec18b0b29c8e02fb90a5dce413b3bc66e8251''' ]
  paths = [ '''^frontend/api/lib/arenaImportScanDexProbes\.test\.mjs$''' ]

  # Public on-chain constants of the import ownership / graduation checks (2026-10-29): four.meme's TokenManager,
  # the Robinhood token launcher and its creation event topic, Robinhood WETH, and the Raydium CPMM / LaunchLab program
  # ids. The default heuristic flags them because the variable names contain "token"/"auth". Not credentials.
  # Scoped to these exact values and the two files that hold them.
  [[rules.allowlists]]
  description = "Known false positive: public program ids, contract addresses and event topics in the import checks"
  condition = "AND"
  regexes = [ '''(?i)0x5c952063c7fc8610ffdb798152d69f0b9550762b''', '''(?i)0x0000fffFbe8efe702c8703ae3477ff5de3d319c0''', '''(?i)0x2e2b3f61b70d2d131b2a807371103cc98d51adcaa5e9a8f9c32658ad8426e74e''', '''(?i)0x0bd7d308f8e1639fab988df18a8011f41eacad73''', '''CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C''', '''LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj''' ]
  paths = [ '''^frontend/api/lib/projectImportEvmCreator\.js$''', '''^frontend/api/lib/projectImportGraduation\.test\.mjs$''' ]

  # CAKE's public BNB Chain token contract, the stand-in coin of the widget's BNB import fork proof
  # (const TOKEN = ... "0x..."). It is not a credential. Scoped to the exact address and the one test.
  [[rules.allowlists]]
  description = "Known false positive: CAKE public BNB token address in the widget BNB fork test"
  condition = "AND"
  regexes = [ '''(?i)0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82''' ]
  paths = [ '''^frontend/api/importSwap\.bsc\.fork\.test\.mjs$''' ]

  # $PFEAGLE's public Robinhood token contract, the fixture of the widget EVM route tests
  # (const TOKEN = "0x..."). It is not a credential. Scoped to the exact address and the one test.
  [[rules.allowlists]]
  description = "Known false positive: PFEAGLE public Robinhood token address in the widget EVM tests"
  condition = "AND"
  regexes = [ '''(?i)0x1a95c10e4839033686225eaad3ac348f0d8edc4f''' ]
  paths = [ '''^frontend/api/widgetSwapEvm\.test\.mjs$''' ]

  # Hardhat's public default accounts #1 and #0 (the well-known node test keys), the synthetic keys of the DogeOS
  # network-config test: they check that the dogeosTestnet network reads its own env name. Not credentials; never the
  # values in config/dogeos.local. Scoped to the two exact keys and the one test.
  [[rules.allowlists]]
  description = "Known false positive: Hardhat default test keys in the DogeOS network config test"
  condition = "AND"
  regexes = [ '''(?i)0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''', '''(?i)0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''' ]
  paths = [ '''^test/DogeosNetworkConfig\.spec\.ts$''' ]

  # A made-up mixed-case address (0xAbCdEf0123...) of the DogeOS feed isolation test (address normalisation).
  # Not a credential and not a real contract. Scoped to the exact value and the one test.
  [[rules.allowlists]]
  description = "Known false positive: synthetic mixed-case address in the feed chain isolation test"
  condition = "AND"
  regexes = [ '''0xAbCdEf0123456789aBcDeF0123456789AbCdEf01''' ]
  paths = [ '''^frontend/src/lib/feedChainIsolation\.test\.mjs$''' ]
